schema_version: "3.0"
target_concept: strict whole-body lateral orientation under matched viewpoint prompts
blind_analysis: true
special_values:
  unclear: The visible pixels do not support a reliable category.
  not_visible: The relevant evidence is not visible.
axis_catalog:
  torso_orientation_to_camera:
    label: Torso Orientation To Camera
    allowed_values:
      - frontal
      - lateral
      - rear
      - three_quarter
      - unclear
  face_presentation:
    label: Face Presentation
    allowed_values:
      - frontal
      - profile
      - rear_or_hidden
      - partial
      - unclear
  shoulder_presentation:
    label: Shoulder Presentation
    allowed_values:
      - frontal
      - lateral
      - rear
      - oblique
      - unclear
  hip_presentation:
    label: Hip Presentation
    allowed_values:
      - frontal
      - lateral
      - rear
      - oblique
      - unclear
  back_visibility:
    label: Back Visibility
    allowed_values:
      - visible
      - partial
      - not_visible
      - unclear
  orientation_assessability:
    label: Orientation Assessability
    allowed_values:
      - assessable
      - unassessable
      - unclear
  full_body_visibility:
    label: Full Body Visibility
    allowed_values:
      - visible
      - partial
      - not_visible
      - unclear
  ambiguity_or_artifact:
    label: Ambiguity Or Artifact
    allowed_values:
      - none
      - orientation_ambiguous
      - anatomy_artifact
      - composition_artifact
      - multiple
active_observation_axes:
  - torso_orientation_to_camera
  - face_presentation
  - shoulder_presentation
  - hip_presentation
  - back_visibility
  - orientation_assessability
  - full_body_visibility
  - ambiguity_or_artifact
contact_load:
  enabled: true
  fields:
    - left_hand
    - right_hand
    - left_forearm
    - right_forearm
  allowed_values:
    - none
    - light
    - moderate
    - heavy
    - unclear
morphology_candidates:
  primary:
    - strict_lateral_orientation_observation
  secondary: []
artifact_checks:
  - none
  - orientation_ambiguous
  - anatomy_artifact
  - composition_artifact
  - multiple
cross_domain_effects:
  enabled: true
  domains:
    - camera
    - composition
    - pose
  strength_values:
    - weak
    - moderate
    - strong
  effect_type_values:
    - interaction
    - spillover
    - constraint
rules:
  preserve_axis_labels_exactly: true
  preserve_axis_order: true
  output_all_active_axes_for_every_panel: true
  use_allowed_values_only: true
  visible_evidence_only: true
  enforce_visible_evidence_policy: true
  prompt_blind_freeze_required: true
  analyst_must_not_assign_target_alignment: true
  analyst_must_not_finalize_concept: true
  twenty_four_images_per_condition_are_bounded_evidence_only: true
blind_condition_label: COND-L7
run_id: CAM-040-A
