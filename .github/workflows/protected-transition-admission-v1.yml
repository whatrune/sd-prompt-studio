name: Protected Transition Admission V1

"on":
  workflow_dispatch:

permissions: {}

jobs:
  phase_0_non_admitting:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      PTA_REPOSITORY: ${{ github.repository }}
      PTA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PTA_WORKFLOW_REF: ${{ github.workflow_ref }}
      PTA_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PTA_REF: ${{ github.ref }}
      PTA_REF_NAME: ${{ github.ref_name }}
      PTA_SHA: ${{ github.sha }}
      PTA_RUN_ID: ${{ github.run_id }}
      PTA_RUN_ATTEMPT: ${{ github.run_attempt }}
      PTA_ACTOR: ${{ github.actor }}
      PTA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Diagnose runtime identity and fail closed
        shell: bash
        run: |
          set -u

          printf '%s\n' 'protected-transition-admission-v1 phase_0_non_admitting'
          printf 'repository=%s\n' "$PTA_REPOSITORY"
          printf 'default_branch=%s\n' "$PTA_DEFAULT_BRANCH"
          printf 'workflow_ref=%s\n' "$PTA_WORKFLOW_REF"
          printf 'workflow_sha=%s\n' "$PTA_WORKFLOW_SHA"
          printf 'ref=%s\n' "$PTA_REF"
          printf 'ref_name=%s\n' "$PTA_REF_NAME"
          printf 'sha=%s\n' "$PTA_SHA"
          printf 'run_id=%s\n' "$PTA_RUN_ID"
          printf 'run_attempt=%s\n' "$PTA_RUN_ATTEMPT"
          printf 'actor=%s\n' "$PTA_ACTOR"
          printf 'run_url=%s\n' "$PTA_RUN_URL"

          if [[ "$PTA_REF_NAME" != "$PTA_DEFAULT_BRANCH" ]]; then
            printf '%s\n' 'default_branch_check=failed'
            printf '%s\n' 'phase_0_result=non_admitting_failure'
            exit 1
          fi

          printf '%s\n' 'default_branch_check=passed'
          printf '%s\n' 'phase_0_result=non_admitting_failure'
          exit 1
