name: Protected Transition Admission V1

"on":
  workflow_dispatch:
    inputs:
      transition:
        description: Protected transition admission surface
        required: true
        type: choice
        options:
          - terminal_review_admission
          - merge_decision_admission
      task_issue_number:
        description: Current implementation Task Issue number
        required: true
        type: number
      pr_number:
        description: Current pull request number
        required: true
        type: string
      exact_head:
        description: Full current pull request HEAD SHA
        required: true
        type: string
  issue_comment:
    types:
      - created
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: read
  checks: read
  issues: read
  pull-requests: write
  statuses: read

concurrency:
  group: protected-transition-admission-v1-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || inputs.task_issue_number }}
  cancel-in-progress: false

jobs:
  protected_transition_admission_v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PTA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    outputs:
      repair_dispatch_b64: ${{ steps.evaluate.outputs.repair_dispatch_b64 }}
      repair_exact_head: ${{ steps.evaluate.outputs.repair_exact_head }}
      repair_next_action: ${{ steps.evaluate.outputs.repair_next_action }}
    steps:
      - name: Admit exact default-branch host identity
        shell: bash
        env:
          PTA_EVENT_NAME: ${{ github.event_name }}
          PTA_EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          PTA_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          workflow_ref_prefix="${GITHUB_REPOSITORY}/.github/workflows/protected-transition-admission-v1.yml@"
          [[ "$PTA_DEFAULT_BRANCH" == "main" ]]
          if [[ "$PTA_EVENT_NAME" == "pull_request" ]]; then
            [[ "$PTA_BASE_REF" == "main" ]]
            [[ "$GITHUB_REF" == "refs/pull/${PTA_EVENT_PR_NUMBER}/merge" ]]
            [[ "$GITHUB_WORKFLOW_REF" == "${workflow_ref_prefix}refs/"?* ]]
          else
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
            [[ "$GITHUB_WORKFLOW_REF" == "${workflow_ref_prefix}refs/heads/main" ]]
          fi
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact workflow SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Evaluate protected transition admission
        id: evaluate
        shell: bash
        env:
          PTA_EVENT_NAME: ${{ github.event_name }}
          PTA_EVENT_PATH: ${{ github.event_path }}
          PTA_INPUT_TRANSITION: ${{ inputs.transition }}
          PTA_INPUT_TASK_ISSUE_NUMBER: ${{ inputs.task_issue_number }}
          PTA_INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          PTA_INPUT_EXACT_HEAD: ${{ inputs.exact_head }}
        run: |
          set -euo pipefail
          result_file="$(mktemp)"
          if [[ "$PTA_EVENT_NAME" == "issue_comment" ]]; then
            node scripts/run-protected-transition-admission-v1.mjs \
              --review-event-file "$PTA_EVENT_PATH" | tee "$result_file"
          elif [[ "$PTA_EVENT_NAME" == "pull_request" ]]; then
            node scripts/run-protected-transition-admission-v1.mjs \
              --ready-event-file "$PTA_EVENT_PATH" | tee "$result_file"
          else
            node scripts/run-protected-transition-admission-v1.mjs \
              --transition "$PTA_INPUT_TRANSITION" \
              --task-issue-number "$PTA_INPUT_TASK_ISSUE_NUMBER" \
              --pr-number "$PTA_INPUT_PR_NUMBER" \
              --exact-head "$PTA_INPUT_EXACT_HEAD" | tee "$result_file"
          fi
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const output = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(output, `repair_next_action=${result.next_action ?? "NONE"}\n`);
            if (result.next_action === "REPAIR_EXECUTOR") {
              fs.appendFileSync(output, `repair_exact_head=${result.repair_dispatch.exact_head}\n`);
              fs.appendFileSync(output, `repair_dispatch_b64=${Buffer.from(JSON.stringify(result.repair_dispatch)).toString("base64")}\n`);
            }
          ' "$result_file"

  protected_transition_repair_executor_v1:
    needs: protected_transition_admission_v1
    if: needs.protected_transition_admission_v1.outputs.repair_next_action == 'REPAIR_EXECUTOR'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      state: ${{ steps.repair_result.outputs.state }}
      reason: ${{ steps.repair_result.outputs.reason }}
      next_action: ${{ steps.repair_result.outputs.next_action }}
      task_issue_number: ${{ steps.repair_result.outputs.task_issue_number }}
      pr_number: ${{ steps.repair_result.outputs.pr_number }}
      new_head: ${{ steps.repair_result.outputs.new_head }}
    steps:
      - name: Checkout exact repair HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.protected_transition_admission_v1.outputs.repair_exact_head }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Prepare current repair tuple
        id: repair_preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_DISPATCH_B64: ${{ needs.protected_transition_admission_v1.outputs.repair_dispatch_b64 }}
        run: |
          set -euo pipefail
          printf '%s' "$REPAIR_DISPATCH_B64" | base64 --decode > "$RUNNER_TEMP/repair-dispatch.json"
          node scripts/run-protected-transition-admission-v1.mjs \
            --repair-preflight-file "$RUNNER_TEMP/repair-dispatch.json" | tee "$RUNNER_TEMP/repair-preflight.json"
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/repair-preflight.json", "utf8"));
            if (result.next_action !== "REPAIR_AGENT") process.exit(1);
          '

      - name: Install pinned Codex CLI
        shell: bash
        run: npm install --global @openai/codex@0.147.0

      - name: Bind reviewed HEAD immediately before provider submission
        id: repair_provider_binding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REPAIR_ENV_ID: ${{ vars.CODEX_REPAIR_ENV_ID }}
          REPAIR_PROVIDER_TOKEN_PRESENT: ${{ secrets.CODEX_ACCESS_TOKEN != '' }}
        run: |
          set -euo pipefail
          node scripts/run-protected-transition-admission-v1.mjs \
            --repair-provider-submit-bind-file "$RUNNER_TEMP/repair-dispatch.json" | tee "$RUNNER_TEMP/repair-provider-binding.json"
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/repair-provider-binding.json", "utf8"));
            if (result.next_action !== "SUBMIT_REPAIR_TASK") process.exit(1);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `provider_branch=${result.provider_branch}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `prompt<<PTA_REPAIR_PROMPT\n${result.prompt}\nPTA_REPAIR_PROMPT\n`);
          '

      - name: Submit one Codex Cloud repair task
        shell: bash
        env:
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          CODEX_REPAIR_ENV_ID: ${{ vars.CODEX_REPAIR_ENV_ID }}
          REPAIR_PROVIDER_BRANCH: ${{ steps.repair_provider_binding.outputs.provider_branch }}
          REPAIR_PROMPT: ${{ steps.repair_provider_binding.outputs.prompt }}
        run: |
          set -euo pipefail
          printf '%s' "$REPAIR_PROMPT" |
            env CODEX_ACCESS_TOKEN="$CODEX_ACCESS_TOKEN" \
            codex cloud exec \
              --env "$CODEX_REPAIR_ENV_ID" \
              --attempts 1 \
              --branch "$REPAIR_PROVIDER_BRANCH" \
              - | tee "$RUNNER_TEMP/repair-provider-submission.txt"

      - name: Capture exact Codex Cloud task identity
        id: repair_provider_task
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-protected-transition-admission-v1.mjs \
            --repair-provider-submission-file "$RUNNER_TEMP/repair-provider-submission.txt" | tee "$RUNNER_TEMP/repair-provider-task.json"
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/repair-provider-task.json", "utf8"));
            if (result.next_action !== "POLL_REPAIR_TASK") process.exit(1);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `task_id=${result.task_id}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `task_url=${result.task_url}\n`);
          '

      - name: Poll only the exact Codex Cloud task
        shell: bash
        env:
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          REPAIR_PROVIDER_TASK_ID: ${{ steps.repair_provider_task.outputs.task_id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            set +e
            env CODEX_ACCESS_TOKEN="$CODEX_ACCESS_TOKEN" \
              codex cloud status "$REPAIR_PROVIDER_TASK_ID" > "$RUNNER_TEMP/repair-provider-status.txt"
            provider_status_exit=$?
            set -e
            if (( provider_status_exit == 0 )); then
              normalized_status_exit=0
            else
              normalized_status_exit=1
            fi
            set +e
            provider_status_json="$(env -u CODEX_ACCESS_TOKEN node scripts/run-protected-transition-admission-v1.mjs \
              --repair-provider-status-file "$RUNNER_TEMP/repair-provider-status.txt" \
              --provider-status-exit "$normalized_status_exit")"
            provider_projection_exit=$?
            set -e
            printf '%s\n' "$provider_status_json"
            provider_next_action="$(printf '%s' "$provider_status_json" | node -e '
              let raw = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { raw += chunk; });
              process.stdin.on("end", () => { process.stdout.write(JSON.parse(raw).next_action ?? "STOP"); });
            ')"
            if [[ "$provider_next_action" == "APPLY_REPAIR_TASK" && $provider_projection_exit -eq 0 ]]; then
              exit 0
            fi
            if [[ "$provider_next_action" != "WAIT" || $provider_projection_exit -ne 0 ]]; then
              exit 1
            fi
            sleep 15
          done
          exit 1

      - name: Rebind reviewed HEAD immediately before local apply
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REPAIR_ENV_ID: ${{ vars.CODEX_REPAIR_ENV_ID }}
          REPAIR_PROVIDER_TOKEN_PRESENT: ${{ secrets.CODEX_ACCESS_TOKEN != '' }}
        run: |
          set -euo pipefail
          node scripts/run-protected-transition-admission-v1.mjs \
            --repair-provider-apply-bind-file "$RUNNER_TEMP/repair-dispatch.json" \
            --provider-binding-file "$RUNNER_TEMP/repair-provider-binding.json" | tee "$RUNNER_TEMP/repair-provider-apply-binding.json"
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/repair-provider-apply-binding.json", "utf8"));
            if (result.next_action !== "APPLY_REPAIR_TASK") process.exit(1);
          '

      - name: Apply exact Codex Cloud task locally
        shell: bash
        env:
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          REPAIR_PROVIDER_TASK_ID: ${{ steps.repair_provider_task.outputs.task_id }}
        run: |
          set -euo pipefail
          env CODEX_ACCESS_TOKEN="$CODEX_ACCESS_TOKEN" codex apply "$REPAIR_PROVIDER_TASK_ID"

      - name: Project local provider completion
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"status":"completed","summary":"Codex Cloud task applied locally."}' > "$RUNNER_TEMP/repair-provider-result.json"

      - name: Rebind repair paths and validation profile
        id: repair_post_agent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/run-protected-transition-admission-v1.mjs \
            --repair-post-agent-file "$RUNNER_TEMP/repair-dispatch.json" \
            --provider-result-file "$RUNNER_TEMP/repair-provider-result.json" | tee "$RUNNER_TEMP/repair-post-agent.json"
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/repair-post-agent.json", "utf8"));
            if (result.next_action !== "VALIDATE_REPAIR") process.exit(1);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `profile=${result.validation_profile}\n`);
          '

      - name: Run exact repair validation profile
        shell: bash
        env:
          REPAIR_VALIDATION_PROFILE: ${{ steps.repair_post_agent.outputs.profile }}
        run: |
          set -euo pipefail
          if [[ "$REPAIR_VALIDATION_PROFILE" == "docs_only" ]]; then
            node scripts/test-role-execution-contracts.mjs
            git diff --check
          elif [[ "$REPAIR_VALIDATION_PROFILE" == "protected_transition" ]]; then
            focused_output="$(node scripts/test-protected-transition-admission-v1.mjs)"
            printf '%s\n' "$focused_output"
            [[ "$(printf '%s\n' "$focused_output" | tail -n 1)" == "protected-transition-admission-v1: 420 assertions passed" ]]
            node scripts/test-role-execution-contracts.mjs
            pnpm run validate:dictionary
            pnpm test
            pnpm run build
            git diff --check
          else
            exit 1
          fi

      - name: Recheck current HEAD and prepare one commit
        id: repair_commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_VALIDATION_SUCCEEDED: "true"
        run: |
          set -euo pipefail
          node scripts/run-protected-transition-admission-v1.mjs \
            --repair-commit-plan-file "$RUNNER_TEMP/repair-dispatch.json" | tee "$RUNNER_TEMP/repair-commit-plan.json"
          node -e '
            const fs = require("node:fs");
            const plan = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/repair-commit-plan.json", "utf8"));
            if (plan.next_action !== "COMMIT_AND_PUSH" || plan.force || plan.commit_count !== 1) process.exit(1);
            fs.writeFileSync(process.env.RUNNER_TEMP + "/repair-paths.txt", `${plan.paths.join("\n")}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `head_ref=${plan.head_ref}\n`);
          '
          mapfile -t repair_paths < "$RUNNER_TEMP/repair-paths.txt"
          git add -- "${repair_paths[@]}"
          [[ -n "$(git diff --cached --name-only)" ]]
          [[ "$(git diff --cached --name-only | sort)" == "$(sort "$RUNNER_TEMP/repair-paths.txt")" ]]
          git -c user.name='protected-transition-repair-v1' \
            -c user.email='protected-transition-repair-v1@users.noreply.github.com' \
            commit -m 'fix current protected transition blockers'
          [[ "$(git rev-list --count HEAD^..HEAD)" == "1" ]]
          echo "new_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push one normal non-force repair commit
        shell: bash
        env:
          REPAIR_EXECUTOR_PUSH_TOKEN: ${{ secrets.REPAIR_EXECUTOR_PUSH_TOKEN }}
          REPAIR_HEAD_REF: ${{ steps.repair_commit.outputs.head_ref }}
        run: |
          set -euo pipefail
          git push --porcelain \
            "https://x-access-token:${REPAIR_EXECUTOR_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${REPAIR_HEAD_REF}"

      - name: Rebind existing state and hand off fresh review
        id: repair_result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_NEW_HEAD: ${{ steps.repair_commit.outputs.new_head }}
        run: |
          set -euo pipefail
          node scripts/run-protected-transition-admission-v1.mjs \
            --repair-result-file "$RUNNER_TEMP/repair-dispatch.json" \
            --repair-evidence-file "$RUNNER_TEMP/repair-post-agent.json" \
            --new-head "$REPAIR_NEW_HEAD" | tee "$RUNNER_TEMP/repair-result.json"
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/repair-result.json", "utf8"));
            if (result.state !== "REVIEW_PENDING" || result.reason !== "fresh_review_required" || result.next_action !== "REVIEW" || result.current_head !== process.env.REPAIR_NEW_HEAD) process.exit(1);
            for (const [key, value] of Object.entries({
              state: result.state,
              reason: result.reason,
              next_action: result.next_action,
              task_issue_number: result.task_issue_number,
              pr_number: result.pr_number,
              new_head: result.current_head,
            })) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          '
