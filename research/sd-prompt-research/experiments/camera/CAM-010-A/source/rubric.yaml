    label: Hip Presentation
    allowed_values:
    - frontal
    - lateral
    - rear
    - oblique
    - unclear
  back_visibility:
    label: Back Visibility
    allowed_values:
    - visible
    - partial
    - not_visible
    - unclear
  orientation_assessability:
    label: Orientation Assessability
    allowed_values:
    - assessable
    - unassessable
    - unclear
  full_body_visibility:
    label: Full Body Visibility
    allowed_values:
    - visible
    - partial
    - not_visible
    - unclear
  ambiguity_or_artifact:
