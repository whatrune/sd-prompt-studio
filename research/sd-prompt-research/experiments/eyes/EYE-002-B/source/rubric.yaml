schema_version: '3.0'
run_id: EYE-002-B
target_concept: ''
blind_condition_label: C-5DA7848D6D0F1AEE
blind_analysis: true
special_values:
  unclear: Visible evidence is insufficient or conflicting.
  not_assessable: The visible eye evidence cannot support the requested judgment.
axis_catalog:
  eyes_visible:
    label: Eyes Visible
    allowed_values: [both, one, none, unclear]
  eye_state:
    label: Eye State
    allowed_values: [open, closed, one_closed, mixed, unclear]
  gaze_direction:
    label: Gaze Direction
    allowed_values: [toward_viewer, away, lateral, unclear, not_assessable]
  eye_state_assessable:
    label: Eye State Assessable
    allowed_values: ['yes', 'no']
  gaze_assessable:
    label: Gaze Assessable
    allowed_values: ['yes', 'no']
  ambiguity_or_artifact:
    label: Ambiguity Or Artifact
    allowed_values: [none, eye_anatomy, occlusion, gaze_ambiguous, composition, multiple]
active_observation_axes:
- eyes_visible
- eye_state
- gaze_direction
- eye_state_assessable
- gaze_assessable
- ambiguity_or_artifact
contact_load:
  enabled: false
  fields: []
  allowed_values: []
morphology_candidates:
  primary: [eye_state_gaze_composition]
  secondary: [none]
artifact_checks: [none, eye_anatomy, occlusion, gaze_ambiguous, composition, multiple]
cross_domain_effects:
  enabled: false
  domains: []
  strength_values: []
  effect_type_values: []
rules:
  preserve_axis_labels_exactly: true
  preserve_axis_order: true
  output_all_active_axes_for_every_panel: true
  use_allowed_values_only: true
  visible_evidence_only: true
  gaze_requires_pupil_or_eye_direction_evidence: true
  face_orientation_alone_is_insufficient_for_gaze: true
  closed_eyes_may_make_gaze_not_assessable: true
  closed_eyes_are_not_automatic_gaze_failures: true
  prompt_blind_freeze_required: true
  blind_rows_sha256_required_before_decode: true
  opaque_matched_pair_ids_only: true
  mapping_decode_after_freeze_required: true
  analyst_must_not_assign_target_alignment: true
  analyst_must_not_finalize_concept: true
decision_contract:
  prerequisite_failure_result: INCONCLUSIVE
  prerequisites:
    panel_completeness: {count: 12, total: 12}
    exact_matched_seed_count: 6
    eyes_visible_both_per_condition: {minimum_count: 5, total: 6}
    eye_state_assessable_yes_per_condition: {minimum_count: 5, total: 6}
    control_target_state: {minimum_count: 5, total: 6}
    ambiguity_or_artifact_non_none_per_condition: {maximum_count: 1, total: 6}
  classification_precedence:
  - classification: CONFIRMED_COEXISTENCE
    treatment_target_state: {minimum_count: 5, total: 6}
    treatment_gaze_assessable_toward_viewer: {minimum_count: 5, total: 6}
    treatment_joint_target_and_toward_viewer: {minimum_count: 5, total: 6}
  - classification: CONFIRMED_SUPPRESSION
    alternatives:
    - eye_state_suppression: control target changes to treatment target loss with viewer gaze in at least 5 of 6 matched pairs
    - gaze_suppression: treatment preserves target with assessable gaze and viewer gaze absent in at least 5 of 6 panels
  - classification: CONFIRMED_CONTRADICTION_OR_NONASSESSABILITY
    treatment_target_state: {minimum_count: 5, total: 6}
    treatment_gaze_not_assessable: {minimum_count: 5, total: 6}
  - classification: NO_MEANINGFUL_EFFECT
    eye_state_stable_matched_pairs: {minimum_count: 5, total: 6}
    treatment_gaze_assessable: {minimum_count: 5, total: 6}
    matched_gaze_classification_unchanged: {minimum_count: 5, total: 6}
    only_if_no_higher_precedence_classification: true
  - classification: INCONCLUSIVE
    rule: All remaining outcomes, including any 2-to-4-of-6 split.
