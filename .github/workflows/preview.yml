name: Pull Request Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up classifier Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Classify exact changed paths
        id: profile
        shell: bash
        env:
          EXACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          selector="research/sd-prompt-research/scripts/select_validation_profile.py"
          changed_paths_file="$RUNNER_TEMP/pr-changed-paths.zlist"
          [[ "$EXACT_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "invalid_base_sha" >&2; exit 1; }
          [[ "$EXACT_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "invalid_head_sha" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$EXACT_HEAD_SHA" ]] || { echo "checked_out_head_mismatch" >&2; exit 1; }
          git cat-file -e "$EXACT_BASE_SHA^{commit}"
          git cat-file -e "$EXACT_HEAD_SHA^{commit}"
          git diff --name-only -z --no-renames "$EXACT_BASE_SHA" "$EXACT_HEAD_SHA" -- > "$changed_paths_file"
          python "$selector" --paths-file "$changed_paths_file" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        if: steps.profile.outputs.runtime_deployable == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        if: steps.profile.outputs.runtime_deployable == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.profile.outputs.runtime_deployable == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.profile.outputs.runtime_deployable == 'true'
        run: pnpm test

      - name: Build preview
        if: steps.profile.outputs.runtime_deployable == 'true'
        run: pnpm build

      - name: Upload preview artifact
        if: steps.profile.outputs.runtime_deployable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Add preview instructions
        if: steps.profile.outputs.runtime_deployable == 'true'
        run: |
          echo '### Pull Request Preview' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the `preview-pr-${{ github.event.pull_request.number }}` artifact from this workflow run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Serve the extracted directory with any static web server to inspect the production build.' >> "$GITHUB_STEP_SUMMARY"

      - name: Record non-runtime preview result
        if: steps.profile.outputs.runtime_deployable != 'true'
        run: echo 'Canonical validation ownership classified this PR as non-runtime; no preview build is required.' >> "$GITHUB_STEP_SUMMARY"
