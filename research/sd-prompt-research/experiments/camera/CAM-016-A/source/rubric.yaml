schema_version: '3.0'
target_concept: ''
blind_condition_label: COND-01
blind_analysis: true
special_values:
  unclear: Visible evidence is insufficient or conflicting.
  not_visible: The anatomical region is cropped or fully obscured.
axis_catalog:
  upper_frame_boundary:
    label: Upper Frame Boundary
    allowed_values:
    - above_head
    - hair_or_head
    - face
    - neck_or_shoulders
    - upper_torso
    - mid_or_lower_torso
    - not_visible
    - unclear
  lower_frame_boundary:
    label: Lower Frame Boundary
    allowed_values:
    - below_feet
    - feet
    - lower_leg
    - knee
    - thigh
    - hip_or_pelvis
    - torso
    - not_visible
    - unclear
  head_visibility:
    label: Head Visibility
    allowed_values:
    - fully_visible
    - partially_cropped
    - not_visible
    - unclear
  upper_body_visibility:
    label: Upper Body Visibility
    allowed_values:
    - fully_visible
    - partially_cropped
    - not_visible
    - unclear
  lower_body_visibility:
    label: Lower Body Visibility
    allowed_values:
    - fully_visible
    - partially_cropped
    - not_visible
    - unclear
  feet_visibility:
    label: Feet Visibility
    allowed_values:
    - both_visible
    - one_visible
    - cropped
    - not_visible
    - unclear
  boundary_assessability:
    label: Boundary Assessability
    allowed_values:
    - assessable
    - unassessable
    - unclear
  camera_angle_observation:
    label: Camera Angle Observation
    allowed_values:
    - eye_level_like
    - high_angle_like
    - low_angle_like
    - unclear
  body_pose_observation:
    label: Body Pose Observation
    allowed_values:
    - standing
    - nonstanding
    - unclear
  ambiguity_or_artifact:
    label: Ambiguity Or Artifact
    allowed_values:
    - none
    - boundary_ambiguous
    - anatomy_artifact
    - composition_artifact
    - multiple
active_observation_axes:
- upper_frame_boundary
- lower_frame_boundary
- head_visibility
- upper_body_visibility
- lower_body_visibility
- feet_visibility
- boundary_assessability
- camera_angle_observation
- body_pose_observation
- ambiguity_or_artifact
contact_load:
  enabled: false
  fields:
  - left_hand
  - right_hand
  - left_forearm
  - right_forearm
  allowed_values:
  - none
  - light
  - supporting
  - weight_bearing
  - unclear
morphology_candidates:
  primary:
  - camera_crop_boundary_observation
  secondary:
  - none
artifact_checks:
- none
- boundary_ambiguous
- anatomy_artifact
- composition_artifact
- multiple
cross_domain_effects:
  enabled: false
  domains: []
  strength_values: []
  effect_type_values: []
rules:
  preserve_axis_labels_exactly: true
  preserve_axis_order: true
  output_all_active_axes_for_every_panel: true
  use_allowed_values_only: true
  visible_evidence_only: true
  enforce_visible_evidence_policy: true
  prompt_blind_freeze_required: true
  analyst_must_not_assign_target_alignment: true
  analyst_must_not_finalize_concept: true
  six_images_are_directional_evidence_only: true
run_id: CAM-016-A
