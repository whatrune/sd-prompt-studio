name: Protected Transition Admission V1

"on":
  workflow_dispatch:
    inputs:
      transition:
        description: Protected transition admission surface
        required: true
        type: choice
        options:
          - terminal_review_admission
          - merge_decision_admission
          - ready_transition_required_resume
      task_issue_number:
        description: Current implementation Task Issue number
        required: true
        type: number
      pr_number:
        description: Current pull request number
        required: true
        type: string
      exact_head:
        description: Full current pull request HEAD SHA
        required: true
        type: string
      review_decision_comment_id:
        description: Current canonical Review Decision comment ID for bounded Ready resume
        required: false
        type: string
      publication_handoff_comment_id:
        description: Current canonical Publication Handoff comment ID for bounded Ready resume
        required: false
        type: string
  issue_comment:
    types:
      - created
  pull_request:
    types:
      - ready_for_review

permissions:
  actions: read
  contents: read
  checks: read
  issues: read
  pull-requests: write
  statuses: read

concurrency:
  group: protected-transition-admission-v1-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || inputs.task_issue_number }}
  cancel-in-progress: false

jobs:
  protected_transition_admission_v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PTA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    outputs:
      repair_dispatch_b64: ${{ steps.evaluate.outputs.repair_dispatch_b64 }}
      repair_exact_head: ${{ steps.evaluate.outputs.repair_exact_head }}
      repair_next_action: ${{ steps.evaluate.outputs.repair_next_action }}
      next_action: ${{ steps.evaluate.outputs.next_action }}
      role_dispatch_b64: ${{ steps.evaluate.outputs.role_dispatch_b64 }}
      role_exact_head: ${{ steps.evaluate.outputs.role_exact_head }}
      terminal_result: ${{ steps.evaluate.outputs.terminal_result }}
      source_comment_id: ${{ steps.evaluate.outputs.source_comment_id }}
      authority_kind: ${{ steps.evaluate.outputs.authority_kind }}
      minimal_merge_plan_b64: ${{ steps.evaluate.outputs.minimal_merge_plan_b64 }}
    steps:
      - name: Admit exact default-branch host identity
        shell: bash
        env:
          PTA_EVENT_NAME: ${{ github.event_name }}
          PTA_EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          PTA_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          workflow_ref_prefix="${GITHUB_REPOSITORY}/.github/workflows/protected-transition-admission-v1.yml@"
          [[ "$PTA_DEFAULT_BRANCH" == "main" ]]
          if [[ "$PTA_EVENT_NAME" == "pull_request" ]]; then
            [[ "$PTA_BASE_REF" == "main" ]]
            [[ "$GITHUB_REF" == "refs/pull/${PTA_EVENT_PR_NUMBER}/merge" ]]
            [[ "$GITHUB_WORKFLOW_REF" == "${workflow_ref_prefix}refs/"?* ]]
          else
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
            [[ "$GITHUB_WORKFLOW_REF" == "${workflow_ref_prefix}refs/heads/main" ]]
          fi
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact workflow SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Evaluate protected transition admission
        id: evaluate
        shell: bash
        env:
          PTA_EVENT_NAME: ${{ github.event_name }}
          PTA_EVENT_PATH: ${{ github.event_path }}
          PTA_INPUT_TRANSITION: ${{ inputs.transition }}
          PTA_INPUT_TASK_ISSUE_NUMBER: ${{ inputs.task_issue_number }}
          PTA_INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          PTA_INPUT_EXACT_HEAD: ${{ inputs.exact_head }}
          PTA_INPUT_REVIEW_DECISION_COMMENT_ID: ${{ inputs.review_decision_comment_id }}
          PTA_INPUT_PUBLICATION_HANDOFF_COMMENT_ID: ${{ inputs.publication_handoff_comment_id }}
          GADP_LIVE_SHADOW_DIR: ${{ runner.temp }}/gadp-live-shadow-v1
        run: |
          set -euo pipefail
          result_file="$(mktemp)"
          if [[ "$PTA_EVENT_NAME" == "issue_comment" ]]; then
            node scripts/run-protected-transition-admission-v1.mjs \
              --review-event-file "$PTA_EVENT_PATH" | tee "$result_file"
          elif [[ "$PTA_EVENT_NAME" == "pull_request" ]]; then
            node scripts/run-protected-transition-admission-v1.mjs \
              --ready-event-file "$PTA_EVENT_PATH" | tee "$result_file"
          else
            resume_args=()
            if [[ -n "$PTA_INPUT_REVIEW_DECISION_COMMENT_ID" || -n "$PTA_INPUT_PUBLICATION_HANDOFF_COMMENT_ID" ]]; then
              resume_args=(
                --review-decision-comment-id "$PTA_INPUT_REVIEW_DECISION_COMMENT_ID"
                --publication-handoff-comment-id "$PTA_INPUT_PUBLICATION_HANDOFF_COMMENT_ID"
              )
            fi
            node scripts/run-protected-transition-admission-v1.mjs \
              --transition "$PTA_INPUT_TRANSITION" \
              --task-issue-number "$PTA_INPUT_TASK_ISSUE_NUMBER" \
              --pr-number "$PTA_INPUT_PR_NUMBER" \
              --exact-head "$PTA_INPUT_EXACT_HEAD" \
              "${resume_args[@]}" | tee "$result_file"
          fi
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const output = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(output, `repair_next_action=${result.next_action ?? "NONE"}\n`);
            fs.appendFileSync(output, `next_action=${result.next_action ?? "NONE"}\n`);
            fs.appendFileSync(output, `terminal_result=${result.terminal_result ?? "NONE"}\n`);
            fs.appendFileSync(output, `source_comment_id=${result.source_comment_id ?? ""}\n`);
            if (result.next_action === "MERGE_OPERATOR" && result.authority_kind === "MINIMAL_GOVERNANCE_V1") {
              const exactKeys = ["allowed", "authority_comment_id", "authority_kind", "authorized_paths", "automation_status", "current_head", "exact_head", "expected_base", "exit_code", "merge_method", "mutation_count", "next_action", "operation_count", "pr_number", "protected_operation_count", "reason", "repository", "sealed_snapshot_b64", "snapshot_sha256", "state", "task_issue_number", "terminal_result", "transition"];
              if (Object.keys(result).sort().join("\n") !== exactKeys.sort().join("\n") || result.terminal_result !== "MINIMAL_GOVERNANCE_V1" || result.exact_head !== result.current_head || result.merge_method !== "merge" || result.operation_count !== 1) throw new Error("minimal_governance_projection_invalid");
              fs.appendFileSync(output, `authority_kind=MINIMAL_GOVERNANCE_V1\n`);
              fs.appendFileSync(output, `role_exact_head=${result.exact_head}\n`);
              fs.appendFileSync(output, `minimal_merge_plan_b64=${Buffer.from(JSON.stringify(result)).toString("base64")}\n`);
            } else if (["IMPLEMENTER", "PRODUCT_OWNER_IMPLEMENTATION_LEAD", "INDEPENDENT_IMPLEMENTATION_REVIEWER", "INTEGRATED_LEAD_READY_REVIEW", "BOOTSTRAP_PUBLICATION_OPERATOR", "MERGE_OPERATOR"].includes(result.next_action)) {
              if (!result.role_dispatch || result.role_dispatch.next_action !== result.next_action || result.role_dispatch.exact_head !== result.current_head) throw new Error("role_dispatch_projection_invalid");
              fs.appendFileSync(output, `role_exact_head=${result.role_dispatch.exact_head}\n`);
              fs.appendFileSync(output, `role_dispatch_b64=${Buffer.from(JSON.stringify(result.role_dispatch)).toString("base64")}\n`);
            }
            if (result.next_action === "REPAIR_EXECUTOR") {
              fs.appendFileSync(output, `repair_exact_head=${result.repair_dispatch.exact_head}\n`);
              fs.appendFileSync(output, `repair_dispatch_b64=${Buffer.from(JSON.stringify(result.repair_dispatch)).toString("base64")}\n`);
            }
          ' "$result_file"

      - name: Run isolated non-authoritative GADP live shadow
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        env:
          GH_TOKEN: ""
        run: |
          set +e
          env -i \
            PATH="$PATH" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            node generic-platform/src/shadow/run-sd-prompt-studio-live-shadow-v1.mjs \
              --record-a-file "$RUNNER_TEMP/gadp-live-shadow-v1/record-a.json" \
              --record-b-file "$RUNNER_TEMP/gadp-live-shadow-v1/record-b.json" \
              --record-c-file "$RUNNER_TEMP/gadp-live-shadow-v1/record-c.json"
          exit 0

  protected_transition_role_dispatch_consumer_v1:
    needs: protected_transition_admission_v1
    if: contains(fromJSON('["IMPLEMENTER","PRODUCT_OWNER_IMPLEMENTATION_LEAD","INDEPENDENT_IMPLEMENTATION_REVIEWER","INTEGRATED_LEAD_READY_REVIEW","BOOTSTRAP_PUBLICATION_OPERATOR"]'), needs.protected_transition_admission_v1.outputs.next_action)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    steps:
      - name: Checkout exact role HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.protected_transition_admission_v1.outputs.role_exact_head }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Materialize immutable role host runner
        shell: pwsh
        env:
          ROLE_NEXT_ACTION: ${{ needs.protected_transition_admission_v1.outputs.next_action }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'role_powershell_major_invalid' }
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          if ($env:GITHUB_WORKFLOW_SHA -notmatch '^[0-9a-f]{40}$') { throw 'role_host_sha_invalid' }
          $runnerTempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([char[]]@('\', '/'))
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd([char[]]@('\', '/'))
          $hostRoot = [IO.Path]::GetFullPath((Join-Path $runnerTempRoot ("protected-transition-role-host-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)))
          if (-not $hostRoot.StartsWith($runnerTempRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'role_host_path_escape' }
          if ($hostRoot.StartsWith($workspaceRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'role_host_inside_target_workspace' }
          if (Test-Path -LiteralPath $hostRoot) { throw 'role_host_path_collision' }
          New-Item -ItemType Directory -Path $hostRoot -ErrorAction Stop | Out-Null
          git -C $hostRoot init --quiet
          if ($LASTEXITCODE -ne 0) { throw 'role_host_materialization_failed' }
          git -C $hostRoot remote add origin "https://github.com/$($env:GITHUB_REPOSITORY).git"
          if ($LASTEXITCODE -ne 0) { throw 'role_host_materialization_failed' }
          git -C $hostRoot fetch --no-tags --depth=1 origin $env:GITHUB_WORKFLOW_SHA
          if ($LASTEXITCODE -ne 0) { throw 'role_host_fetch_failed' }
          git -C $hostRoot checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0 -or (git -C $hostRoot rev-parse HEAD) -cne $env:GITHUB_WORKFLOW_SHA) { throw 'role_host_sha_mismatch' }
          $hostRunner = Join-Path $hostRoot 'scripts/run-protected-transition-admission-v1.mjs'
          $bootstrapRunner = Join-Path $hostRoot 'scripts/run-bootstrap-publication-operator-v1.mjs'
          if (-not (Test-Path -LiteralPath $hostRunner -PathType Leaf)) { throw 'role_host_runner_missing' }
          if (-not (Test-Path -LiteralPath $bootstrapRunner -PathType Leaf)) { throw 'bootstrap_host_runner_missing' }
          if ($env:ROLE_NEXT_ACTION -ceq 'BOOTSTRAP_PUBLICATION_OPERATOR') {
            if (-not (Test-Path -LiteralPath (Join-Path $hostRoot 'package-lock.json') -PathType Leaf)) { throw 'role_host_package_lock_missing' }
            Push-Location -LiteralPath $hostRoot
            try {
              npm ci
              if ($LASTEXITCODE -ne 0) { throw 'role_host_dependency_install_failed' }
            } finally {
              Pop-Location
            }
          }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "PTA_ROLE_HOST_RUNNER=$hostRunner$([Environment]::NewLine)", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "PTA_BOOTSTRAP_HOST_RUNNER=$bootstrapRunner$([Environment]::NewLine)", $utf8NoBom)

      - name: Bind bounded role dispatch
        id: role_dispatch_plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ROLE_DISPATCH_B64: ${{ needs.protected_transition_admission_v1.outputs.role_dispatch_b64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $dispatchPath = Join-Path $env:RUNNER_TEMP 'role-dispatch.json'
          $planPath = Join-Path $env:RUNNER_TEMP 'role-plan.json'
          $promptPath = Join-Path $env:RUNNER_TEMP 'role-prompt.txt'
          [IO.File]::WriteAllBytes($dispatchPath, [Convert]::FromBase64String($env:ROLE_DISPATCH_B64))
          node $env:PTA_ROLE_HOST_RUNNER --role-dispatch-file $dispatchPath 1> $planPath
          if ($LASTEXITCODE -ne 0) { throw 'role_dispatch_binding_failed' }
          $plan = Get-Content -LiteralPath $planPath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($plan.next_action -ceq 'CONVERGED_NOOP' -and $plan.exact_head -ceq '${{ needs.protected_transition_admission_v1.outputs.role_exact_head }}') {
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "operation=CONVERGED_NOOP$([Environment]::NewLine)", $utf8NoBom)
            exit 0
          }
          if ($plan.next_action -ceq 'EXECUTE_BOOTSTRAP_PUBLICATION' -and $plan.exact_head -ceq '${{ needs.protected_transition_admission_v1.outputs.role_exact_head }}') {
            $requestPath = Join-Path $env:RUNNER_TEMP 'bootstrap-publication-request.json'
            [IO.File]::WriteAllText($requestPath, ($plan.bootstrap_request | ConvertTo-Json -Compress -Depth 5), $utf8NoBom)
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "operation=EXECUTE_BOOTSTRAP_PUBLICATION$([Environment]::NewLine)", $utf8NoBom)
            exit 0
          }
          if ($plan.next_action -cne 'EXECUTE_ROLE' -or $plan.exact_head -cne '${{ needs.protected_transition_admission_v1.outputs.role_exact_head }}') { throw 'role_dispatch_not_ready' }
          [IO.File]::WriteAllText($promptPath, [string]$plan.prompt, $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "operation=EXECUTE_ROLE$([Environment]::NewLine)", $utf8NoBom)

      - name: Execute bounded role and host operation
        if: contains(fromJSON('["EXECUTE_ROLE","EXECUTE_BOOTSTRAP_PUBLICATION"]'), steps.role_dispatch_plan.outputs.operation)
        shell: pwsh
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          ROLE_OPERATION: ${{ steps.role_dispatch_plan.outputs.operation }}
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $dispatchPath = Join-Path $env:RUNNER_TEMP 'role-dispatch.json'
          $planPath = Join-Path $env:RUNNER_TEMP 'role-plan.json'
          $promptPath = Join-Path $env:RUNNER_TEMP 'role-prompt.txt'
          $outputPath = Join-Path $env:RUNNER_TEMP 'role-output.jsonl'
          $bodyPath = Join-Path $env:RUNNER_TEMP 'role-body.md'
          $resultPath = Join-Path $env:RUNNER_TEMP 'role-result.json'
          $dispatch = Get-Content -LiteralPath $dispatchPath -Raw -Encoding utf8 | ConvertFrom-Json
          $plan = Get-Content -LiteralPath $planPath -Raw -Encoding utf8 | ConvertFrom-Json
          $bootstrapOperatorResult = $null

          if ($env:ROLE_OPERATION -ceq 'EXECUTE_BOOTSTRAP_PUBLICATION') {
            $requestPath = Join-Path $env:RUNNER_TEMP 'bootstrap-publication-request.json'
            $operatorResultPath = Join-Path $env:RUNNER_TEMP 'bootstrap-publication-result.json'
            $request = Get-Content -LiteralPath $requestPath -Raw -Encoding utf8 | ConvertFrom-Json
            Push-Location -LiteralPath ([string]$request.reviewed_worktree_path)
            try {
              $priorErrorActionPreference = $ErrorActionPreference
              $ErrorActionPreference = 'Continue'
              node $env:PTA_BOOTSTRAP_HOST_RUNNER --request-file $requestPath 1> $operatorResultPath
              $operatorExit = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $priorErrorActionPreference
              Pop-Location
            }
            $operatorResult = Get-Content -LiteralPath $operatorResultPath -Raw -Encoding utf8 | ConvertFrom-Json
            if ($operatorExit -ne 0) {
              if ($operatorResult.status -cne 'STOP') { throw 'bootstrap_publication_operator_result_invalid' }
              throw "bootstrap_publication_operator_stopped_$([string]$operatorResult.reason)"
            }
            if (
              $operatorResult.status -cne 'SUCCESS' -or
              $operatorResult.reason -cne 'bootstrap_publication_complete' -or
              $operatorResult.mutation_count -ne 4 -or
              $operatorResult.protected_operation_count -ne 1
            ) { throw 'bootstrap_publication_operator_result_invalid' }
            $bootstrapOperatorResult = $operatorResult
          }

          function Invoke-BoundedRole {
            param([string]$PromptFile, [string]$Sandbox, [string]$JsonlFile, [string]$BodyFile, [string]$Workspace = $env:GITHUB_WORKSPACE)
            $prompt = [IO.File]::ReadAllText($PromptFile, $utf8NoBom)
            $priorOutputEncoding = $OutputEncoding
            $priorConsoleOutputEncoding = [Console]::OutputEncoding
            $priorErrorActionPreference = $ErrorActionPreference
            $priorToken = $env:GH_TOKEN
            try {
              $OutputEncoding = $utf8NoBom
              [Console]::OutputEncoding = $utf8NoBom
              $ErrorActionPreference = 'Continue'
              Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
              $events = [string[]]@($prompt | & codex.cmd exec -c features.shell_tool=false -c sandbox_workspace_write.network_access=false -c sandbox_workspace_write.writable_roots=[] --sandbox $Sandbox --ephemeral --json --cd $Workspace - 2>&1)
              $nativeExit = $LASTEXITCODE
            } finally {
              if ($null -eq $priorToken) { Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue } else { $env:GH_TOKEN = $priorToken }
              $OutputEncoding = $priorOutputEncoding
              [Console]::OutputEncoding = $priorConsoleOutputEncoding
              $ErrorActionPreference = $priorErrorActionPreference
            }
            [IO.File]::WriteAllLines($JsonlFile, $events, $utf8NoBom)
            if ($nativeExit -ne 0) { throw "role_provider_exec_failed_$nativeExit" }
            $terminalMessage = $null
            foreach ($line in $events) {
              try {
                $event = $line | ConvertFrom-Json -ErrorAction Stop
                if ($event.type -ceq 'item.completed' -and $event.item.type -ceq 'agent_message' -and -not [string]::IsNullOrWhiteSpace([string]$event.item.text)) { $terminalMessage = [string]$event.item.text }
              } catch { }
            }
            if ([string]::IsNullOrWhiteSpace($terminalMessage)) { throw 'role_provider_result_cardinality_invalid' }
            [IO.File]::WriteAllText($BodyFile, $terminalMessage, $utf8NoBom)
          }

          function Invoke-BoundedRoleUntilTerminal {
            param(
              [string]$PromptFile,
              [string]$Sandbox,
              [string]$JsonlFile,
              [string]$BodyFile,
              [string]$DispatchFile,
              [string]$Workspace = $env:GITHUB_WORKSPACE
            )
            for ($providerExecution = 1; $providerExecution -le 3; $providerExecution++) {
              Invoke-BoundedRole -PromptFile $PromptFile -Sandbox $Sandbox -JsonlFile $JsonlFile -BodyFile $BodyFile -Workspace $Workspace
              $terminalAgentMessage = [IO.File]::ReadAllText($BodyFile, $utf8NoBom)
              if ($terminalAgentMessage.Trim() -cne 'IN_PROGRESS') { return }
              if ($providerExecution -eq 3) { throw 'role_in_progress_retry_limit_reached' }
              Assert-FreshRoleBinding -DispatchFile $DispatchFile
            }
          }

          function Assert-RoleOutput {
            param([string]$DispatchFile, [string]$BodyFile, [string]$ExpectedAction, [string]$ResultFile, [string]$JsonlFile)
            node $env:PTA_ROLE_HOST_RUNNER --role-output-file $BodyFile --role-dispatch-file $DispatchFile --role-jsonl-file $JsonlFile 1> $ResultFile
            $validationExit = $LASTEXITCODE
            if ($validationExit -ne 0) {
              $diagnosticLines = @()
              try {
                $failure = Get-Content -LiteralPath $ResultFile -Raw -Encoding utf8 | ConvertFrom-Json
                $dispatch = Get-Content -LiteralPath $DispatchFile -Raw -Encoding utf8 | ConvertFrom-Json
                if (
                  $dispatch.next_action -ceq 'IMPLEMENTER' -and
                  $dispatch.source_binding.kind -ceq 'PRE_PR_IMPLEMENTATION_AUTHORITY'
                ) {
                  $requiredNames = [string[]]@(
                    'allowed', 'automation_status', 'exit_code', 'mutation_count', 'next_action', 'reason', 'state'
                  )
                  $actualNames = [string[]]@($failure.psobject.Properties.Name | Sort-Object)
                  if (
                    $null -eq $failure -or $actualNames.Count -ne 7 -or (Compare-Object $requiredNames $actualNames) -or
                    $failure.state -cne 'INDETERMINATE' -or $failure.allowed -ne $false -or
                    $failure.exit_code -ne 1 -or
                    $failure.reason -notin @(
                      'role_output_invalid',
                      'terminal_result_ambiguous_or_invalid',
                      'pre_pr_implementation_result_invalid'
                    ) -or
                    $failure.automation_status -cne 'BLOCKED' -or $failure.next_action -cne 'STOP' -or
                    $failure.mutation_count -ne 0
                  ) { throw 'pre_pr_implementer_role_output_failure_invalid' }
                  $diagnosticLines = @($failure | ConvertTo-Json -Compress -Depth 2)
                } elseif ($dispatch.next_action -ceq 'INDEPENDENT_IMPLEMENTATION_REVIEWER') {
                  $evidence = $failure.failure_evidence
                  $header = $evidence.header
                  $chunks = @($evidence.chunks)
                  $requiredHeaderNames = [string[]]@(
                    'binding_mismatch', 'body_capture_status', 'body_chunk_count', 'exact_head', 'field_names',
                    'parsed_field_count', 'parser_failure_reason', 'pr_number', 'record_type', 'run_attempt', 'run_id',
                    'scalar_types', 'selected_body_sha256', 'selected_body_utf8_byte_count', 'source_comment_id',
                    'task_issue_number', 'yaml_block_count'
                  )
                  $actualEvidenceNames = [string[]]@($evidence.psobject.Properties.Name | Sort-Object)
                  $actualHeaderNames = [string[]]@($header.psobject.Properties.Name | Sort-Object)
                  if (
                    $null -eq $evidence -or $null -eq $header -or $actualEvidenceNames.Count -ne 2 -or
                    (Compare-Object ([string[]]@('chunks', 'header')) $actualEvidenceNames) -or
                    $actualHeaderNames.Count -ne 17 -or (Compare-Object $requiredHeaderNames $actualHeaderNames)
                  ) { throw 'independent_reviewer_failure_evidence_shape_invalid' }
                  if (
                    $header.record_type -cne 'independent_reviewer_role_output_failure_evidence_v1' -or
                    $header.run_id -isnot [string] -or $header.run_id -cnotmatch '^[1-9]\d*$' -or
                    ($header.run_attempt -isnot [int] -and $header.run_attempt -isnot [long]) -or $header.run_attempt -lt 1 -or
                    ($header.task_issue_number -isnot [int] -and $header.task_issue_number -isnot [long]) -or $header.task_issue_number -ne $dispatch.task_issue_number -or
                    ($header.pr_number -isnot [int] -and $header.pr_number -isnot [long]) -or $header.pr_number -ne $dispatch.pr_number -or
                    $header.exact_head -isnot [string] -or $header.exact_head -cne $dispatch.exact_head -or
                    ($header.source_comment_id -isnot [int] -and $header.source_comment_id -isnot [long]) -or $header.source_comment_id -ne $dispatch.source_comment_id -or
                    $header.selected_body_sha256 -isnot [string] -or $header.selected_body_sha256 -cnotmatch '^[0-9a-f]{64}$'
                  ) { throw 'independent_reviewer_failure_evidence_header_invalid' }
                  foreach ($name in @('selected_body_utf8_byte_count', 'body_chunk_count', 'yaml_block_count', 'parsed_field_count')) {
                    $value = $header.$name
                    if (($value -isnot [int] -and $value -isnot [long]) -or $value -lt 0 -or $value -gt 9007199254740991) {
                      throw 'independent_reviewer_failure_evidence_count_invalid'
                    }
                  }
                  if ($header.field_names -isnot [System.Array] -or $header.scalar_types -isnot [System.Array]) {
                    throw 'independent_reviewer_failure_evidence_fields_invalid'
                  }
                  $fieldNames = @($header.field_names)
                  $scalarTypes = @($header.scalar_types)
                  if (
                    $fieldNames.Count -ne $header.parsed_field_count -or $scalarTypes.Count -ne $header.parsed_field_count -or
                    @($fieldNames | Where-Object { $_ -isnot [string] -or $_ -cnotmatch '^[a-z][a-z0-9_]*$' }).Count -ne 0 -or
                    @($scalarTypes | Where-Object { $_ -notin @('string', 'integer', 'boolean', 'invalid') }).Count -ne 0
                  ) { throw 'independent_reviewer_failure_evidence_fields_invalid' }
                  $bindingNames = [string[]]@($header.binding_mismatch.psobject.Properties.Name | Sort-Object)
                  if (
                    $null -eq $header.binding_mismatch -or (Compare-Object ([string[]]@('pull_request', 'reviewed_head', 'task_issue')) $bindingNames) -or
                    @($bindingNames | Where-Object { $header.binding_mismatch.$_ -notin @('MATCH', 'MISMATCH', 'UNAVAILABLE') }).Count -ne 0
                  ) { throw 'independent_reviewer_failure_evidence_binding_invalid' }
                  $allowedReasons = @(
                    'review_body_length_invalid', 'review_yaml_block_cardinality_invalid', 'review_yaml_scalar_invalid',
                    'review_scalar_invalid', 'review_record_type_invalid', 'review_authoring_role_invalid',
                    'review_task_issue_invalid', 'review_pull_request_invalid', 'review_reviewed_head_invalid',
                    'review_decision_invalid', 'review_count_type_invalid', 'review_count_value_invalid',
                    'review_status_invalid', 'review_execution_stop_reason_invalid', 'review_pr_binding_mismatch',
                    'review_head_binding_mismatch', 'selected_body_evidence_bound_exceeded', 'role_output_invalid_unclassified'
                  )
                  if ($header.parser_failure_reason -notin $allowedReasons) { throw 'independent_reviewer_failure_evidence_reason_invalid' }

                  if ($header.body_capture_status -ceq 'BOUND_EXCEEDED') {
                    if (
                      $header.selected_body_utf8_byte_count -le 262144 -or $header.body_chunk_count -ne 0 -or $chunks.Count -ne 0 -or
                      $header.yaml_block_count -ne 0 -or $header.parsed_field_count -ne 0 -or $fieldNames.Count -ne 0 -or
                      $scalarTypes.Count -ne 0 -or $header.parser_failure_reason -cne 'selected_body_evidence_bound_exceeded' -or
                      @($bindingNames | Where-Object { $header.binding_mismatch.$_ -cne 'UNAVAILABLE' }).Count -ne 0
                    ) { throw 'independent_reviewer_failure_evidence_overflow_invalid' }
                  } elseif ($header.body_capture_status -ceq 'CAPTURED') {
                    if (
                      $header.selected_body_utf8_byte_count -gt 262144 -or $header.body_chunk_count -gt 64 -or
                      $header.body_chunk_count -ne $chunks.Count
                    ) { throw 'independent_reviewer_failure_evidence_capture_invalid' }
                    $stream = [IO.MemoryStream]::new()
                    try {
                      for ($index = 0; $index -lt $chunks.Count; $index++) {
                        $chunk = $chunks[$index]
                        $chunkNames = [string[]]@($chunk.psobject.Properties.Name | Sort-Object)
                        if (
                          (Compare-Object ([string[]]@('body_base64', 'chunk_count', 'chunk_index', 'raw_byte_count', 'record_type')) $chunkNames) -or
                          $chunk.record_type -cne 'independent_reviewer_role_output_failure_body_chunk_v1' -or
                          $chunk.chunk_index -ne $index -or $chunk.chunk_count -ne $chunks.Count -or
                          ($chunk.raw_byte_count -isnot [int] -and $chunk.raw_byte_count -isnot [long]) -or
                          $chunk.raw_byte_count -lt 1 -or $chunk.raw_byte_count -gt 4096 -or $chunk.body_base64 -isnot [string]
                        ) { throw 'independent_reviewer_failure_evidence_chunk_invalid' }
                        try { $bytes = [Convert]::FromBase64String($chunk.body_base64) } catch { throw 'independent_reviewer_failure_evidence_chunk_invalid' }
                        if (
                          $bytes.Length -ne $chunk.raw_byte_count -or [Convert]::ToBase64String($bytes) -cne $chunk.body_base64 -or
                          ($index -lt ($chunks.Count - 1) -and $bytes.Length -ne 4096)
                        ) { throw 'independent_reviewer_failure_evidence_chunk_invalid' }
                        $stream.Write($bytes, 0, $bytes.Length)
                      }
                      $capturedBytes = $stream.ToArray()
                    } finally { $stream.Dispose() }
                    $sha256 = [Security.Cryptography.SHA256]::Create()
                    try { $capturedSha256 = ([BitConverter]::ToString($sha256.ComputeHash($capturedBytes))).Replace('-', '').ToLowerInvariant() } finally { $sha256.Dispose() }
                    if ($capturedBytes.Length -ne $header.selected_body_utf8_byte_count -or $capturedSha256 -cne $header.selected_body_sha256) {
                      throw 'independent_reviewer_failure_evidence_binding_invalid'
                    }
                  } else { throw 'independent_reviewer_failure_evidence_capture_invalid' }
                  $diagnosticLines = @($header | ConvertTo-Json -Compress -Depth 5)
                  $diagnosticLines += @($chunks | ForEach-Object { $_ | ConvertTo-Json -Compress -Depth 3 })
                } else {
                  $detail = $failure.bounded_metadata
                  $requiredNames = [string[]]@(
                    'expected_body_sha256', 'extra_field_names', 'malformed_jsonl_line_count', 'missing_field_names',
                    'non_empty_agent_message_count', 'selected_body_sha256', 'total_jsonl_line_count',
                    'type_mismatch_field_names', 'value_mismatch_field_names'
                  )
                  $actualNames = [string[]]@($detail.psobject.Properties.Name | Sort-Object)
                  if ($null -eq $detail -or $actualNames.Count -ne 9 -or (Compare-Object $requiredNames $actualNames)) {
                    throw 'role_output_diagnostic_shape_invalid'
                  }
                  foreach ($name in @('total_jsonl_line_count', 'malformed_jsonl_line_count', 'non_empty_agent_message_count')) {
                    $value = $detail.$name
                    if (($value -isnot [int] -and $value -isnot [long]) -or $value -lt 0 -or $value -gt 9007199254740991) {
                      throw 'role_output_diagnostic_count_invalid'
                    }
                  }
                  if ($detail.malformed_jsonl_line_count -gt $detail.total_jsonl_line_count -or $detail.non_empty_agent_message_count -gt $detail.total_jsonl_line_count) { throw 'role_output_diagnostic_count_invalid' }
                  foreach ($name in @('selected_body_sha256', 'expected_body_sha256')) {
                    if ($detail.$name -isnot [string] -or $detail.$name -cnotmatch '^[0-9a-f]{64}$') { throw 'role_output_diagnostic_digest_invalid' }
                  }
                  foreach ($name in @('missing_field_names', 'extra_field_names', 'type_mismatch_field_names', 'value_mismatch_field_names')) {
                    if ($detail.$name -isnot [System.Array]) { throw 'role_output_diagnostic_field_names_invalid' }
                    $rawNames = @($detail.$name)
                    if ($rawNames.Count -gt 22 -or @($rawNames | Where-Object { $_ -isnot [string] -or $_ -cnotmatch '^[a-z][a-z0-9_]*$' }).Count -ne 0) { throw 'role_output_diagnostic_field_names_invalid' }
                    $sortedNames = [string[]]@($rawNames | Sort-Object -Unique)
                    if ($sortedNames.Count -ne $rawNames.Count -or (Compare-Object ([string[]]$rawNames) $sortedNames -SyncWindow 0)) { throw 'role_output_diagnostic_field_names_invalid' }
                  }
                  $diagnosticLines = @($detail | ConvertTo-Json -Compress -Depth 4)
                }
              } catch {
                $diagnosticLines = @()
              }
              foreach ($diagnosticLine in $diagnosticLines) { [Console]::Error.WriteLine($diagnosticLine) }
              throw 'role_output_validation_failed'
            }
            $validated = Get-Content -LiteralPath $ResultFile -Raw -Encoding utf8 | ConvertFrom-Json
            $actionValid = if ($ExpectedAction -ceq 'PUBLISH_READY_AUTHORITY_OR_NONE') {
              $validated.next_action -in @('PUBLISH_READY_AUTHORITY', 'NONE')
            } else {
              $validated.next_action -ceq $ExpectedAction
            }
            if (-not $actionValid) { throw 'role_output_operation_invalid' }
            return $validated
          }

          function Assert-FreshRoleBinding {
            param([string]$DispatchFile, [string]$Operation = 'canonical_write', [Nullable[Int64]]$AuthorityCommentId = $null, [string]$NewHead = $null)
            $rebindPath = Join-Path $env:RUNNER_TEMP ("role-rebind-{0}.json" -f ([Guid]::NewGuid().ToString('N')))
            $arguments = @('--role-rebind-file', $DispatchFile, '--operation', $Operation)
            if ($null -ne $AuthorityCommentId) { $arguments += @('--authority-comment-id', [string]$AuthorityCommentId) }
            if (-not [string]::IsNullOrWhiteSpace($NewHead)) { $arguments += @('--new-head', $NewHead) }
            try {
              node $env:PTA_ROLE_HOST_RUNNER @arguments 1> $rebindPath
              if ($LASTEXITCODE -ne 0) { throw 'role_pre_operation_rebind_failed' }
              $rebound = Get-Content -LiteralPath $rebindPath -Raw -Encoding utf8 | ConvertFrom-Json
              if ($rebound.next_action -cne 'PROTECTED_OPERATION_READY' -or $rebound.mutation_count -ne 0) { throw 'role_pre_operation_rebind_invalid' }
            } finally {
              Remove-Item -LiteralPath $rebindPath -Force -ErrorAction SilentlyContinue
            }
          }

          function Publish-CanonicalComment {
            param([string]$BodyFile)
            $priorToken = $env:GH_TOKEN
            try {
              Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
              $payload = @{ body = [IO.File]::ReadAllText($BodyFile, $utf8NoBom) } | ConvertTo-Json -Compress
              $posted = $payload | gh api --method POST "repos/$($dispatch.repository)/issues/$($dispatch.task_issue_number)/comments" --input - | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or -not $posted.id) { throw 'role_comment_post_failed' }
              $fresh = gh api "repos/$($dispatch.repository)/issues/comments/$($posted.id)" | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or $fresh.issue_url -cne "https://api.github.com/repos/$($dispatch.repository)/issues/$($dispatch.task_issue_number)" -or $fresh.body -cne [IO.File]::ReadAllText($BodyFile, $utf8NoBom)) { throw 'role_comment_refetch_mismatch' }
              return $fresh
            } finally {
              if ($null -eq $priorToken) { Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue } else { $env:GH_TOKEN = $priorToken }
            }
          }

          function Publish-ReadyTransitionAuthority {
            param(
              [Parameter(Mandatory = $true)][string]$DispatchFile,
              [Parameter(Mandatory = $true)][string]$OwnerResultFile
            )
            $priorToken = $env:GH_TOKEN
            try {
              Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
              $placeholder = @{ body = '<!-- ready-transition-authority-v1:self-binding -->' } | ConvertTo-Json -Compress
              $posted = $placeholder | gh api --method POST "repos/$($dispatch.repository)/issues/$($dispatch.task_issue_number)/comments" --input - | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or -not $posted.id) { throw 'ready_authority_post_failed' }
              $canonicalUrl = "https://github.com/$($dispatch.repository)/issues/$($dispatch.task_issue_number)#issuecomment-$($posted.id)"
              $authorityBodyPath = Join-Path $env:RUNNER_TEMP 'ready-transition-authority-body.md'
              node --input-type=module -e "import { readFileSync } from 'node:fs'; import { pathToFileURL } from 'node:url'; const owner = await import(pathToFileURL(process.argv[2]).href); const dispatch = JSON.parse(readFileSync(process.argv[3], 'utf8')); const result = JSON.parse(readFileSync(process.argv[4], 'utf8')); process.stdout.write(owner.projectReadyTransitionAuthorityBodyV1({ dispatch, ownerResult: result, authorityCommentId: Number(process.argv[5]) }));" ready-authority-helper-import $env:PTA_ROLE_HOST_RUNNER $DispatchFile $OwnerResultFile ([string]$posted.id) 1> $authorityBodyPath
              if ($LASTEXITCODE -ne 0) { throw 'ready_authority_projection_failed' }
              $authorityBody = [IO.File]::ReadAllText($authorityBodyPath, [Text.UTF8Encoding]::new($false))
              $payload = @{ body = $authorityBody } | ConvertTo-Json -Compress
              $updated = $payload | gh api --method PATCH "repos/$($dispatch.repository)/issues/comments/$($posted.id)" --input - | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or $updated.id -ne $posted.id -or $updated.html_url -cne $canonicalUrl -or $updated.body -cne $authorityBody) { throw 'ready_authority_bind_failed' }
              return $updated
            } finally {
              if ($null -eq $priorToken) { Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue } else { $env:GH_TOKEN = $priorToken }
            }
          }

          function Invoke-AdmittedReviewThreadClosure {
            param(
              [Parameter(Mandatory = $true)][string]$DispatchFile,
              [Parameter(Mandatory = $true)][string]$OwnerResultFile,
              [Parameter(Mandatory = $true)][object]$PublishedComment
            )
            $ownerResult = Get-Content -LiteralPath $OwnerResultFile -Raw -Encoding utf8 | ConvertFrom-Json
            if ($null -eq $ownerResult.thread_action) { return }
            $ownerDispatch = Get-Content -LiteralPath $DispatchFile -Raw -Encoding utf8 | ConvertFrom-Json
            if (
              $ownerDispatch.next_action -cne 'INDEPENDENT_IMPLEMENTATION_REVIEWER' -or
              $ownerDispatch.purpose -cne 'INDEPENDENT_IMPLEMENTATION_REVIEWER' -or
              $PublishedComment.html_url -cne "https://github.com/$($ownerDispatch.repository)/issues/$($ownerDispatch.task_issue_number)#issuecomment-$($PublishedComment.id)"
            ) { throw 'review_thread_action_owner_publication_invalid' }
            $eventPath = Join-Path $env:RUNNER_TEMP 'role-review-owner-event.json'
            $routePath = Join-Path $env:RUNNER_TEMP 'role-review-owner-route.json'
            $actionPath = Join-Path $env:RUNNER_TEMP 'role-review-owner-action.json'
            $closurePath = Join-Path $env:RUNNER_TEMP 'role-review-owner-closure.json'
            $reviewEvent = [ordered]@{
              action = 'created'
              repository = [ordered]@{ full_name = [string]$ownerDispatch.repository }
              issue = [ordered]@{
                number = [int64]$ownerDispatch.task_issue_number
                state = 'open'
                html_url = "https://github.com/$($ownerDispatch.repository)/issues/$($ownerDispatch.task_issue_number)"
              }
              comment = [ordered]@{
                id = [int64]$PublishedComment.id
                created_at = [string]$PublishedComment.created_at
                author_association = [string]$PublishedComment.author_association
                html_url = [string]$PublishedComment.html_url
                body = [string]$PublishedComment.body
              }
            }
            [IO.File]::WriteAllText($eventPath, ($reviewEvent | ConvertTo-Json -Depth 8 -Compress), $utf8NoBom)
            node $env:PTA_ROLE_HOST_RUNNER --review-event-file $eventPath --review-owner-dispatch-file $DispatchFile --review-owner-result-file $OwnerResultFile 1> $routePath
            if ($LASTEXITCODE -ne 0) { throw 'review_thread_action_owner_route_failed' }
            $route = Get-Content -LiteralPath $routePath -Raw -Encoding utf8 | ConvertFrom-Json
            if (
              $route.next_action -cne 'THREAD_RESOLUTION' -or $route.mutation_count -ne 0 -or
              @($route.thread_action.psobject.Properties).Count -ne 8 -or
              $route.thread_action.repository -cne $ownerResult.thread_action.repository -or
              $route.thread_action.task_issue_number -ne $ownerResult.thread_action.task_issue_number -or
              $route.thread_action.pr_number -ne $ownerResult.thread_action.pr_number -or
              $route.thread_action.reviewed_head -cne $ownerResult.thread_action.reviewed_head -or
              $route.thread_action.review_thread_node_id -cne $ownerResult.thread_action.review_thread_node_id -or
              $route.thread_action.disposition -cne $ownerResult.thread_action.disposition -or
              $route.thread_action.review_decision_comment_id -ne $PublishedComment.id -or
              $route.thread_action.review_decision_url -cne $PublishedComment.html_url
            ) { throw 'review_thread_action_owner_route_invalid' }
            [IO.File]::WriteAllText($actionPath, ($route.thread_action | ConvertTo-Json -Compress), $utf8NoBom)
            node $env:PTA_ROLE_HOST_RUNNER --review-closure-file $actionPath 1> $closurePath
            if ($LASTEXITCODE -ne 0) { throw 'review_thread_action_closure_failed' }
            $closure = Get-Content -LiteralPath $closurePath -Raw -Encoding utf8 | ConvertFrom-Json
            if (
              $closure.transition -cne 'review_closure' -or $closure.state -cne 'COMPLETED' -or
              $closure.next_action -cne 'NONE' -or $closure.mutation_count -ne 1
            ) { throw 'review_thread_action_closure_invalid' }
          }

          if ($null -ne $bootstrapOperatorResult) {
            $request = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'bootstrap-publication-request.json') -Raw -Encoding utf8 | ConvertFrom-Json
            $owner = $plan.bootstrap_owner_binding
            $authorized = [string[]]@($request.authorized_paths | Sort-Object -Unique)
            $state = $bootstrapOperatorResult.task_state
            $statePaths = [string[]]@($state.authorized_paths | Sort-Object -Unique)
            if (
              $bootstrapOperatorResult.repository -cne $request.repository -or
              $bootstrapOperatorResult.task_issue_number -ne $request.task_issue_number -or
              $bootstrapOperatorResult.branch -cne $request.branch -or
              $bootstrapOperatorResult.pushed_head -isnot [string] -or $bootstrapOperatorResult.pushed_head -cnotmatch '^[0-9a-f]{40}$' -or
              $bootstrapOperatorResult.pushed_head -ceq $request.expected_parent_head -or
              ($bootstrapOperatorResult.pr_number -isnot [long] -and $bootstrapOperatorResult.pr_number -isnot [int]) -or
              $bootstrapOperatorResult.pr_number -le 0 -or
              $null -eq $owner -or $owner.decision_comment_id -ne $dispatch.source_comment_id -or
              $owner.result_handoff_comment_id -ne $dispatch.source_binding.result_handoff_comment_id -or
              ($owner.pre_pr_implementation_authority_comment_id -isnot [long] -and $owner.pre_pr_implementation_authority_comment_id -isnot [int]) -or
              $owner.pre_pr_implementation_authority_comment_id -le 0 -or
              $state.record_type -cne 'protected_transition_task_state_v1' -or
              $state.task_issue_number -ne $request.task_issue_number -or
              $state.pr_number -ne $bootstrapOperatorResult.pr_number -or
              $state.observed_head -cne $bootstrapOperatorResult.pushed_head -or
              $state.review_status -cne 'PENDING' -or $null -ne $state.reviewed_head -or $null -ne $state.review_blocker_count -or
              (Compare-Object $statePaths $authorized)
            ) { throw 'bootstrap_publication_handoff_binding_invalid' }

            $pull = gh api "repos/$($request.repository)/pulls/$($bootstrapOperatorResult.pr_number)" | ConvertFrom-Json
            if (
              $LASTEXITCODE -ne 0 -or $pull.number -ne $bootstrapOperatorResult.pr_number -or
              $pull.html_url -cne $bootstrapOperatorResult.pr_url -or $pull.base.repo.full_name -cne $request.repository -or
              $pull.state -cne 'open' -or $pull.draft -ne $true -or $pull.merged -ne $false -or
              $pull.base.ref -cne 'main' -or $pull.head.sha -cne $bootstrapOperatorResult.pushed_head
            ) { throw 'bootstrap_publication_handoff_pull_invalid' }
            $stateRebindInputPath = Join-Path $env:RUNNER_TEMP 'bootstrap-publication-task-state-rebind.json'
            $stateRebindResultPath = Join-Path $env:RUNNER_TEMP 'bootstrap-publication-task-state-rebound.json'
            $stateRebindInput = [ordered]@{
              pullBody = [string]$pull.body
              operatorTaskState = $state
              taskIssueNumber = [int64]$request.task_issue_number
              prNumber = [int64]$bootstrapOperatorResult.pr_number
              pushedHead = [string]$bootstrapOperatorResult.pushed_head
              authorizedPaths = $authorized
            }
            [IO.File]::WriteAllText($stateRebindInputPath, ($stateRebindInput | ConvertTo-Json -Compress -Depth 8), $utf8NoBom)
            node --input-type=module -e "import { readFileSync } from 'node:fs'; import { pathToFileURL } from 'node:url'; const owner = await import(pathToFileURL(process.argv[2]).href); const input = JSON.parse(readFileSync(process.argv[3], 'utf8')); process.stdout.write(JSON.stringify(owner.verifyBootstrapPublicationTaskStateV1(input)));" task-state-helper-import $env:PTA_ROLE_HOST_RUNNER $stateRebindInputPath 1> $stateRebindResultPath
            if ($LASTEXITCODE -ne 0) { throw 'bootstrap_publication_task_state_changed' }
            $freshState = Get-Content -LiteralPath $stateRebindResultPath -Raw -Encoding utf8 | ConvertFrom-Json
            if (
              $freshState.task_issue_number -ne $request.task_issue_number -or
              $freshState.pr_number -ne $bootstrapOperatorResult.pr_number -or
              $freshState.observed_head -cne $bootstrapOperatorResult.pushed_head -or
              (Compare-Object ([string[]]@($freshState.authorized_paths)) $authorized)
            ) { throw 'bootstrap_publication_task_state_changed' }
            $commit = gh api "repos/$($request.repository)/commits/$($bootstrapOperatorResult.pushed_head)" | ConvertFrom-Json
            if (
              $LASTEXITCODE -ne 0 -or $commit.sha -cne $bootstrapOperatorResult.pushed_head -or
              @($commit.parents).Count -ne 1 -or $commit.parents[0].sha -cne $request.expected_parent_head
            ) { throw 'bootstrap_publication_handoff_parent_invalid' }

            $publicationPath = Join-Path $env:RUNNER_TEMP 'bootstrap-publication-handoff.md'
            $pathLines = ($authorized | ForEach-Object { "- ``$_``" }) -join [Environment]::NewLine
            $taskUrl = "https://github.com/$($request.repository)/issues/$($request.task_issue_number)"
            $publication = "## Publication Handoff — Bootstrap Publication Operator V1`n`n- Bootstrap Publication Decision: $taskUrl#issuecomment-$($owner.decision_comment_id)`n- Pre-PR Result Handoff: $taskUrl#issuecomment-$($owner.result_handoff_comment_id)`n- Pre-PR Implementation Authority: $taskUrl#issuecomment-$($owner.pre_pr_implementation_authority_comment_id)`n- target PR: ``#$($bootstrapOperatorResult.pr_number)```n- published HEAD: ``$($bootstrapOperatorResult.pushed_head)```n- exact parent: ``$($request.expected_parent_head)```n- push mode: create-only empty-lease CAS`n- local / remote HEAD equality: PASS`n`n### Published scope`n`n$pathLines`n`n### Terminal state`n`n- status: ``completed```n- execution_stop_reason: ``completed```n"
            [IO.File]::WriteAllText($publicationPath, $publication, $utf8NoBom)
            $null = Publish-CanonicalComment -BodyFile $publicationPath
            exit 0
          }

          $prePrImplementer = $dispatch.next_action -ceq 'IMPLEMENTER' -and $dispatch.source_binding.kind -ceq 'PRE_PR_IMPLEMENTATION_AUTHORITY'
          $prePrPublicationDecision = $dispatch.next_action -ceq 'PRODUCT_OWNER_IMPLEMENTATION_LEAD' -and $dispatch.source_binding.kind -ceq 'PRE_PR_IMPLEMENTATION_RESULT'
          $roleWorkspace = if ($prePrImplementer) { [string]$dispatch.source_binding.worktree } else { $env:GITHUB_WORKSPACE }
          if ($prePrImplementer -and -not (Test-Path -LiteralPath $roleWorkspace -PathType Container)) { throw 'pre_pr_implementation_worktree_missing' }
          $sandbox = if ($plan.read_only) { 'read-only' } else { 'workspace-write' }
          Invoke-BoundedRoleUntilTerminal -PromptFile $promptPath -Sandbox $sandbox -JsonlFile $outputPath -BodyFile $bodyPath -DispatchFile $dispatchPath -Workspace $roleWorkspace
          $expected = if ($prePrImplementer) { 'RUN_PRE_PR_VALIDATION' } elseif ($prePrPublicationDecision) { 'POST_PRE_PR_PUBLICATION_DECISION' } elseif ($dispatch.next_action -ceq 'IMPLEMENTER') { 'VALIDATE_IMPLEMENTATION' } elseif ($dispatch.purpose -ceq 'MERGE_DECISION') { 'POST_MERGE_DECISION' } elseif ($dispatch.next_action -ceq 'INDEPENDENT_IMPLEMENTATION_REVIEWER') { 'POST_REVIEW' } elseif ($dispatch.next_action -ceq 'INTEGRATED_LEAD_READY_REVIEW') { 'PUBLISH_READY_AUTHORITY_OR_NONE' } else { 'COMMIT_PUSH_PUBLISH' }
          $validated = Assert-RoleOutput -DispatchFile $dispatchPath -BodyFile $bodyPath -ExpectedAction $expected -ResultFile $resultPath -JsonlFile $outputPath

          if ($dispatch.next_action -ceq 'INTEGRATED_LEAD_READY_REVIEW') {
            if ($validated.next_action -ceq 'NONE') { exit 0 }
            Assert-FreshRoleBinding -DispatchFile $dispatchPath
            $authorityComment = Publish-ReadyTransitionAuthority -DispatchFile $dispatchPath -OwnerResultFile $resultPath
            $operatorPath = Join-Path $env:RUNNER_TEMP 'ready-transition-result.json'
            node $env:PTA_ROLE_HOST_RUNNER --ready-transition-authority-comment-id ([string]$authorityComment.id) --role-dispatch-file $dispatchPath --role-result-file $resultPath 1> $operatorPath
            $operatorExit = $LASTEXITCODE
            $operator = Get-Content -LiteralPath $operatorPath -Raw -Encoding utf8 | ConvertFrom-Json
            if (
              $operator.transition -cne 'ready_transition' -or $operator.next_action -notin @('NONE', 'STOP') -or
              $operator.mutation_count -notin @(0, 1) -or ($operator.mutation_count -eq 0 -and $operator.mutation_attempted -ne $false) -or
              ($operator.mutation_count -eq 1 -and $operator.mutation_attempted -ne $true) -or
              ($operatorExit -eq 0 -and ($operator.state -cne 'COMPLETED' -or $operator.next_action -cne 'NONE' -or $operator.mutation_count -ne 1)) -or
              ($operatorExit -ne 0 -and $operator.next_action -cne 'STOP')
            ) { throw 'ready_transition_operator_invalid' }
            if ($operatorExit -ne 0) { exit $operatorExit }

            $postReadyPath = Join-Path $env:RUNNER_TEMP 'post-ready-continuation.json'
            node $env:PTA_ROLE_HOST_RUNNER --post-ready-result-file $operatorPath --role-dispatch-file $dispatchPath 1> $postReadyPath
            if ($LASTEXITCODE -ne 0) { throw 'post_ready_continuation_failed' }
            $postReady = Get-Content -LiteralPath $postReadyPath -Raw -Encoding utf8 | ConvertFrom-Json
            $postReadyDispatch = $postReady.role_dispatch
            if (
              $postReady.next_action -cne 'PRODUCT_OWNER_IMPLEMENTATION_LEAD' -or
              $postReady.mutation_count -ne 0 -or $postReady.current_head -cne $dispatch.exact_head -or
              $null -eq $postReadyDispatch -or $postReadyDispatch.next_action -cne 'PRODUCT_OWNER_IMPLEMENTATION_LEAD' -or
              $postReadyDispatch.purpose -cne 'MERGE_DECISION' -or $postReadyDispatch.exact_head -cne $dispatch.exact_head
            ) { throw 'post_ready_dispatch_invalid' }

            $postReadyDispatchPath = Join-Path $env:RUNNER_TEMP 'post-ready-role-dispatch.json'
            $postReadyPlanPath = Join-Path $env:RUNNER_TEMP 'post-ready-role-plan.json'
            $postReadyPromptPath = Join-Path $env:RUNNER_TEMP 'post-ready-role-prompt.txt'
            $postReadyOutputPath = Join-Path $env:RUNNER_TEMP 'post-ready-role-output.jsonl'
            $postReadyBodyPath = Join-Path $env:RUNNER_TEMP 'post-ready-role-body.md'
            $postReadyResultPath = Join-Path $env:RUNNER_TEMP 'post-ready-role-result.json'
            [IO.File]::WriteAllText($postReadyDispatchPath, ($postReadyDispatch | ConvertTo-Json -Depth 12 -Compress), $utf8NoBom)
            node $env:PTA_ROLE_HOST_RUNNER --role-dispatch-file $postReadyDispatchPath 1> $postReadyPlanPath
            if ($LASTEXITCODE -ne 0) { throw 'post_ready_role_dispatch_binding_failed' }
            $postReadyPlan = Get-Content -LiteralPath $postReadyPlanPath -Raw -Encoding utf8 | ConvertFrom-Json
            if (
              $postReadyPlan.next_action -cne 'EXECUTE_ROLE' -or $postReadyPlan.exact_head -cne $dispatch.exact_head -or
              $postReadyPlan.role -cne 'PRODUCT_OWNER_IMPLEMENTATION_LEAD' -or -not $postReadyPlan.read_only
            ) { throw 'post_ready_role_dispatch_not_ready' }
            [IO.File]::WriteAllText($postReadyPromptPath, [string]$postReadyPlan.prompt, $utf8NoBom)
            Invoke-BoundedRoleUntilTerminal -PromptFile $postReadyPromptPath -Sandbox 'read-only' -JsonlFile $postReadyOutputPath -BodyFile $postReadyBodyPath -DispatchFile $postReadyDispatchPath
            $postReadyValidation = @{
              DispatchFile = $postReadyDispatchPath
              BodyFile = $postReadyBodyPath
              ExpectedAction = 'POST_MERGE_DECISION'
              ResultFile = $postReadyResultPath
              JsonlFile = $postReadyOutputPath
            }
            $null = Assert-RoleOutput @postReadyValidation
            Assert-FreshRoleBinding -DispatchFile $postReadyDispatchPath
            $null = Publish-CanonicalComment -BodyFile $postReadyBodyPath
            exit 0
          }

          if ($expected -ceq 'RUN_PRE_PR_VALIDATION') {
            $tracked = [string[]]@(git -C $roleWorkspace diff --name-only --no-renames HEAD --)
            if ($LASTEXITCODE -ne 0) { throw 'pre_pr_implementation_scope_invalid' }
            $untracked = [string[]]@(git -C $roleWorkspace ls-files --others --exclude-standard)
            if ($LASTEXITCODE -ne 0) { throw 'pre_pr_implementation_scope_invalid' }
            $changed = [string[]]@(@($tracked; $untracked) | ForEach-Object { $_.Replace('\', '/') } | Sort-Object -Unique)
            $staged = [string[]]@(git -C $roleWorkspace diff --cached --name-only --no-renames -- | Sort-Object -Unique)
            $authorized = [string[]]@($dispatch.authorized_paths | Sort-Object -Unique)
            $reported = [string[]]@($validated.changed_paths)
            $outside = [string[]]@($changed | Where-Object { $_ -notin $authorized })
            if ($LASTEXITCODE -ne 0 -or $changed.Count -eq 0 -or $staged.Count -ne 0 -or $outside.Count -ne 0 -or (Compare-Object $changed $reported)) { throw 'pre_pr_implementation_scope_invalid' }
            $commands = [string[]]@($dispatch.source_binding.validation_commands)
            if ($commands.Count -eq 0) { throw 'pre_pr_validation_commands_invalid' }
            $executions = @()
            foreach ($command in $commands) {
              Push-Location -LiteralPath $roleWorkspace
              try {
                $outputLines = [string[]]@(& cmd.exe /d /s /c $command 2>&1 | ForEach-Object { [string]$_ })
                $exitCode = $LASTEXITCODE
              } finally {
                Pop-Location
              }
              $outputText = $outputLines -join [Environment]::NewLine
              $outputBytes = [Text.Encoding]::UTF8.GetBytes($outputText)
              $sha256 = [Security.Cryptography.SHA256]::Create()
              try { $outputSha256 = ([BitConverter]::ToString($sha256.ComputeHash($outputBytes))).Replace('-', '').ToLowerInvariant() } finally { $sha256.Dispose() }
              $executions += [ordered]@{
                command = [string]$command
                cwd = [string]$roleWorkspace
                exit_code = [int]$exitCode
                output_sha256 = $outputSha256
              }
              if ($exitCode -ne 0) { throw 'pre_pr_validation_command_failed' }
            }
            if ($executions.Count -ne $commands.Count) { throw 'pre_pr_validation_execution_cardinality_invalid' }
            $validationEvidencePath = Join-Path $env:RUNNER_TEMP 'pre-pr-validation-evidence.json'
            $finalResultPath = Join-Path $env:RUNNER_TEMP 'pre-pr-final-result.json'
            $finalBodyPath = Join-Path $env:RUNNER_TEMP 'pre-pr-final-result.md'
            [IO.File]::WriteAllText($validationEvidencePath, (@{ executions = $executions } | ConvertTo-Json -Depth 8 -Compress), $utf8NoBom)
            node $env:PTA_ROLE_HOST_RUNNER --pre-pr-finalize-file $bodyPath --role-dispatch-file $dispatchPath --validation-evidence-file $validationEvidencePath 1> $finalResultPath
            if ($LASTEXITCODE -ne 0) { throw 'pre_pr_validation_result_invalid' }
            $finalResult = Get-Content -LiteralPath $finalResultPath -Raw -Encoding utf8 | ConvertFrom-Json
            if (
              $finalResult.next_action -cne 'POST_PRE_PR_IMPLEMENTATION_RESULT' -or
              $finalResult.mutation_count -ne 0 -or
              (Compare-Object ([string[]]@($finalResult.changed_paths)) $reported)
            ) { throw 'pre_pr_validation_result_invalid' }
            [IO.File]::WriteAllText($finalBodyPath, [string]$finalResult.comment_body, $utf8NoBom)
            Assert-FreshRoleBinding -DispatchFile $dispatchPath
            $null = Publish-CanonicalComment -BodyFile $finalBodyPath
            exit 0
          }

          if ($expected -in @('POST_REVIEW', 'POST_MERGE_DECISION')) {
            Assert-FreshRoleBinding -DispatchFile $dispatchPath
            $canonicalComment = Publish-CanonicalComment -BodyFile $bodyPath
            if ($expected -ceq 'POST_REVIEW') {
              Invoke-AdmittedReviewThreadClosure -DispatchFile $dispatchPath -OwnerResultFile $resultPath -PublishedComment $canonicalComment
            }
            exit 0
          }
          if ($expected -ceq 'POST_PRE_PR_PUBLICATION_DECISION') {
            Assert-FreshRoleBinding -DispatchFile $dispatchPath
            $prePrDecisionComment = Publish-CanonicalComment -BodyFile $bodyPath
            if (
              (($prePrDecisionComment.id -isnot [long]) -and ($prePrDecisionComment.id -isnot [int])) -or
              $prePrDecisionComment.id -le 0 -or
              $prePrDecisionComment.html_url -cne "https://github.com/$($dispatch.repository)/issues/$($dispatch.task_issue_number)#issuecomment-$($prePrDecisionComment.id)"
            ) { throw 'pre_pr_publication_decision_identity_invalid' }
            exit 0
          }
          if ($expected -ceq 'VALIDATE_IMPLEMENTATION') {
            $changed = [string[]]@(git status --porcelain=v1 --untracked-files=all | ForEach-Object { $_.Substring(3).Replace('\', '/') } | Sort-Object -Unique)
            $authorized = [string[]]@($dispatch.authorized_paths | Sort-Object -Unique)
            if ($changed.Count -eq 0 -or (Compare-Object $changed $authorized)) { throw 'role_implementation_scope_invalid' }
            git diff --check
            if ($LASTEXITCODE -ne 0) { throw 'role_diff_check_failed' }
            pnpm.cmd install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { throw 'role_dependency_install_failed' }
            pnpm.cmd run validate:dictionary
            if ($LASTEXITCODE -ne 0) { throw 'role_dictionary_validation_failed' }
            pnpm.cmd test
            if ($LASTEXITCODE -ne 0) { throw 'role_test_failed' }
            pnpm.cmd run build
            if ($LASTEXITCODE -ne 0) { throw 'role_build_failed' }

            Assert-FreshRoleBinding -DispatchFile $dispatchPath
            $null = Publish-CanonicalComment -BodyFile $bodyPath
            exit 0
          }
          if ($expected -cne 'COMMIT_PUSH_PUBLISH') { throw 'role_consumer_entry_invalid' }

          $authorized = [string[]]@($dispatch.authorized_paths | Sort-Object -Unique)
          Assert-FreshRoleBinding -DispatchFile $dispatchPath
          $authorityComment = Publish-CanonicalComment -BodyFile $bodyPath

          Assert-FreshRoleBinding -DispatchFile $dispatchPath -Operation 'commit_push' -AuthorityCommentId ([int64]$authorityComment.id)
          $pull = gh api "repos/$($dispatch.repository)/pulls/$($dispatch.pr_number)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $pull.state -cne 'open' -or $pull.head.sha -cne $dispatch.exact_head -or [string]::IsNullOrWhiteSpace([string]$pull.head.ref)) { throw 'publication_pull_binding_changed' }
          $remote = git ls-remote --heads "https://github.com/$($dispatch.repository).git" "refs/heads/$($pull.head.ref)"
          if ($LASTEXITCODE -ne 0 -or ($remote -split '\s+')[0] -cne $dispatch.exact_head) { throw 'publication_remote_binding_changed' }
          git add -- $authorized
          if ($LASTEXITCODE -ne 0 -or (Compare-Object ([string[]]@(git diff --cached --name-only | Sort-Object)) $authorized)) { throw 'publication_staged_scope_invalid' }
          git -c user.name='protected-transition-role-consumer-v1' -c user.email='protected-transition-role-consumer-v1@users.noreply.github.com' commit -m 'implement authorized protected transition task'
          if ($LASTEXITCODE -ne 0) { throw 'publication_commit_failed' }
          $newHead = (git rev-parse HEAD).Trim()
          Assert-FreshRoleBinding -DispatchFile $dispatchPath -Operation 'commit_push' -AuthorityCommentId ([int64]$authorityComment.id)
          git push --porcelain "https://github.com/$($dispatch.repository).git" "HEAD:refs/heads/$($pull.head.ref)"
          if ($LASTEXITCODE -ne 0) { throw 'publication_push_failed' }
          $remoteAfter = git ls-remote --heads "https://github.com/$($dispatch.repository).git" "refs/heads/$($pull.head.ref)"
          if ($LASTEXITCODE -ne 0 -or ($remoteAfter -split '\s+')[0] -cne $newHead) { throw 'publication_remote_head_mismatch' }
          $publicationPath = Join-Path $env:RUNNER_TEMP 'role-publication-handoff.md'
          $pathLines = ($authorized | ForEach-Object { "- ``$_``" }) -join [Environment]::NewLine
          $publication = "## Publication Handoff`n`n- Publication Authority: https://github.com/$($dispatch.repository)/issues/$($dispatch.task_issue_number)#issuecomment-$($authorityComment.id)`n- target PR: ``#$($dispatch.pr_number)```n- published HEAD: ``$newHead```n- exact parent: ``$($dispatch.exact_head)```n- push mode: normal non-force fast-forward`n- local / remote HEAD equality: PASS`n`n### Published scope`n`n$pathLines`n`n### Terminal state`n`n- status: ``completed```n- execution_stop_reason: ``completed```n"
          [IO.File]::WriteAllText($publicationPath, $publication, $utf8NoBom)
          Assert-FreshRoleBinding -DispatchFile $dispatchPath -Operation 'publication_handoff' -AuthorityCommentId ([int64]$authorityComment.id) -NewHead $newHead
          $publicationComment = Publish-CanonicalComment -BodyFile $publicationPath
          $task = gh api "repos/$($dispatch.repository)/issues/$($dispatch.task_issue_number)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $task.number -ne $dispatch.task_issue_number -or $task.state -cne 'open' -or $null -ne $task.pull_request) { throw 'publication_continuation_task_binding_invalid' }

          $publishedEventPath = Join-Path $env:RUNNER_TEMP 'role-published-event.json'
          $publishedRoutePath = Join-Path $env:RUNNER_TEMP 'role-published-route.json'
          $publishedEvent = [ordered]@{
            action = 'created'
            repository = [ordered]@{ full_name = [string]$dispatch.repository }
            issue = [ordered]@{ number = [int64]$dispatch.task_issue_number; state = 'open' }
            comment = [ordered]@{
              id = [int64]$publicationComment.id
              author_association = [string]$publicationComment.author_association
              body = [string]$publicationComment.body
            }
          }
          [IO.File]::WriteAllText($publishedEventPath, ($publishedEvent | ConvertTo-Json -Depth 8 -Compress), $utf8NoBom)
          node $env:PTA_ROLE_HOST_RUNNER --review-event-file $publishedEventPath 1> $publishedRoutePath
          if ($LASTEXITCODE -ne 0) { throw 'publication_continuation_route_failed' }
          $publishedRoute = Get-Content -LiteralPath $publishedRoutePath -Raw -Encoding utf8 | ConvertFrom-Json
          $reviewDispatch = $publishedRoute.role_dispatch
          $reviewPaths = [string[]]@($reviewDispatch.authorized_paths | Sort-Object -Unique)
          if (
            $publishedRoute.terminal_result -cne 'PUBLISHED' -or $publishedRoute.reason -cne 'publication_state_rebound' -or
            $publishedRoute.automation_status -cne 'HANDOFF_READY' -or $publishedRoute.next_action -cne 'INDEPENDENT_IMPLEMENTATION_REVIEWER' -or
            $publishedRoute.current_head -cne $newHead -or $publishedRoute.task_issue_number -ne $dispatch.task_issue_number -or
            $publishedRoute.pr_number -ne $dispatch.pr_number -or $publishedRoute.source_comment_id -ne $publicationComment.id -or
            $null -eq $reviewDispatch -or $reviewDispatch.repository -cne $dispatch.repository -or
            $reviewDispatch.task_issue_number -ne $dispatch.task_issue_number -or $reviewDispatch.pr_number -ne $dispatch.pr_number -or
            $reviewDispatch.exact_head -cne $newHead -or $reviewDispatch.source_comment_id -ne $publicationComment.id -or
            $reviewDispatch.terminal_result -cne 'PUBLISHED' -or $reviewDispatch.next_action -cne 'INDEPENDENT_IMPLEMENTATION_REVIEWER' -or
            $reviewDispatch.purpose -cne 'INDEPENDENT_IMPLEMENTATION_REVIEWER' -or (Compare-Object $reviewPaths $authorized) -or
            @($reviewDispatch.task_state.psobject.Properties).Count -ne 10 -or $reviewDispatch.task_state.observed_head -cne $newHead -or
            $reviewDispatch.task_state.task_issue_number -ne $dispatch.task_issue_number -or $reviewDispatch.task_state.pr_number -ne $dispatch.pr_number -or
            $reviewDispatch.source_binding.kind -cne 'PUBLICATION_HANDOFF' -or $reviewDispatch.source_binding.comment_id -ne $publicationComment.id -or
            $reviewDispatch.source_binding.parent_head -cne $dispatch.exact_head
          ) { throw 'publication_continuation_binding_invalid' }

          $reviewDispatchPath = Join-Path $env:RUNNER_TEMP 'role-published-review-dispatch.json'
          $reviewPlanPath = Join-Path $env:RUNNER_TEMP 'role-published-review-plan.json'
          $reviewPromptPath = Join-Path $env:RUNNER_TEMP 'role-published-review-prompt.txt'
          $reviewOutputPath = Join-Path $env:RUNNER_TEMP 'role-published-review-output.jsonl'
          $reviewBodyPath = Join-Path $env:RUNNER_TEMP 'role-published-review-body.md'
          $reviewResultPath = Join-Path $env:RUNNER_TEMP 'role-published-review-result.json'
          [IO.File]::WriteAllText($reviewDispatchPath, ($reviewDispatch | ConvertTo-Json -Depth 8 -Compress), $utf8NoBom)
          node $env:PTA_ROLE_HOST_RUNNER --role-dispatch-file $reviewDispatchPath 1> $reviewPlanPath
          if ($LASTEXITCODE -ne 0) { throw 'publication_reviewer_dispatch_binding_failed' }
          $reviewPlan = Get-Content -LiteralPath $reviewPlanPath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($reviewPlan.next_action -cne 'EXECUTE_ROLE' -or $reviewPlan.exact_head -cne $newHead -or -not $reviewPlan.read_only) { throw 'publication_reviewer_dispatch_not_ready' }
          [IO.File]::WriteAllText($reviewPromptPath, [string]$reviewPlan.prompt, $utf8NoBom)
          $reviewTask = gh api "repos/$($dispatch.repository)/issues/$($dispatch.task_issue_number)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $reviewTask.number -ne $dispatch.task_issue_number -or $reviewTask.state -cne 'open' -or $null -ne $reviewTask.pull_request) { throw 'publication_reviewer_task_binding_invalid' }
          Invoke-BoundedRoleUntilTerminal -PromptFile $reviewPromptPath -Sandbox 'read-only' -JsonlFile $reviewOutputPath -BodyFile $reviewBodyPath -DispatchFile $reviewDispatchPath
          $null = Assert-RoleOutput -DispatchFile $reviewDispatchPath -BodyFile $reviewBodyPath -ExpectedAction 'POST_REVIEW' -ResultFile $reviewResultPath -JsonlFile $reviewOutputPath
          Assert-FreshRoleBinding -DispatchFile $reviewDispatchPath
          $publicationTask = gh api "repos/$($dispatch.repository)/issues/$($dispatch.task_issue_number)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $publicationTask.number -ne $dispatch.task_issue_number -or $publicationTask.state -cne 'open' -or $null -ne $publicationTask.pull_request) { throw 'publication_reviewer_task_binding_invalid' }
          $canonicalReviewComment = Publish-CanonicalComment -BodyFile $reviewBodyPath
          Invoke-AdmittedReviewThreadClosure -DispatchFile $reviewDispatchPath -OwnerResultFile $reviewResultPath -PublishedComment $canonicalReviewComment

  protected_transition_merge_operator_v1:
    needs: protected_transition_admission_v1
    if: needs.protected_transition_admission_v1.outputs.next_action == 'MERGE_OPERATOR' && (needs.protected_transition_admission_v1.outputs.terminal_result == 'MERGE_ALLOWED' || needs.protected_transition_admission_v1.outputs.terminal_result == 'MINIMAL_GOVERNANCE_V1')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout exact merge HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.protected_transition_admission_v1.outputs.role_exact_head }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Materialize immutable merge host runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'merge_powershell_major_invalid' }
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          if ($env:GITHUB_WORKFLOW_SHA -notmatch '^[0-9a-f]{40}$') { throw 'merge_host_sha_invalid' }
          $runnerTempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([char[]]@('\', '/'))
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd([char[]]@('\', '/'))
          $hostRoot = [IO.Path]::GetFullPath((Join-Path $runnerTempRoot ("protected-transition-merge-host-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)))
          if (-not $hostRoot.StartsWith($runnerTempRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'merge_host_path_escape' }
          if ($hostRoot.StartsWith($workspaceRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'merge_host_inside_target_workspace' }
          if (Test-Path -LiteralPath $hostRoot) { throw 'merge_host_path_collision' }
          New-Item -ItemType Directory -Path $hostRoot -ErrorAction Stop | Out-Null
          git -C $hostRoot init --quiet
          if ($LASTEXITCODE -ne 0) { throw 'merge_host_materialization_failed' }
          git -C $hostRoot remote add origin "https://github.com/$($env:GITHUB_REPOSITORY).git"
          git -C $hostRoot fetch --no-tags --depth=1 origin $env:GITHUB_WORKFLOW_SHA
          if ($LASTEXITCODE -ne 0) { throw 'merge_host_fetch_failed' }
          git -C $hostRoot checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0 -or (git -C $hostRoot rev-parse HEAD) -cne $env:GITHUB_WORKFLOW_SHA) { throw 'merge_host_sha_mismatch' }
          $hostRunner = Join-Path $hostRoot 'scripts/run-protected-transition-admission-v1.mjs'
          if (-not (Test-Path -LiteralPath $hostRunner -PathType Leaf)) { throw 'merge_host_runner_missing' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "PTA_MERGE_HOST_RUNNER=$hostRunner$([Environment]::NewLine)", $utf8NoBom)

      - name: Rebind exact decision and prepare one merge
        id: merge_plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ROLE_DISPATCH_B64: ${{ needs.protected_transition_admission_v1.outputs.role_dispatch_b64 }}
          MINIMAL_MERGE_PLAN_B64: ${{ needs.protected_transition_admission_v1.outputs.minimal_merge_plan_b64 }}
          MERGE_TERMINAL_RESULT: ${{ needs.protected_transition_admission_v1.outputs.terminal_result }}
          MERGE_AUTHORITY_KIND: ${{ needs.protected_transition_admission_v1.outputs.authority_kind }}
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          function Read-MinimalGovernancePlan {
            if ($env:MERGE_TERMINAL_RESULT -cne 'MINIMAL_GOVERNANCE_V1' -or $env:MERGE_AUTHORITY_KIND -cne 'MINIMAL_GOVERNANCE_V1' -or [string]::IsNullOrWhiteSpace($env:MINIMAL_MERGE_PLAN_B64)) { throw 'minimal_governance_plan_missing' }
            $planBytes = [Convert]::FromBase64String($env:MINIMAL_MERGE_PLAN_B64)
            $plan = [Text.Encoding]::UTF8.GetString($planBytes) | ConvertFrom-Json
            $expectedPlanFields = @('allowed','authority_comment_id','authority_kind','authorized_paths','automation_status','current_head','exact_head','expected_base','exit_code','merge_method','mutation_count','next_action','operation_count','pr_number','protected_operation_count','reason','repository','sealed_snapshot_b64','snapshot_sha256','state','task_issue_number','terminal_result','transition') | Sort-Object
            $actualPlanFields = @($plan.psobject.Properties.Name | Sort-Object)
            if (($actualPlanFields -join "`n") -cne ($expectedPlanFields -join "`n")) { throw 'minimal_governance_plan_fields_invalid' }
            if ($plan.transition -cne 'minimal_governance_v1' -or $plan.authority_kind -cne 'MINIMAL_GOVERNANCE_V1' -or $plan.terminal_result -cne 'MINIMAL_GOVERNANCE_V1' -or $plan.next_action -cne 'MERGE_OPERATOR' -or $plan.automation_status -cne 'OPERATION_READY' -or $plan.state -cne 'READY' -or $plan.reason -cne 'minimal_governance_satisfied' -or $plan.allowed -ne $false -or $plan.exit_code -ne 0 -or $plan.merge_method -cne 'merge' -or $plan.operation_count -ne 1 -or $plan.mutation_count -ne 0 -or $plan.protected_operation_count -ne 0 -or $plan.repository -cne $env:GITHUB_REPOSITORY -or $plan.task_issue_number -lt 1 -or $plan.pr_number -lt 1 -or $plan.authority_comment_id -lt 1 -or $plan.exact_head -cne '${{ needs.protected_transition_admission_v1.outputs.role_exact_head }}' -or $plan.current_head -cne $plan.exact_head -or $plan.expected_base -cnotmatch '^[0-9a-f]{40}$' -or $plan.snapshot_sha256 -cnotmatch '^[0-9a-f]{64}$') { throw 'minimal_governance_plan_invalid' }
            $snapshotBytes = [Convert]::FromBase64String([string]$plan.sealed_snapshot_b64)
            $sha256 = [Security.Cryptography.SHA256]::Create()
            try { $snapshotSha = ([BitConverter]::ToString($sha256.ComputeHash($snapshotBytes))).Replace('-', '').ToLowerInvariant() } finally { $sha256.Dispose() }
            if ($snapshotSha -cne $plan.snapshot_sha256) { throw 'minimal_governance_snapshot_seal_invalid' }
            $snapshot = [Text.Encoding]::UTF8.GetString($snapshotBytes) | ConvertFrom-Json
            $expectedSnapshotFields = @('active_thread_count','authority_actor','authority_body_sha256','authority_comment_id','authority_kind','authorized_paths','comment_history_fingerprint_sha256','exact_head','expected_base','external_checks','job_manifest','pr_number','pull','record_type','repository','review_body_sha256','review_comment_id','source_counts','task','task_issue_number','task_state') | Sort-Object
            $actualSnapshotFields = @($snapshot.psobject.Properties.Name | Sort-Object)
            if (($actualSnapshotFields -join "`n") -cne ($expectedSnapshotFields -join "`n") -or $snapshot.record_type -cne 'minimal_governance_pre_operation_snapshot_v1' -or $snapshot.authority_kind -cne 'MINIMAL_GOVERNANCE_V1' -or $snapshot.repository -cne $plan.repository -or $snapshot.task_issue_number -ne $plan.task_issue_number -or $snapshot.pr_number -ne $plan.pr_number -or $snapshot.exact_head -cne $plan.exact_head -or $snapshot.expected_base -cne $plan.expected_base -or $snapshot.authority_comment_id -ne $plan.authority_comment_id -or $snapshot.active_thread_count -ne 0 -or $snapshot.pull.state -cne 'open' -or $snapshot.pull.draft -ne $false -or $snapshot.pull.merged -ne $false -or $snapshot.pull.head -cne $plan.exact_head -or $snapshot.pull.base -cnotmatch '^[0-9a-f]{40}$' -or $snapshot.pull.mergeable -ne $true) { throw 'minimal_governance_snapshot_binding_invalid' }
            $expectedSourceCountFields = @('authority_refetch','pull','task','main','comment_history','review_refetch','scope','job_manifest','checks','threads') | Sort-Object
            $actualSourceCountFields = @($snapshot.source_counts.psobject.Properties.Name | Sort-Object)
            if (($actualSourceCountFields -join "`n") -cne ($expectedSourceCountFields -join "`n") -or @($snapshot.source_counts.psobject.Properties.Value | Where-Object { $_ -ne 1 }).Count -ne 0) { throw 'minimal_governance_snapshot_source_count_invalid' }
            if ($snapshot.authority_body_sha256 -cnotmatch '^[0-9a-f]{64}$' -or $snapshot.review_body_sha256 -cnotmatch '^[0-9a-f]{64}$' -or $snapshot.comment_history_fingerprint_sha256 -cnotmatch '^[0-9a-f]{64}$' -or $snapshot.review_comment_id -lt 1 -or $snapshot.authority_actor.login -cne 'whatrune' -or $snapshot.authority_actor.id -ne 47842632 -or $snapshot.authority_actor.type -cne 'User' -or @($snapshot.external_checks).Count -lt 1 -or @($snapshot.external_checks | Where-Object { ($_.type -ceq 'CheckRun' -and ($_.status -cne 'COMPLETED' -or $_.conclusion -cne 'SUCCESS')) -or ($_.type -ceq 'StatusContext' -and $_.state -cne 'SUCCESS') -or $_.type -cnotin @('CheckRun','StatusContext') }).Count -ne 0 -or $snapshot.task.number -ne $plan.task_issue_number -or $snapshot.task.state -cne 'open' -or $snapshot.task.is_pull_request -ne $false -or $snapshot.task.creator.login -cne 'whatrune' -or $snapshot.task.creator.id -ne 47842632 -or $snapshot.task.creator.type -cne 'User' -or $snapshot.task_state.task_issue_number -ne $plan.task_issue_number -or $snapshot.task_state.pr_number -ne $plan.pr_number -or $snapshot.task_state.observed_head -cne $plan.exact_head -or $snapshot.task_state.reviewed_head -cne $plan.exact_head -or $snapshot.task_state.review_status -cne 'APPROVE' -or $snapshot.task_state.review_blocker_count -ne 0 -or $snapshot.job_manifest.repository -cne $plan.repository -or $snapshot.job_manifest.run_id -cnotmatch '^[1-9][0-9]*$' -or $snapshot.job_manifest.run_attempt -lt 1 -or $snapshot.job_manifest.host_sha -cne $plan.expected_base) { throw 'minimal_governance_snapshot_evidence_invalid' }
            if (@($plan.authorized_paths).Count -eq 0 -or (@($plan.authorized_paths | Sort-Object) -join "`n") -cne (@($snapshot.authorized_paths | Sort-Object) -join "`n")) { throw 'minimal_governance_scope_binding_invalid' }
            return $plan
          }
          if ($env:MERGE_TERMINAL_RESULT -ceq 'MINIMAL_GOVERNANCE_V1') {
            $plan = Read-MinimalGovernancePlan
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "operation=MERGE_PR$([Environment]::NewLine)", $utf8NoBom)
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "pr_number=$($plan.pr_number)$([Environment]::NewLine)", $utf8NoBom)
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "exact_head=$($plan.exact_head)$([Environment]::NewLine)", $utf8NoBom)
            exit 0
          }
          if ($env:MERGE_TERMINAL_RESULT -cne 'MERGE_ALLOWED' -or -not [string]::IsNullOrWhiteSpace($env:MINIMAL_MERGE_PLAN_B64) -or -not [string]::IsNullOrWhiteSpace($env:MERGE_AUTHORITY_KIND)) { throw 'merge_operator_authority_projection_invalid' }
          $dispatchPath = Join-Path $env:RUNNER_TEMP 'merge-dispatch.json'
          $planPath = Join-Path $env:RUNNER_TEMP 'merge-plan.json'
          [IO.File]::WriteAllBytes($dispatchPath, [Convert]::FromBase64String($env:ROLE_DISPATCH_B64))
          node $env:PTA_MERGE_HOST_RUNNER --merge-operator-file $dispatchPath 1> $planPath
          if ($LASTEXITCODE -ne 0) { throw 'merge_operator_preflight_failed' }
          $plan = Get-Content -LiteralPath $planPath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($plan.next_action -ceq 'NONE' -and $plan.reason -ceq 'already_merged') {
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "operation=NONE$([Environment]::NewLine)", $utf8NoBom)
            exit 0
          }
          if ($plan.next_action -cne 'MERGE_PR' -or $plan.merge_method -cne 'merge' -or $plan.exact_head -cne '${{ needs.protected_transition_admission_v1.outputs.role_exact_head }}') { throw 'merge_operator_plan_invalid' }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "operation=MERGE_PR$([Environment]::NewLine)", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "pr_number=$($plan.pr_number)$([Environment]::NewLine)", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "exact_head=$($plan.exact_head)$([Environment]::NewLine)", $utf8NoBom)

      - name: Perform one normal merge commit
        if: steps.merge_plan.outputs.operation == 'MERGE_PR'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_PR_NUMBER: ${{ steps.merge_plan.outputs.pr_number }}
          MERGE_EXACT_HEAD: ${{ steps.merge_plan.outputs.exact_head }}
          ROLE_DISPATCH_B64: ${{ needs.protected_transition_admission_v1.outputs.role_dispatch_b64 }}
          MINIMAL_MERGE_PLAN_B64: ${{ needs.protected_transition_admission_v1.outputs.minimal_merge_plan_b64 }}
          MERGE_TERMINAL_RESULT: ${{ needs.protected_transition_admission_v1.outputs.terminal_result }}
          MERGE_AUTHORITY_KIND: ${{ needs.protected_transition_admission_v1.outputs.authority_kind }}
        run: |
          $ErrorActionPreference = 'Stop'
          $priorToken = $env:GH_TOKEN
          try {
            if ($env:MERGE_TERMINAL_RESULT -ceq 'MINIMAL_GOVERNANCE_V1') {
              if ($env:MERGE_AUTHORITY_KIND -cne 'MINIMAL_GOVERNANCE_V1' -or [string]::IsNullOrWhiteSpace($env:MINIMAL_MERGE_PLAN_B64)) { throw 'minimal_governance_final_plan_missing' }
              $plan = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:MINIMAL_MERGE_PLAN_B64)) | ConvertFrom-Json
              $snapshotBytes = [Convert]::FromBase64String([string]$plan.sealed_snapshot_b64)
              $sha256 = [Security.Cryptography.SHA256]::Create()
              try { $snapshotSha = ([BitConverter]::ToString($sha256.ComputeHash($snapshotBytes))).Replace('-', '').ToLowerInvariant() } finally { $sha256.Dispose() }
              if ($plan.authority_kind -cne 'MINIMAL_GOVERNANCE_V1' -or $plan.terminal_result -cne 'MINIMAL_GOVERNANCE_V1' -or $plan.next_action -cne 'MERGE_OPERATOR' -or $plan.merge_method -cne 'merge' -or $plan.operation_count -ne 1 -or $plan.pr_number -ne [int]$env:MERGE_PR_NUMBER -or $plan.exact_head -cne $env:MERGE_EXACT_HEAD -or $snapshotSha -cne $plan.snapshot_sha256) { throw 'minimal_governance_final_plan_invalid' }
              $guardPlanPath = Join-Path $env:RUNNER_TEMP 'minimal-governance-final-guard-plan.json'
              $guardResultPath = Join-Path $env:RUNNER_TEMP 'minimal-governance-final-guard-result.json'
              [IO.File]::WriteAllBytes($guardPlanPath, [Convert]::FromBase64String($env:MINIMAL_MERGE_PLAN_B64))
              node $env:PTA_MERGE_HOST_RUNNER --minimal-governance-drift-guard-file $guardPlanPath 1> $guardResultPath
              if ($LASTEXITCODE -ne 0) { throw 'minimal_governance_final_drift_guard_failed' }
              $guard = Get-Content -LiteralPath $guardResultPath -Raw -Encoding utf8 | ConvertFrom-Json
              $expectedGuardFields = @('allowed','exact_head','exit_code','merge_method','mutation_count','next_action','pr_number','protected_operation_count','reason','state','task_issue_number','transition') | Sort-Object
              $actualGuardFields = @($guard.psobject.Properties.Name | Sort-Object)
              if (($actualGuardFields -join "`n") -cne ($expectedGuardFields -join "`n") -or $guard.transition -cne 'minimal_governance_final_drift_guard_v1' -or $guard.state -cne 'MATCH' -or $guard.allowed -ne $false -or $guard.exit_code -ne 0 -or $guard.reason -cne 'minimal_governance_final_drift_guard_matched' -or $guard.next_action -cne 'MERGE_PR' -or $guard.merge_method -cne 'merge' -or $guard.pr_number -ne [int]$env:MERGE_PR_NUMBER -or $guard.exact_head -cne $env:MERGE_EXACT_HEAD -or $guard.mutation_count -ne 0 -or $guard.protected_operation_count -ne 0) { throw 'minimal_governance_final_drift_guard_invalid' }
            } else {
              if ($env:MERGE_TERMINAL_RESULT -cne 'MERGE_ALLOWED' -or -not [string]::IsNullOrWhiteSpace($env:MINIMAL_MERGE_PLAN_B64) -or -not [string]::IsNullOrWhiteSpace($env:MERGE_AUTHORITY_KIND)) { throw 'merge_operator_authority_projection_invalid' }
              $dispatchPath = Join-Path $env:RUNNER_TEMP 'merge-dispatch-final.json'
              $planPath = Join-Path $env:RUNNER_TEMP 'merge-plan-final.json'
              [IO.File]::WriteAllBytes($dispatchPath, [Convert]::FromBase64String($env:ROLE_DISPATCH_B64))
              node $env:PTA_MERGE_HOST_RUNNER --merge-operator-file $dispatchPath 1> $planPath
              if ($LASTEXITCODE -ne 0) { throw 'merge_operator_final_rebind_failed' }
              $plan = Get-Content -LiteralPath $planPath -Raw -Encoding utf8 | ConvertFrom-Json
              if ($plan.next_action -cne 'MERGE_PR' -or $plan.merge_method -cne 'merge' -or $plan.pr_number -ne [int]$env:MERGE_PR_NUMBER -or $plan.exact_head -cne $env:MERGE_EXACT_HEAD) { throw 'merge_operator_final_plan_invalid' }
            }
            Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
            $payload = @{ sha = $env:MERGE_EXACT_HEAD; merge_method = 'merge' } | ConvertTo-Json -Compress
            $merged = $payload | gh api --method PUT "repos/$($env:GITHUB_REPOSITORY)/pulls/$($env:MERGE_PR_NUMBER)/merge" --input - | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $merged.merged -ne $true -or [string]::IsNullOrWhiteSpace([string]$merged.sha)) { throw 'merge_operation_failed' }
            $fresh = gh api "repos/$($env:GITHUB_REPOSITORY)/pulls/$($env:MERGE_PR_NUMBER)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $fresh.merged -ne $true -or $fresh.head.sha -cne $env:MERGE_EXACT_HEAD) { throw 'merge_operation_refetch_failed' }
          } finally {
            if ($null -eq $priorToken) { Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue } else { $env:GH_TOKEN = $priorToken }
          }

  protected_transition_repair_executor_v1:
    needs: protected_transition_admission_v1
    if: needs.protected_transition_admission_v1.outputs.repair_next_action == 'REPAIR_EXECUTOR'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    outputs:
      state: ${{ steps.repair_result.outputs.state }}
      reason: ${{ steps.repair_result.outputs.reason }}
      next_action: ${{ steps.repair_result.outputs.next_action }}
      task_issue_number: ${{ steps.repair_result.outputs.task_issue_number }}
      pr_number: ${{ steps.repair_result.outputs.pr_number }}
      new_head: ${{ steps.repair_result.outputs.new_head }}
    steps:
      - name: Checkout exact repair HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.protected_transition_admission_v1.outputs.repair_exact_head }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Materialize exact protected-transition host runner
        id: repair_host_runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'repair_powershell_major_invalid' }
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          if ($env:GITHUB_WORKFLOW_SHA -notmatch '^[0-9a-f]{40}$') { throw 'repair_host_sha_invalid' }
          $trimSeparators = [char[]]@('\', '/')
          $runnerTempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd($trimSeparators)
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd($trimSeparators)
          $hostWorktree = [IO.Path]::GetFullPath((Join-Path $runnerTempRoot ("protected-transition-host-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)))
          $pathComparison = [StringComparison]::OrdinalIgnoreCase
          if (-not $hostWorktree.StartsWith($runnerTempRoot + [IO.Path]::DirectorySeparatorChar, $pathComparison)) { throw 'repair_host_path_escape' }
          if ($hostWorktree.StartsWith($workspaceRoot + [IO.Path]::DirectorySeparatorChar, $pathComparison)) { throw 'repair_host_inside_target_workspace' }
          if (Test-Path -LiteralPath $hostWorktree) { throw 'repair_host_path_collision' }

          function Invoke-NativeSeparated {
            param([string]$Command, [string[]]$Arguments, [string]$Failure, [switch]$SuppressOutput)
            $captureId = [Guid]::NewGuid().ToString('N')
            $stdoutPath = Join-Path $env:RUNNER_TEMP ("repair-native-{0}.stdout" -f $captureId)
            $stderrPath = Join-Path $env:RUNNER_TEMP ("repair-native-{0}.stderr" -f $captureId)
            $priorErrorActionPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              & $Command @Arguments 1> $stdoutPath 2> $stderrPath
              $nativeExit = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $priorErrorActionPreference
            }
            $stdout = [string[]]@()
            $stderr = [string[]]@()
            if (Test-Path -LiteralPath $stdoutPath) { $stdout = [string[]]@(Get-Content -LiteralPath $stdoutPath) }
            if (Test-Path -LiteralPath $stderrPath) { $stderr = [string[]]@(Get-Content -LiteralPath $stderrPath) }
            try {
              if (-not $SuppressOutput) {
                $stdout | ForEach-Object { [Console]::Out.WriteLine($_) }
                $stderr | ForEach-Object { [Console]::Error.WriteLine($_) }
              }
              if ($nativeExit -ne 0) { throw $Failure }
              return ,$stdout
            } finally {
              Remove-Item -LiteralPath $stdoutPath, $stderrPath -Force -ErrorAction SilentlyContinue
            }
          }

          $gitCommand = (Get-Command git.exe -ErrorAction Stop).Source
          New-Item -ItemType Directory -Path $hostWorktree -ErrorAction Stop | Out-Null
          $null = Invoke-NativeSeparated -Command $gitCommand -Arguments @('-C', $hostWorktree, 'init', '--quiet') -Failure 'repair_host_materialization_failed'
          $null = Invoke-NativeSeparated -Command $gitCommand -Arguments @('-C', $hostWorktree, 'remote', 'add', 'origin', "https://github.com/$($env:GITHUB_REPOSITORY).git") -Failure 'repair_host_materialization_failed'
          $null = Invoke-NativeSeparated -Command $gitCommand -Arguments @('-C', $hostWorktree, 'fetch', '--no-tags', '--depth=1', 'origin', $env:GITHUB_WORKFLOW_SHA) -Failure 'repair_host_fetch_failed'
          $null = Invoke-NativeSeparated -Command $gitCommand -Arguments @('-C', $hostWorktree, 'checkout', '--quiet', '--detach', 'FETCH_HEAD') -Failure 'repair_host_materialization_failed'
          $hostHead = ((Invoke-NativeSeparated -Command $gitCommand -Arguments @('-C', $hostWorktree, 'rev-parse', 'HEAD') -Failure 'repair_host_head_unavailable') -join "`n").Trim()
          if ($hostHead -cne $env:GITHUB_WORKFLOW_SHA) { throw 'repair_host_sha_mismatch' }
          $hostRunner = Join-Path $hostWorktree 'scripts/run-protected-transition-admission-v1.mjs'
          if (-not (Test-Path -LiteralPath $hostRunner -PathType Leaf)) { throw 'repair_host_runner_missing' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "PTA_HOST_RUNNER=$hostRunner$([Environment]::NewLine)", $utf8NoBom)

      - name: Install frozen dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm.cmd install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'dependency_install_failed' }

      - name: Prepare current repair tuple
        id: repair_preflight
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_DISPATCH_B64: ${{ needs.protected_transition_admission_v1.outputs.repair_dispatch_b64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $dispatchPath = Join-Path $env:RUNNER_TEMP 'repair-dispatch.json'
          $preflightPath = Join-Path $env:RUNNER_TEMP 'repair-preflight.json'
          [IO.File]::WriteAllBytes($dispatchPath, [Convert]::FromBase64String($env:REPAIR_DISPATCH_B64))
          $priorErrorActionPreference = $ErrorActionPreference
          $priorConsoleOutputEncoding = [Console]::OutputEncoding
          try {
            [Console]::OutputEncoding = $utf8NoBom
            $ErrorActionPreference = 'Continue'
            $LASTEXITCODE = $null
            $preflightOutput = [string[]]@(node $env:PTA_HOST_RUNNER --repair-preflight-file $dispatchPath 2>&1)
            $preflightExit = $LASTEXITCODE
          } finally {
            [Console]::OutputEncoding = $priorConsoleOutputEncoding
            $ErrorActionPreference = $priorErrorActionPreference
          }
          $preflightOutput | ForEach-Object { Write-Output $_ }
          [IO.File]::WriteAllLines($preflightPath, [string[]]$preflightOutput, $utf8NoBom)
          if ($preflightExit -ne 0) { throw 'repair_preflight_failed' }
          $persistedBytes = [IO.File]::ReadAllBytes($preflightPath)
          if (($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xff -and $persistedBytes[1] -eq 0xfe) -or ($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xfe -and $persistedBytes[1] -eq 0xff) -or ($persistedBytes.Length -ge 3 -and $persistedBytes[0] -eq 0xef -and $persistedBytes[1] -eq 0xbb -and $persistedBytes[2] -eq 0xbf)) { throw 'repair_preflight_encoding_invalid' }
          $result = Get-Content -LiteralPath $preflightPath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($result.next_action -cne 'REPAIR_AGENT') { throw 'repair_preflight_not_ready' }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "head_ref=$($result.head_ref)$([Environment]::NewLine)", $utf8NoBom)

      - name: Preflight exact Repair Executor environment
        id: repair_provider_probe
        shell: pwsh
        env:
          REPAIR_HEAD: ${{ needs.protected_transition_admission_v1.outputs.repair_exact_head }}
          REPAIR_HEAD_REF: ${{ steps.repair_preflight.outputs.head_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $trimSeparators = [char[]]@('\', '/')
          $pathComparison = [StringComparison]::OrdinalIgnoreCase
          $runnerTempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd($trimSeparators)
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd($trimSeparators)
          $hostRoot = [IO.Path]::GetFullPath((Join-Path $runnerTempRoot ("protected-transition-host-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)))
          $expectedHostRunner = [IO.Path]::GetFullPath((Join-Path $hostRoot 'scripts/run-protected-transition-admission-v1.mjs'))
          $actualHostRunner = [IO.Path]::GetFullPath($env:PTA_HOST_RUNNER)

          function Invoke-NativeSeparated {
            param([string]$Command, [string[]]$Arguments, [string]$Failure, [switch]$SuppressOutput, [ValidateSet('stdout', 'stderr')][string]$ReturnStream = 'stdout')
            $captureId = [Guid]::NewGuid().ToString('N')
            $stdoutPath = Join-Path $env:RUNNER_TEMP ("repair-native-{0}.stdout" -f $captureId)
            $stderrPath = Join-Path $env:RUNNER_TEMP ("repair-native-{0}.stderr" -f $captureId)
            $priorErrorActionPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              & $Command @Arguments 1> $stdoutPath 2> $stderrPath
              $nativeExit = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $priorErrorActionPreference
            }
            $stdout = [string[]]@()
            $stderr = [string[]]@()
            if (Test-Path -LiteralPath $stdoutPath) { $stdout = [string[]]@(Get-Content -LiteralPath $stdoutPath) }
            if (Test-Path -LiteralPath $stderrPath) { $stderr = [string[]]@(Get-Content -LiteralPath $stderrPath) }
            try {
              if (-not $SuppressOutput) {
                $stdout | ForEach-Object { [Console]::Out.WriteLine($_) }
                $stderr | ForEach-Object { [Console]::Error.WriteLine($_) }
              }
              if ($nativeExit -ne 0) { throw $Failure }
              if ($ReturnStream -ceq 'stderr') { return ,$stderr }
              return ,$stdout
            } finally {
              Remove-Item -LiteralPath $stdoutPath, $stderrPath -Force -ErrorAction SilentlyContinue
            }
          }

          function Invoke-RepairPushPreflight {
            param([string]$Command, [string[]]$Arguments, [string]$ExpectedHead, [string]$ExpectedRef)
            $captureId = [Guid]::NewGuid().ToString('N')
            $stdoutPath = Join-Path $env:RUNNER_TEMP ("repair-push-preflight-{0}.stdout" -f $captureId)
            $stderrPath = Join-Path $env:RUNNER_TEMP ("repair-push-preflight-{0}.stderr" -f $captureId)
            $nativeExit = $null
            try {
              $priorErrorActionPreference = $ErrorActionPreference
              try {
                $ErrorActionPreference = 'Continue'
                try {
                  & $Command @Arguments 1> $stdoutPath 2> $stderrPath
                  $nativeExit = $LASTEXITCODE
                } catch {
                  throw 'repair_push_preflight_execution_failed'
                }
              } finally {
                $ErrorActionPreference = $priorErrorActionPreference
              }
              if ($null -eq $nativeExit) { throw 'repair_push_preflight_execution_failed' }

              if ($nativeExit -eq 0) {
                try {
                  $stdout = if (Test-Path -LiteralPath $stdoutPath) { [string[]]@(Get-Content -LiteralPath $stdoutPath) } else { [string[]]@() }
                } catch {
                  throw 'repair_push_preflight_diagnostic_unavailable exit_code=0'
                }
                $remoteLines = [string[]]@($stdout | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
                if ($remoteLines.Count -ne 1) { throw 'repair_push_remote_head_mismatch exit_code=0' }
                $remoteFields = [string[]]@($remoteLines[0] -split '\s+')
                if ($remoteFields.Count -ne 2 -or $remoteFields[0] -cne $ExpectedHead -or $remoteFields[1] -cne $ExpectedRef) { throw 'repair_push_remote_head_mismatch exit_code=0' }
                return 'PREFLIGHT_PUSH_CHECK_OK'
              }

              $diagnosticCategory = 'OTHER'
              $diagnosticUnavailable = $false
              try {
                if (-not (Test-Path -LiteralPath $stderrPath)) { throw 'diagnostic_input_invalid' }
                $redactedStderr = [IO.File]::ReadAllText($stderrPath)
                $redactedStderr = [regex]::Replace($redactedStderr, '(?i)https://[^@\r\n]*@github\.com/', 'https://github.com/')
                if ([regex]::IsMatch($redactedStderr, '(?i)https://[^@\r\n]*@github\.com/')) { throw 'diagnostic_redaction_failed' }
                if ([regex]::IsMatch($redactedStderr, '(?i)(Authentication failed|Invalid username or token|could not read Username|terminal prompts disabled|The requested URL returned error:\s*(?:401|403)\b|\bHTTP(?:/\d(?:\.\d)?)?[^\r\n]{0,32}\b(?:401|403)\b)')) {
                  $diagnosticCategory = 'GIT_AUTH'
                } elseif ([regex]::IsMatch($redactedStderr, '(?i)(Repository not found|does not appear to be a git repository|The requested URL returned error:\s*404\b|\bHTTP(?:/\d(?:\.\d)?)?[^\r\n]{0,32}\b404\b)')) {
                  $diagnosticCategory = 'REPO_NOT_FOUND'
                } elseif ([regex]::IsMatch($redactedStderr, '(?i)(Could not resolve (?:host|proxy)|Could not connect|connection (?:refused|reset|timed out)|timed?\s*out|timeout|TLS|SSL|schannel|certificate|The requested URL returned error:\s*(?:408|429|5\d\d)\b|\bHTTP(?:/\d(?:\.\d)?)?[^\r\n]{0,32}\b(?:408|429|5\d\d)\b)')) {
                  $diagnosticCategory = 'NETWORK'
                } elseif ([regex]::IsMatch($redactedStderr, '(?i)(Could not read from remote repository|access denied|permission denied|remote rejected)')) {
                  $diagnosticCategory = 'REMOTE_ACCESS'
                }
              } catch {
                $diagnosticUnavailable = $true
              }
              if ($diagnosticUnavailable) { throw "repair_push_preflight_diagnostic_unavailable category=OTHER exit_code=$nativeExit" }
              if ($diagnosticCategory -ceq 'GIT_AUTH') { throw "repair_push_auth_failed category=GIT_AUTH exit_code=$nativeExit" }
              throw "repair_push_transport_failed category=$diagnosticCategory exit_code=$nativeExit"
            } finally {
              $cleanupFailed = $false
              foreach ($capturePath in @($stdoutPath, $stderrPath)) {
                try {
                  if (Test-Path -LiteralPath $capturePath) { Remove-Item -LiteralPath $capturePath -Force -ErrorAction Stop }
                  if (Test-Path -LiteralPath $capturePath) { $cleanupFailed = $true }
                } catch {
                  $cleanupFailed = $true
                }
              }
              if ($cleanupFailed) {
                if ($null -eq $nativeExit) { throw 'repair_push_preflight_execution_failed' }
                if ($nativeExit -ne 0) { throw "repair_push_preflight_diagnostic_unavailable category=OTHER exit_code=$nativeExit" }
                throw 'repair_push_preflight_diagnostic_unavailable exit_code=0'
              }
            }
          }

          $gitCommand = (Get-Command git.exe -ErrorAction Stop).Source
          if (-not $hostRoot.StartsWith($runnerTempRoot + [IO.Path]::DirectorySeparatorChar, $pathComparison)) { throw 'repair_host_path_escape' }
          if ($hostRoot.StartsWith($workspaceRoot + [IO.Path]::DirectorySeparatorChar, $pathComparison)) { throw 'repair_host_inside_target_workspace' }
          if ($actualHostRunner -cne $expectedHostRunner -or -not (Test-Path -LiteralPath $actualHostRunner -PathType Leaf)) { throw 'repair_host_runner_missing' }
          $hostHead = ((Invoke-NativeSeparated -Command $gitCommand -Arguments @('-C', $hostRoot, 'rev-parse', 'HEAD') -Failure 'repair_host_head_unavailable') -join "`n").Trim()
          if ($hostHead -cne $env:GITHUB_WORKFLOW_SHA) { throw 'repair_host_sha_mismatch' }

          try {
            $codexCommand = (Get-Command codex.cmd -ErrorAction Stop).Source
          } catch {
            throw 'repair_provider_cli_version_invalid'
          }
          $version = ((Invoke-NativeSeparated -Command $codexCommand -Arguments @('--version') -Failure 'repair_provider_cli_version_invalid') -join "`n").Trim()
          if ($version -cne 'codex-cli 0.147.0') { throw 'repair_provider_cli_version_invalid' }
          $loginStatus = ((Invoke-NativeSeparated -Command $codexCommand -Arguments @('login', 'status') -Failure 'repair_provider_chatgpt_login_required' -ReturnStream 'stderr') -join "`n").Trim()
          if ($loginStatus -cne 'Logged in using ChatGPT') { throw 'repair_provider_chatgpt_login_required' }

          $targetTopLevel = ((Invoke-NativeSeparated -Command $gitCommand -Arguments @('-C', $workspaceRoot, 'rev-parse', '--show-toplevel') -Failure 'repair_provider_worktree_invalid') -join "`n").Trim()
          if ([IO.Path]::GetFullPath($targetTopLevel).TrimEnd($trimSeparators) -cne $workspaceRoot) { throw 'repair_provider_worktree_invalid' }
          $targetHead = ((Invoke-NativeSeparated -Command $gitCommand -Arguments @('-C', $workspaceRoot, 'rev-parse', 'HEAD') -Failure 'repair_worktree_head_changed') -join "`n").Trim()
          if ($targetHead -cne $env:REPAIR_HEAD) { throw 'repair_worktree_head_changed' }
          $statusBefore = ((Invoke-NativeSeparated -Command $gitCommand -Arguments @('-C', $workspaceRoot, 'status', '--porcelain=v1', '--untracked-files=all') -Failure 'repair_provider_worktree_invalid') -join "`n").Trim()
          if ($statusBefore.Length -ne 0) { throw 'repair_provider_worktree_not_clean' }

          $sentinelPath = Join-Path $workspaceRoot (".protected-transition-write-{0}.tmp" -f [Guid]::NewGuid().ToString('N'))
          $sentinelBytes = [Text.Encoding]::UTF8.GetBytes([Guid]::NewGuid().ToString('N'))
          $sentinelVerified = $false
          try {
            [IO.File]::WriteAllBytes($sentinelPath, $sentinelBytes)
            $sentinelVerified = [Convert]::ToBase64String([IO.File]::ReadAllBytes($sentinelPath)) -ceq [Convert]::ToBase64String($sentinelBytes)
          } catch {
            $sentinelVerified = $false
          } finally {
            try {
              if (Test-Path -LiteralPath $sentinelPath) { Remove-Item -LiteralPath $sentinelPath -Force -ErrorAction Stop }
            } catch {
              $sentinelVerified = $false
            }
          }
          if (-not $sentinelVerified -or (Test-Path -LiteralPath $sentinelPath)) { throw 'repair_target_worktree_not_writable' }
          $statusAfter = ((Invoke-NativeSeparated -Command $gitCommand -Arguments @('-C', $workspaceRoot, 'status', '--porcelain=v1', '--untracked-files=all') -Failure 'repair_provider_worktree_invalid') -join "`n").Trim()
          if ($statusAfter.Length -ne 0) { throw 'repair_provider_worktree_not_clean' }

          $pushTransport = "https://github.com/$($env:GITHUB_REPOSITORY).git"
          $null = Invoke-RepairPushPreflight -Command $gitCommand -Arguments @('ls-remote', '--heads', $pushTransport, "refs/heads/$($env:REPAIR_HEAD_REF)") -ExpectedHead $env:REPAIR_HEAD -ExpectedRef "refs/heads/$($env:REPAIR_HEAD_REF)"

          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "cli_version=$version$([Environment]::NewLine)", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "login_status=$loginStatus$([Environment]::NewLine)", $utf8NoBom)

      - name: Bind reviewed HEAD immediately before local execution
        id: repair_provider_binding
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_PROVIDER_CLI_VERSION: ${{ steps.repair_provider_probe.outputs.cli_version }}
          REPAIR_PROVIDER_LOGIN_STATUS: ${{ steps.repair_provider_probe.outputs.login_status }}
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $dispatchPath = Join-Path $env:RUNNER_TEMP 'repair-dispatch.json'
          $bindingPath = Join-Path $env:RUNNER_TEMP 'repair-provider-binding.json'
          $promptPath = Join-Path $env:RUNNER_TEMP 'repair-provider-prompt.txt'
          $priorErrorActionPreference = $ErrorActionPreference
          $priorConsoleOutputEncoding = [Console]::OutputEncoding
          try {
            [Console]::OutputEncoding = $utf8NoBom
            $ErrorActionPreference = 'Continue'
            $LASTEXITCODE = $null
            $bindingOutput = [string[]]@(node $env:PTA_HOST_RUNNER --repair-provider-exec-bind-file $dispatchPath 2>&1)
            $bindingExit = $LASTEXITCODE
          } finally {
            [Console]::OutputEncoding = $priorConsoleOutputEncoding
            $ErrorActionPreference = $priorErrorActionPreference
          }
          $bindingOutput | ForEach-Object { Write-Output $_ }
          [IO.File]::WriteAllLines($bindingPath, [string[]]$bindingOutput, $utf8NoBom)
          if ($bindingExit -ne 0) { throw 'repair_provider_binding_failed' }
          $persistedBytes = [IO.File]::ReadAllBytes($bindingPath)
          if (($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xff -and $persistedBytes[1] -eq 0xfe) -or ($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xfe -and $persistedBytes[1] -eq 0xff) -or ($persistedBytes.Length -ge 3 -and $persistedBytes[0] -eq 0xef -and $persistedBytes[1] -eq 0xbb -and $persistedBytes[2] -eq 0xbf)) { throw 'repair_provider_binding_encoding_invalid' }
          $result = Get-Content -LiteralPath $bindingPath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($result.next_action -cne 'EXECUTE_REPAIR_AGENT') { throw 'repair_provider_not_ready' }
          [IO.File]::WriteAllText($promptPath, [string]$result.prompt, $utf8NoBom)
          if ((Get-Item -LiteralPath $promptPath).Length -ne [int64]$result.provider_projection.prompt_bytes) { throw 'repair_provider_prompt_bytes_changed' }

      - name: Execute one local blocking repair
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $promptPath = Join-Path $env:RUNNER_TEMP 'repair-provider-prompt.txt'
          $outputPath = Join-Path $env:RUNNER_TEMP 'repair-provider-output.jsonl'
          $prompt = [IO.File]::ReadAllText($promptPath, $utf8NoBom)
          $priorOutputEncoding = $OutputEncoding
          $priorConsoleOutputEncoding = [Console]::OutputEncoding
          $priorErrorActionPreference = $ErrorActionPreference
          try {
            $OutputEncoding = $utf8NoBom
            [Console]::OutputEncoding = $utf8NoBom
            $ErrorActionPreference = 'Continue'
            $LASTEXITCODE = $null
            $providerOutput = [string[]]@($prompt | & codex.cmd exec -c features.shell_tool=false -c sandbox_workspace_write.network_access=false -c sandbox_workspace_write.writable_roots=[] --sandbox workspace-write --ephemeral --json --cd $env:GITHUB_WORKSPACE - 2>&1)
            $providerExit = $LASTEXITCODE
          } finally {
            $OutputEncoding = $priorOutputEncoding
            [Console]::OutputEncoding = $priorConsoleOutputEncoding
            $ErrorActionPreference = $priorErrorActionPreference
          }
          $providerOutput | ForEach-Object { Write-Output $_ }
          [IO.File]::WriteAllLines($outputPath, [string[]]$providerOutput, $utf8NoBom)
          if ($providerExit -ne 0) { throw "repair_provider_exec_failed_$providerExit" }
          $persistedBytes = [IO.File]::ReadAllBytes($outputPath)
          if (($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xff -and $persistedBytes[1] -eq 0xfe) -or ($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xfe -and $persistedBytes[1] -eq 0xff) -or ($persistedBytes.Length -ge 3 -and $persistedBytes[0] -eq 0xef -and $persistedBytes[1] -eq 0xbb -and $persistedBytes[2] -eq 0xbf)) { throw 'repair_provider_output_encoding_invalid' }

      - name: Rebind reviewed HEAD and project local provider completion
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $dispatchPath = Join-Path $env:RUNNER_TEMP 'repair-dispatch.json'
          $bindingPath = Join-Path $env:RUNNER_TEMP 'repair-provider-binding.json'
          $postExecPath = Join-Path $env:RUNNER_TEMP 'repair-provider-post-exec.json'
          $postExecErrorPath = Join-Path $env:RUNNER_TEMP 'repair-provider-post-exec.stderr.log'
          try {
            $priorErrorActionPreference = $ErrorActionPreference
            $priorConsoleOutputEncoding = [Console]::OutputEncoding
            try {
              [Console]::OutputEncoding = $utf8NoBom
              $ErrorActionPreference = 'Continue'
              $LASTEXITCODE = $null
              node $env:PTA_HOST_RUNNER --repair-provider-post-exec-bind-file $dispatchPath --provider-binding-file $bindingPath 1> $postExecPath 2> $postExecErrorPath
              $postExecExit = $LASTEXITCODE
            } finally {
              [Console]::OutputEncoding = $priorConsoleOutputEncoding
              $ErrorActionPreference = $priorErrorActionPreference
            }
            if (Test-Path -LiteralPath $postExecErrorPath) {
              [IO.File]::ReadAllLines($postExecErrorPath, $utf8NoBom) | ForEach-Object { [Console]::Error.WriteLine($_) }
            }
            if ($postExecExit -ne 0) {
              if (Test-Path -LiteralPath $postExecPath) {
                [IO.File]::ReadAllLines($postExecPath, $utf8NoBom) | ForEach-Object { [Console]::Out.WriteLine($_) }
              }
              throw 'repair_provider_post_exec_binding_failed'
            }
            $persistedBytes = [IO.File]::ReadAllBytes($postExecPath)
            if (($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xff -and $persistedBytes[1] -eq 0xfe) -or ($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xfe -and $persistedBytes[1] -eq 0xff) -or ($persistedBytes.Length -ge 3 -and $persistedBytes[0] -eq 0xef -and $persistedBytes[1] -eq 0xbb -and $persistedBytes[2] -eq 0xbf)) { throw 'repair_provider_post_exec_encoding_invalid' }
            $result = Get-Content -LiteralPath $postExecPath -Raw -Encoding utf8 | ConvertFrom-Json
            if ($result.next_action -cne 'PROJECT_PROVIDER_COMPLETION') { throw 'repair_provider_diff_not_ready' }
            $providerResultPath = Join-Path $env:RUNNER_TEMP 'repair-provider-result.json'
            [IO.File]::WriteAllText($providerResultPath, '{"status":"completed","summary":"Local ChatGPT-authenticated Codex repair completed."}', $utf8NoBom)
          } finally {
            Remove-Item -LiteralPath $postExecPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $postExecErrorPath -Force -ErrorAction SilentlyContinue
          }

      - name: Rebind repair paths and validation profile
        id: repair_post_agent
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $dispatchPath = Join-Path $env:RUNNER_TEMP 'repair-dispatch.json'
          $providerResultPath = Join-Path $env:RUNNER_TEMP 'repair-provider-result.json'
          $postAgentPath = Join-Path $env:RUNNER_TEMP 'repair-post-agent.json'
          $postAgentErrorPath = Join-Path $env:RUNNER_TEMP 'repair-post-agent.stderr.log'
          $priorErrorActionPreference = $ErrorActionPreference
          $priorConsoleOutputEncoding = [Console]::OutputEncoding
          try {
            try {
              [Console]::OutputEncoding = $utf8NoBom
              $ErrorActionPreference = 'Continue'
              $LASTEXITCODE = $null
              node $env:PTA_HOST_RUNNER --repair-post-agent-file $dispatchPath --provider-result-file $providerResultPath 1> $postAgentPath 2> $postAgentErrorPath
              $postAgentExit = $LASTEXITCODE
            } finally {
              [Console]::OutputEncoding = $priorConsoleOutputEncoding
              $ErrorActionPreference = $priorErrorActionPreference
            }
            if (Test-Path -LiteralPath $postAgentErrorPath) {
              [IO.File]::ReadAllLines($postAgentErrorPath, $utf8NoBom) | ForEach-Object { [Console]::Error.WriteLine($_) }
            }
            if (Test-Path -LiteralPath $postAgentPath) {
              [IO.File]::ReadAllLines($postAgentPath, $utf8NoBom) | ForEach-Object { [Console]::Out.WriteLine($_) }
            }
            if ($postAgentExit -ne 0) { throw 'repair_post_agent_failed' }
            $persistedBytes = [IO.File]::ReadAllBytes($postAgentPath)
            if (($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xff -and $persistedBytes[1] -eq 0xfe) -or ($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xfe -and $persistedBytes[1] -eq 0xff) -or ($persistedBytes.Length -ge 3 -and $persistedBytes[0] -eq 0xef -and $persistedBytes[1] -eq 0xbb -and $persistedBytes[2] -eq 0xbf)) { throw 'repair_post_agent_encoding_invalid' }
            $result = Get-Content -LiteralPath $postAgentPath -Raw -Encoding utf8 | ConvertFrom-Json
            if ($result.next_action -cne 'VALIDATE_REPAIR') { throw 'repair_validation_not_ready' }
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "profile=$($result.validation_profile)$([Environment]::NewLine)", $utf8NoBom)
          } finally {
            Remove-Item -LiteralPath $postAgentErrorPath -Force -ErrorAction SilentlyContinue
          }

      - name: Run exact repair validation profile
        shell: pwsh
        env:
          REPAIR_VALIDATION_PROFILE: ${{ steps.repair_post_agent.outputs.profile }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REPAIR_VALIDATION_PROFILE -ceq 'docs_only') {
            node scripts/test-role-execution-contracts.mjs
            if ($LASTEXITCODE -ne 0) { throw 'role_contract_validation_failed' }
            git diff --check
            if ($LASTEXITCODE -ne 0) { throw 'repair_diff_check_failed' }
          } elseif ($env:REPAIR_VALIDATION_PROFILE -ceq 'protected_transition') {
            $focusedOutput = @(node scripts/test-protected-transition-admission-v1.mjs)
            if ($LASTEXITCODE -ne 0) { throw 'focused_validation_failed' }
            $focusedOutput | ForEach-Object { Write-Output $_ }
            if ($focusedOutput[-1] -cne 'protected-transition-admission-v1: 576 assertions passed') { throw 'focused_assertion_total_invalid' }
            node scripts/test-role-execution-contracts.mjs
            if ($LASTEXITCODE -ne 0) { throw 'role_contract_validation_failed' }
            pnpm.cmd run validate:dictionary
            if ($LASTEXITCODE -ne 0) { throw 'dictionary_validation_failed' }
            pnpm.cmd test
            if ($LASTEXITCODE -ne 0) { throw 'full_test_failed' }
            pnpm.cmd run build
            if ($LASTEXITCODE -ne 0) { throw 'build_failed' }
            git diff --check
            if ($LASTEXITCODE -ne 0) { throw 'repair_diff_check_failed' }
          } else {
            throw 'repair_validation_profile_invalid'
          }

      - name: Recheck current HEAD and prepare one commit
        id: repair_commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_VALIDATION_SUCCEEDED: "true"
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $dispatchPath = Join-Path $env:RUNNER_TEMP 'repair-dispatch.json'
          $planPath = Join-Path $env:RUNNER_TEMP 'repair-commit-plan.json'
          $planErrorPath = Join-Path $env:RUNNER_TEMP 'repair-commit-plan.stderr.log'
          $priorErrorActionPreference = $ErrorActionPreference
          $priorConsoleOutputEncoding = [Console]::OutputEncoding
          try {
            try {
              [Console]::OutputEncoding = $utf8NoBom
              $ErrorActionPreference = 'Continue'
              $LASTEXITCODE = $null
              node $env:PTA_HOST_RUNNER --repair-commit-plan-file $dispatchPath 1> $planPath 2> $planErrorPath
              $planExit = $LASTEXITCODE
            } finally {
              [Console]::OutputEncoding = $priorConsoleOutputEncoding
              $ErrorActionPreference = $priorErrorActionPreference
            }
            if (Test-Path -LiteralPath $planErrorPath) {
              [IO.File]::ReadAllLines($planErrorPath, $utf8NoBom) | ForEach-Object { [Console]::Error.WriteLine($_) }
            }
            if (Test-Path -LiteralPath $planPath) {
              [IO.File]::ReadAllLines($planPath, $utf8NoBom) | ForEach-Object { [Console]::Out.WriteLine($_) }
            }
            if ($planExit -ne 0) { throw 'repair_commit_plan_failed' }
            $persistedBytes = [IO.File]::ReadAllBytes($planPath)
            if (($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xff -and $persistedBytes[1] -eq 0xfe) -or ($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xfe -and $persistedBytes[1] -eq 0xff) -or ($persistedBytes.Length -ge 3 -and $persistedBytes[0] -eq 0xef -and $persistedBytes[1] -eq 0xbb -and $persistedBytes[2] -eq 0xbf)) { throw 'repair_commit_plan_encoding_invalid' }
            $plan = Get-Content -LiteralPath $planPath -Raw -Encoding utf8 | ConvertFrom-Json
            if ($plan.next_action -cne 'COMMIT_AND_PUSH' -or $plan.force -or $plan.commit_count -ne 1) { throw 'repair_commit_plan_invalid' }
          } finally {
            Remove-Item -LiteralPath $planPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $planErrorPath -Force -ErrorAction SilentlyContinue
          }
          $repairPaths = @($plan.paths)
          git add -- $repairPaths
          if ($LASTEXITCODE -ne 0) { throw 'repair_stage_failed' }
          $stagedPaths = @(git diff --cached --name-only)
          if ($stagedPaths.Count -eq 0 -or (Compare-Object ($repairPaths | Sort-Object) ($stagedPaths | Sort-Object))) { throw 'repair_staged_scope_invalid' }
          git -c user.name='protected-transition-repair-v1' -c user.email='protected-transition-repair-v1@users.noreply.github.com' commit -m 'fix current protected transition blockers'
          if ($LASTEXITCODE -ne 0) { throw 'repair_commit_failed' }
          if ((git rev-list --count HEAD^..HEAD) -ne '1') { throw 'repair_commit_count_invalid' }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "head_ref=$($plan.head_ref)$([Environment]::NewLine)", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "new_head=$(git rev-parse HEAD)$([Environment]::NewLine)", $utf8NoBom)

      - name: Push one normal non-force repair commit
        shell: pwsh
        env:
          REPAIR_HEAD_REF: ${{ steps.repair_commit.outputs.head_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          git push --porcelain "https://github.com/$($env:GITHUB_REPOSITORY).git" "HEAD:refs/heads/$($env:REPAIR_HEAD_REF)"
          if ($LASTEXITCODE -ne 0) { throw 'repair_push_failed' }

      - name: Rebind existing state and hand off fresh review
        id: repair_result
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_NEW_HEAD: ${{ steps.repair_commit.outputs.new_head }}
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $dispatchPath = Join-Path $env:RUNNER_TEMP 'repair-dispatch.json'
          $evidencePath = Join-Path $env:RUNNER_TEMP 'repair-post-agent.json'
          $resultPath = Join-Path $env:RUNNER_TEMP 'repair-result.json'
          try {
            $priorErrorActionPreference = $ErrorActionPreference
            $priorConsoleOutputEncoding = [Console]::OutputEncoding
            try {
              [Console]::OutputEncoding = $utf8NoBom
              $ErrorActionPreference = 'Continue'
              $LASTEXITCODE = $null
              $resultOutput = [string[]]@(node $env:PTA_HOST_RUNNER --repair-result-file $dispatchPath --repair-evidence-file $evidencePath --new-head $env:REPAIR_NEW_HEAD 2>&1)
              $resultExit = $LASTEXITCODE
            } finally {
              [Console]::OutputEncoding = $priorConsoleOutputEncoding
              $ErrorActionPreference = $priorErrorActionPreference
            }
            $resultOutput | ForEach-Object { Write-Output $_ }
            [IO.File]::WriteAllLines($resultPath, [string[]]$resultOutput, $utf8NoBom)
            if ($resultExit -ne 0) { throw 'repair_result_failed' }
            $persistedBytes = [IO.File]::ReadAllBytes($resultPath)
            if (($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xff -and $persistedBytes[1] -eq 0xfe) -or ($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xfe -and $persistedBytes[1] -eq 0xff) -or ($persistedBytes.Length -ge 3 -and $persistedBytes[0] -eq 0xef -and $persistedBytes[1] -eq 0xbb -and $persistedBytes[2] -eq 0xbf)) { throw 'repair_result_encoding_invalid' }
            $result = Get-Content -LiteralPath $resultPath -Raw -Encoding utf8 | ConvertFrom-Json
            if ($result.state -cne 'REVIEW_PENDING' -or $result.reason -cne 'fresh_review_required' -or $result.next_action -cne 'REVIEW' -or $result.current_head -cne $env:REPAIR_NEW_HEAD) { throw 'repair_result_invalid' }
            @{
              state = $result.state
              reason = $result.reason
              next_action = $result.next_action
              task_issue_number = $result.task_issue_number
              pr_number = $result.pr_number
              new_head = $result.current_head
            }.GetEnumerator() | ForEach-Object {
              [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$($_.Key)=$($_.Value)$([Environment]::NewLine)", $utf8NoBom)
            }
          } finally {
            Remove-Item -LiteralPath $evidencePath -Force -ErrorAction SilentlyContinue
          }

  protected_transition_post_repair_review_v1:
    needs: [protected_transition_admission_v1, protected_transition_repair_executor_v1]
    if: needs.protected_transition_repair_executor_v1.outputs.next_action == 'REVIEW'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout exact repaired HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.protected_transition_repair_executor_v1.outputs.new_head }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Materialize immutable post-repair review host runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $runnerTempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([char[]]@('\', '/'))
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd([char[]]@('\', '/'))
          $hostRoot = [IO.Path]::GetFullPath((Join-Path $runnerTempRoot ("protected-transition-review-host-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)))
          if (-not $hostRoot.StartsWith($runnerTempRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase) -or $hostRoot.StartsWith($workspaceRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase) -or (Test-Path -LiteralPath $hostRoot)) { throw 'post_repair_review_host_invalid' }
          New-Item -ItemType Directory -Path $hostRoot -ErrorAction Stop | Out-Null
          git -C $hostRoot init --quiet
          git -C $hostRoot remote add origin "https://github.com/$($env:GITHUB_REPOSITORY).git"
          git -C $hostRoot fetch --no-tags --depth=1 origin $env:GITHUB_WORKFLOW_SHA
          if ($LASTEXITCODE -ne 0) { throw 'post_repair_review_host_fetch_failed' }
          git -C $hostRoot checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0 -or (git -C $hostRoot rev-parse HEAD) -cne $env:GITHUB_WORKFLOW_SHA) { throw 'post_repair_review_host_sha_mismatch' }
          $hostRunner = Join-Path $hostRoot 'scripts/run-protected-transition-admission-v1.mjs'
          if (-not (Test-Path -LiteralPath $hostRunner -PathType Leaf)) { throw 'post_repair_review_host_runner_missing' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "PTA_REVIEW_HOST_RUNNER=$hostRunner$([Environment]::NewLine)", $utf8NoBom)

      - name: Bind post-repair Independent Reviewer
        id: post_repair_review_plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_NUMBER: ${{ needs.protected_transition_repair_executor_v1.outputs.task_issue_number }}
          PR_NUMBER: ${{ needs.protected_transition_repair_executor_v1.outputs.pr_number }}
          REPAIRED_HEAD: ${{ needs.protected_transition_repair_executor_v1.outputs.new_head }}
          SOURCE_COMMENT_ID: ${{ needs.protected_transition_admission_v1.outputs.source_comment_id }}
          SOURCE_REVIEW_HEAD: ${{ needs.protected_transition_admission_v1.outputs.repair_exact_head }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'post_repair_review_powershell_major_invalid' }
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $pull = gh api "repos/$($env:GITHUB_REPOSITORY)/pulls/$env:PR_NUMBER" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $pull.state -cne 'open' -or $pull.head.sha -cne $env:REPAIRED_HEAD) { throw 'post_repair_review_binding_changed' }
          $stateMatch = [regex]::Match([string]$pull.body, '(?s)<!-- protected-transition-task-state-v1:start -->\s*```json\s*(\{.*?\})\s*```\s*<!-- protected-transition-task-state-v1:end -->')
          if (-not $stateMatch.Success) { throw 'post_repair_review_state_missing' }
          $state = $stateMatch.Groups[1].Value | ConvertFrom-Json
          if ($state.observed_head -cne $env:REPAIRED_HEAD -or $state.review_status -cne 'PENDING' -or $null -ne $state.reviewed_head -or $null -ne $state.review_blocker_count) { throw 'post_repair_review_state_invalid' }
          $dispatch = [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            task_issue_number = [int]$env:TASK_NUMBER
            pr_number = [int]$env:PR_NUMBER
            exact_head = $env:REPAIRED_HEAD
            source_comment_id = [int64]$env:SOURCE_COMMENT_ID
            terminal_result = 'PUBLISHED'
            next_action = 'INDEPENDENT_IMPLEMENTATION_REVIEWER'
            purpose = 'INDEPENDENT_IMPLEMENTATION_REVIEWER'
            authorized_paths = @($state.authorized_paths)
            admission_run_id = $null
            admission_state = $null
            admission_allowed = $null
            admission_reason = $null
            external_check_success_count = $null
            blocking_thread_count = $null
            task_state = $state
            source_binding = [ordered]@{
              kind = 'REVIEW'
              comment_id = [int64]$env:SOURCE_COMMENT_ID
              reviewed_head = $env:SOURCE_REVIEW_HEAD
              decision = 'CHANGES_REQUIRED'
            }
          }
          $dispatchPath = Join-Path $env:RUNNER_TEMP 'post-repair-review-dispatch.json'
          $planPath = Join-Path $env:RUNNER_TEMP 'post-repair-review-plan.json'
          $promptPath = Join-Path $env:RUNNER_TEMP 'post-repair-review-prompt.txt'
          [IO.File]::WriteAllText($dispatchPath, ($dispatch | ConvertTo-Json -Depth 8 -Compress), $utf8NoBom)
          node $env:PTA_REVIEW_HOST_RUNNER --role-dispatch-file $dispatchPath 1> $planPath
          if ($LASTEXITCODE -ne 0) { throw 'post_repair_review_dispatch_failed' }
          $plan = Get-Content -LiteralPath $planPath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($plan.next_action -ceq 'CONVERGED_NOOP') {
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "operation=CONVERGED_NOOP$([Environment]::NewLine)", $utf8NoBom)
            exit 0
          }
          if ($plan.next_action -cne 'EXECUTE_ROLE' -or $plan.role -cne 'INDEPENDENT_IMPLEMENTATION_REVIEWER' -or -not $plan.read_only) { throw 'post_repair_review_plan_invalid' }
          [IO.File]::WriteAllText($promptPath, [string]$plan.prompt, $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "operation=EXECUTE_ROLE$([Environment]::NewLine)", $utf8NoBom)

      - name: Execute and publish post-repair Review
        if: steps.post_repair_review_plan.outputs.operation == 'EXECUTE_ROLE'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)

          function Get-ValidatedReviewerFailureEvidenceLines {
            param([object]$Failure, [object]$Dispatch)
            $evidence = $Failure.failure_evidence
            $header = $evidence.header
            $chunks = @($evidence.chunks)
            $requiredHeaderNames = [string[]]@(
              'binding_mismatch', 'body_capture_status', 'body_chunk_count', 'exact_head', 'field_names',
              'parsed_field_count', 'parser_failure_reason', 'pr_number', 'record_type', 'run_attempt', 'run_id',
              'scalar_types', 'selected_body_sha256', 'selected_body_utf8_byte_count', 'source_comment_id',
              'task_issue_number', 'yaml_block_count'
            )
            $actualEvidenceNames = [string[]]@($evidence.psobject.Properties.Name | Sort-Object)
            $actualHeaderNames = [string[]]@($header.psobject.Properties.Name | Sort-Object)
            if (
              $null -eq $evidence -or $null -eq $header -or $actualEvidenceNames.Count -ne 2 -or
              (Compare-Object ([string[]]@('chunks', 'header')) $actualEvidenceNames) -or
              $actualHeaderNames.Count -ne 17 -or (Compare-Object $requiredHeaderNames $actualHeaderNames)
            ) { throw 'independent_reviewer_failure_evidence_shape_invalid' }
            if (
              $header.record_type -cne 'independent_reviewer_role_output_failure_evidence_v1' -or
              $header.run_id -isnot [string] -or $header.run_id -cnotmatch '^[1-9]\d*$' -or
              ($header.run_attempt -isnot [int] -and $header.run_attempt -isnot [long]) -or $header.run_attempt -lt 1 -or
              ($header.task_issue_number -isnot [int] -and $header.task_issue_number -isnot [long]) -or $header.task_issue_number -ne $Dispatch.task_issue_number -or
              ($header.pr_number -isnot [int] -and $header.pr_number -isnot [long]) -or $header.pr_number -ne $Dispatch.pr_number -or
              $header.exact_head -isnot [string] -or $header.exact_head -cne $Dispatch.exact_head -or
              ($header.source_comment_id -isnot [int] -and $header.source_comment_id -isnot [long]) -or $header.source_comment_id -ne $Dispatch.source_comment_id -or
              $header.selected_body_sha256 -isnot [string] -or $header.selected_body_sha256 -cnotmatch '^[0-9a-f]{64}$'
            ) { throw 'independent_reviewer_failure_evidence_header_invalid' }
            foreach ($name in @('selected_body_utf8_byte_count', 'body_chunk_count', 'yaml_block_count', 'parsed_field_count')) {
              $value = $header.$name
              if (($value -isnot [int] -and $value -isnot [long]) -or $value -lt 0 -or $value -gt 9007199254740991) {
                throw 'independent_reviewer_failure_evidence_count_invalid'
              }
            }
            if ($header.field_names -isnot [System.Array] -or $header.scalar_types -isnot [System.Array]) {
              throw 'independent_reviewer_failure_evidence_fields_invalid'
            }
            $fieldNames = @($header.field_names)
            $scalarTypes = @($header.scalar_types)
            if (
              $fieldNames.Count -ne $header.parsed_field_count -or $scalarTypes.Count -ne $header.parsed_field_count -or
              @($fieldNames | Where-Object { $_ -isnot [string] -or $_ -cnotmatch '^[a-z][a-z0-9_]*$' }).Count -ne 0 -or
              @($scalarTypes | Where-Object { $_ -notin @('string', 'integer', 'boolean', 'invalid') }).Count -ne 0
            ) { throw 'independent_reviewer_failure_evidence_fields_invalid' }
            $bindingNames = [string[]]@($header.binding_mismatch.psobject.Properties.Name | Sort-Object)
            if (
              $null -eq $header.binding_mismatch -or (Compare-Object ([string[]]@('pull_request', 'reviewed_head', 'task_issue')) $bindingNames) -or
              @($bindingNames | Where-Object { $header.binding_mismatch.$_ -notin @('MATCH', 'MISMATCH', 'UNAVAILABLE') }).Count -ne 0
            ) { throw 'independent_reviewer_failure_evidence_binding_invalid' }
            $allowedReasons = @(
              'review_body_length_invalid', 'review_yaml_block_cardinality_invalid', 'review_yaml_scalar_invalid',
              'review_scalar_invalid', 'review_record_type_invalid', 'review_authoring_role_invalid',
              'review_task_issue_invalid', 'review_pull_request_invalid', 'review_reviewed_head_invalid',
              'review_decision_invalid', 'review_count_type_invalid', 'review_count_value_invalid',
              'review_status_invalid', 'review_execution_stop_reason_invalid', 'review_pr_binding_mismatch',
              'review_head_binding_mismatch', 'selected_body_evidence_bound_exceeded', 'role_output_invalid_unclassified'
            )
            if ($header.parser_failure_reason -notin $allowedReasons) { throw 'independent_reviewer_failure_evidence_reason_invalid' }

            if ($header.body_capture_status -ceq 'BOUND_EXCEEDED') {
              if (
                $header.selected_body_utf8_byte_count -le 262144 -or $header.body_chunk_count -ne 0 -or $chunks.Count -ne 0 -or
                $header.yaml_block_count -ne 0 -or $header.parsed_field_count -ne 0 -or $fieldNames.Count -ne 0 -or
                $scalarTypes.Count -ne 0 -or $header.parser_failure_reason -cne 'selected_body_evidence_bound_exceeded' -or
                @($bindingNames | Where-Object { $header.binding_mismatch.$_ -cne 'UNAVAILABLE' }).Count -ne 0
              ) { throw 'independent_reviewer_failure_evidence_overflow_invalid' }
            } elseif ($header.body_capture_status -ceq 'CAPTURED') {
              if (
                $header.selected_body_utf8_byte_count -gt 262144 -or $header.body_chunk_count -gt 64 -or
                $header.body_chunk_count -ne $chunks.Count
              ) { throw 'independent_reviewer_failure_evidence_capture_invalid' }
              $stream = [IO.MemoryStream]::new()
              try {
                for ($index = 0; $index -lt $chunks.Count; $index++) {
                  $chunk = $chunks[$index]
                  $chunkNames = [string[]]@($chunk.psobject.Properties.Name | Sort-Object)
                  if (
                    (Compare-Object ([string[]]@('body_base64', 'chunk_count', 'chunk_index', 'raw_byte_count', 'record_type')) $chunkNames) -or
                    $chunk.record_type -cne 'independent_reviewer_role_output_failure_body_chunk_v1' -or
                    $chunk.chunk_index -ne $index -or $chunk.chunk_count -ne $chunks.Count -or
                    ($chunk.raw_byte_count -isnot [int] -and $chunk.raw_byte_count -isnot [long]) -or
                    $chunk.raw_byte_count -lt 1 -or $chunk.raw_byte_count -gt 4096 -or $chunk.body_base64 -isnot [string]
                  ) { throw 'independent_reviewer_failure_evidence_chunk_invalid' }
                  try { $bytes = [Convert]::FromBase64String($chunk.body_base64) } catch { throw 'independent_reviewer_failure_evidence_chunk_invalid' }
                  if (
                    $bytes.Length -ne $chunk.raw_byte_count -or [Convert]::ToBase64String($bytes) -cne $chunk.body_base64 -or
                    ($index -lt ($chunks.Count - 1) -and $bytes.Length -ne 4096)
                  ) { throw 'independent_reviewer_failure_evidence_chunk_invalid' }
                  $stream.Write($bytes, 0, $bytes.Length)
                }
                $capturedBytes = $stream.ToArray()
              } finally { $stream.Dispose() }
              $sha256 = [Security.Cryptography.SHA256]::Create()
              try { $capturedSha256 = ([BitConverter]::ToString($sha256.ComputeHash($capturedBytes))).Replace('-', '').ToLowerInvariant() } finally { $sha256.Dispose() }
              if ($capturedBytes.Length -ne $header.selected_body_utf8_byte_count -or $capturedSha256 -cne $header.selected_body_sha256) {
                throw 'independent_reviewer_failure_evidence_binding_invalid'
              }
            } else { throw 'independent_reviewer_failure_evidence_capture_invalid' }
            $diagnosticLines = @($header | ConvertTo-Json -Compress -Depth 5)
            $diagnosticLines += @($chunks | ForEach-Object { $_ | ConvertTo-Json -Compress -Depth 3 })
            return [string[]]$diagnosticLines
          }

          $dispatchPath = Join-Path $env:RUNNER_TEMP 'post-repair-review-dispatch.json'
          $promptPath = Join-Path $env:RUNNER_TEMP 'post-repair-review-prompt.txt'
          $bodyPath = Join-Path $env:RUNNER_TEMP 'post-repair-review-body.md'
          $resultPath = Join-Path $env:RUNNER_TEMP 'post-repair-review-result.json'
          $prompt = [IO.File]::ReadAllText($promptPath, $utf8NoBom)
          $priorOutputEncoding = $OutputEncoding
          $priorConsoleOutputEncoding = [Console]::OutputEncoding
          $priorErrorActionPreference = $ErrorActionPreference
          $priorToken = $env:GH_TOKEN
          try {
            $OutputEncoding = $utf8NoBom
            [Console]::OutputEncoding = $utf8NoBom
            $ErrorActionPreference = 'Continue'
            $LASTEXITCODE = $null
            Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
            $events = [string[]]@($prompt | & codex.cmd exec -c features.shell_tool=false -c sandbox_workspace_write.network_access=false -c sandbox_workspace_write.writable_roots=[] --sandbox read-only --ephemeral --json --cd $env:GITHUB_WORKSPACE - 2>&1)
            $nativeExit = $LASTEXITCODE
          } finally {
            $OutputEncoding = $priorOutputEncoding
            [Console]::OutputEncoding = $priorConsoleOutputEncoding
            $ErrorActionPreference = $priorErrorActionPreference
            if ($null -eq $priorToken) { Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue } else { $env:GH_TOKEN = $priorToken }
          }
          if ($nativeExit -ne 0) { throw "post_repair_review_provider_failed_$nativeExit" }
          $messages = @()
          foreach ($line in $events) {
            try {
              $event = $line | ConvertFrom-Json -ErrorAction Stop
              if ($event.type -ceq 'item.completed' -and $event.item.type -ceq 'agent_message' -and -not [string]::IsNullOrWhiteSpace([string]$event.item.text)) { $messages += [string]$event.item.text }
            } catch { }
          }
          if ($messages.Count -ne 1) { throw 'post_repair_review_result_cardinality_invalid' }
          [IO.File]::WriteAllText($bodyPath, $messages[0], $utf8NoBom)
          node $env:PTA_REVIEW_HOST_RUNNER --role-output-file $bodyPath --role-dispatch-file $dispatchPath 1> $resultPath
          $validationExit = $LASTEXITCODE
          if ($validationExit -ne 0) {
            $diagnosticLines = @()
            try {
              $failure = Get-Content -LiteralPath $resultPath -Raw -Encoding utf8 | ConvertFrom-Json
              $failureDispatch = Get-Content -LiteralPath $dispatchPath -Raw -Encoding utf8 | ConvertFrom-Json
              if ($failureDispatch.next_action -cne 'INDEPENDENT_IMPLEMENTATION_REVIEWER') { throw 'post_repair_review_failure_evidence_activation_invalid' }
              $diagnosticLines = @(Get-ValidatedReviewerFailureEvidenceLines -Failure $failure -Dispatch $failureDispatch)
            } catch {
              $diagnosticLines = @()
            }
            foreach ($diagnosticLine in $diagnosticLines) { [Console]::Error.WriteLine($diagnosticLine) }
            throw 'post_repair_review_result_invalid'
          }
          $validated = Get-Content -LiteralPath $resultPath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($validated.next_action -cne 'POST_REVIEW') { throw 'post_repair_review_operation_invalid' }
          $rebindPath = Join-Path $env:RUNNER_TEMP 'post-repair-review-rebind.json'
          node $env:PTA_REVIEW_HOST_RUNNER --role-rebind-file $dispatchPath --operation canonical_write 1> $rebindPath
          if ($LASTEXITCODE -ne 0) { throw 'post_repair_review_rebind_failed' }
          $rebound = Get-Content -LiteralPath $rebindPath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($rebound.next_action -cne 'PROTECTED_OPERATION_READY' -or $rebound.mutation_count -ne 0) { throw 'post_repair_review_rebind_invalid' }
          $priorToken = $env:GH_TOKEN
          try {
            Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
            $payload = @{ body = [IO.File]::ReadAllText($bodyPath, $utf8NoBom) } | ConvertTo-Json -Compress
            $posted = $payload | gh api --method POST "repos/$($env:GITHUB_REPOSITORY)/issues/${{ needs.protected_transition_repair_executor_v1.outputs.task_issue_number }}/comments" --input - | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $posted.id) { throw 'post_repair_review_comment_failed' }
            $fresh = gh api "repos/$($env:GITHUB_REPOSITORY)/issues/comments/$($posted.id)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $fresh.body -cne [IO.File]::ReadAllText($bodyPath, $utf8NoBom)) { throw 'post_repair_review_refetch_mismatch' }
          } finally {
            if ($null -eq $priorToken) { Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue } else { $env:GH_TOKEN = $priorToken }
          }
