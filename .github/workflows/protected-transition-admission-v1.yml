name: Simplified Protected Transition V1

"on":
  issue_comment:
    types: [created]

permissions:
  contents: read
  checks: read
  issues: read
  pull-requests: write
  statuses: read

concurrency:
  group: simplified-protected-transition-v1-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  simplified_protected_transition_v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the immutable default-branch host
        shell: bash
        env:
          PTA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$PTA_DEFAULT_BRANCH" = "main"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/protected-transition-admission-v1.yml@refs/heads/main"
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact workflow host
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Evaluate the live protected operation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/run-protected-transition-admission-v1.mjs --simplified-issue-comment-event-file "$GITHUB_EVENT_PATH"
