name: Pull Request Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Classify pull request changes
        id: changes
        shell: bash
        env:
          EXACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u

          docs_only=false
          classification=full
          reason=unclassified
          changed_path_count=0
          changed_paths_file="$RUNNER_TEMP/pr-changed-paths.zlist"

          echo "exact_base_sha=$EXACT_BASE_SHA"
          echo "exact_head_sha=$EXACT_HEAD_SHA"
          echo "changed_paths_command=git diff --name-only -z --no-renames $EXACT_BASE_SHA $EXACT_HEAD_SHA --"

          if [[ ! "$EXACT_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            reason=invalid_base_sha
          elif [[ ! "$EXACT_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            reason=invalid_head_sha
          elif [[ "$(git rev-parse HEAD 2>/dev/null || true)" != "$EXACT_HEAD_SHA" ]]; then
            reason=checked_out_head_mismatch
          elif ! git cat-file -e "$EXACT_BASE_SHA^{commit}" 2>/dev/null; then
            reason=base_commit_unavailable
          elif ! git cat-file -e "$EXACT_HEAD_SHA^{commit}" 2>/dev/null; then
            reason=head_commit_unavailable
          elif ! git diff --name-only -z --no-renames "$EXACT_BASE_SHA" "$EXACT_HEAD_SHA" -- > "$changed_paths_file"; then
            reason=changed_path_acquisition_failed
          elif [[ ! -s "$changed_paths_file" ]]; then
            reason=empty_changed_path_set
          else
            all_markdown=true
            malformed_path=false

            while IFS= read -r -d '' path; do
              changed_path_count=$((changed_path_count + 1))
              printf 'changed_path=%q\n' "$path"

              if [[ -z "$path" || "$path" == /* || "$path" == ./* || "$path" == ../* || "$path" == */./* || "$path" == */../* || "$path" =~ [[:cntrl:]] ]]; then
                malformed_path=true
              elif [[ "$path" != *.md ]]; then
                all_markdown=false
              fi
            done < "$changed_paths_file"

            if [[ "$changed_path_count" -eq 0 ]]; then
              reason=empty_changed_path_set
            elif [[ "$malformed_path" == true ]]; then
              reason=malformed_changed_path
            elif [[ "$all_markdown" == true ]]; then
              docs_only=true
              classification=docs-only
              reason=all_changed_paths_end_in_md
            else
              reason=non_markdown_or_mixed_changes
            fi
          fi

          echo "changed_path_count=$changed_path_count"
          echo "classification=$classification"
          echo "classification_reason=$reason"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: Validate role execution contracts
        if: steps.changes.outputs.docs_only == 'true'
        run: |
          echo 'command=node scripts/test-role-execution-contracts.mjs'
          node scripts/test-role-execution-contracts.mjs

      - name: Check exact pull request diff
        if: steps.changes.outputs.docs_only == 'true'
        env:
          EXACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "exact_base_sha=$EXACT_BASE_SHA"
          echo "exact_head_sha=$EXACT_HEAD_SHA"
          echo "command=git diff --check $EXACT_BASE_SHA $EXACT_HEAD_SHA"
          git diff --check "$EXACT_BASE_SHA" "$EXACT_HEAD_SHA"

      - name: Enable pnpm
        if: steps.changes.outputs.docs_only != 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm install

      - name: Test
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm test

      - name: Build preview
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm build

      - name: Upload preview artifact
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Add preview instructions
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          echo '### Pull Request Preview' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the `preview-pr-${{ github.event.pull_request.number }}` artifact from this workflow run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Serve the extracted directory with any static web server to inspect the production build.' >> "$GITHUB_STEP_SUMMARY"
