schema_version: '3.0'
target_concept: ''
blind_analysis: true
special_values:
  unclear: Visible evidence is insufficient or conflicting.
  not_visible: The relevant evidence is cropped or fully obscured.
axis_catalog:
  upper_canvas_margin_band:
    label: Upper Canvas Margin Band
    allowed_values:
    - minimal
    - moderate
    - ample
    - unclear
  top_of_head_visibility:
    label: Top Of Head Visibility
    allowed_values:
    - visible
    - cropped
    - obscured
    - unclear
  lower_canvas_margin_band:
    label: Lower Canvas Margin Band
    allowed_values:
    - minimal
    - moderate
    - ample
    - unclear
  subject_frame_height_band:
    label: Subject Frame Height Band
    allowed_values:
    - very_large
    - large
    - medium
    - small
    - very_small
    - unclear
  whole_subject_visibility:
    label: Whole Subject Visibility
    allowed_values:
    - visible
    - cropped
    - unclear
  vertical_subject_position:
    label: Vertical Subject Position
    allowed_values:
    - high
    - center
    - low
    - unclear
  headroom_assessability:
    label: Headroom Assessability
    allowed_values:
    - assessable
    - unassessable
    - unclear
  scale_or_camera_variation:
    label: Scale Or Camera Variation
    allowed_values:
    - none
    - scale_shift
    - camera_shift
    - both
    - unclear
  ambiguity_or_artifact:
    label: Ambiguity Or Artifact
    allowed_values: &id001
    - none
    - headroom_ambiguous
    - anatomy_artifact
    - composition_artifact
    - multiple
active_observation_axes:
- upper_canvas_margin_band
- top_of_head_visibility
- lower_canvas_margin_band
- subject_frame_height_band
- whole_subject_visibility
- vertical_subject_position
- headroom_assessability
- scale_or_camera_variation
- ambiguity_or_artifact
contact_load:
  enabled: false
  fields:
  - left_hand
  - right_hand
  - left_forearm
  - right_forearm
  allowed_values:
  - none
  - light
  - supporting
  - weight_bearing
  - unclear
morphology_candidates:
  primary:
  - headroom_observation
  secondary:
  - none
artifact_checks: *id001
cross_domain_effects:
  enabled: false
  domains: []
  strength_values: []
  effect_type_values: []
rules:
  preserve_axis_labels_exactly: true
  preserve_axis_order: true
  output_all_active_axes_for_every_panel: true
  use_allowed_values_only: true
  visible_evidence_only: true
  enforce_visible_evidence_policy: false
  prompt_blind_freeze_required: true
  analyst_must_not_assign_target_alignment: true
  analyst_must_not_finalize_concept: true
  six_images_are_directional_evidence_only: true
blind_condition_label: COND-01
run_id: CAM-015-B
