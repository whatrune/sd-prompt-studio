active_observation_axes:
- left_hand_visibility
- right_hand_visibility
- left_hand_frame_boundary
- right_hand_frame_boundary
- left_hand_occlusion_source
- right_hand_occlusion_source
- arm_placement_observation
- body_coverage
- garment_hand_cover
- hand_assessability
- camera_angle_observation
- ambiguity_or_artifact
