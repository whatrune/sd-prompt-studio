schema_version: "3.0"
target_concept: ""
blind_condition_label: COND-03
blind_analysis: true
special_values:
  unclear: Visible evidence is insufficient or conflicting.
  not_visible: The relevant evidence is cropped or fully obscured.
axis_catalog:
  apparent_camera_vertical_position:
    label: Apparent Camera Vertical Position
    allowed_values:
      - above_subject
      - eye_level
      - below_subject
      - unclear
  apparent_viewing_direction:
    label: Apparent Viewing Direction
    allowed_values:
      - downward
      - level
      - upward
      - unclear
  head_to_body_perspective:
    label: Head To Body Perspective
    allowed_values:
      - head_emphasized
      - neutral
      - lower_body_emphasized
      - unclear
  floor_support_geometry:
    label: Floor Support Geometry
    allowed_values:
      - top_surface_dominant
      - level_horizon
      - low_view_recession
      - unclear
  full_body_visibility:
    label: Full Body Visibility
    allowed_values:
      - visible
      - partial
      - not_visible
      - unclear
  angle_assessability:
    label: Angle Assessability
    allowed_values:
      - assessable
      - unassessable
      - unclear
  ambiguity_or_artifact:
    label: Ambiguity Or Artifact
    allowed_values:
      - none
      - angle_ambiguous
      - anatomy_artifact
      - composition_artifact
      - multiple
active_observation_axes:
  - apparent_camera_vertical_position
  - apparent_viewing_direction
  - head_to_body_perspective
  - floor_support_geometry
  - full_body_visibility
  - angle_assessability
  - ambiguity_or_artifact
contact_load:
  enabled: false
  fields:
    - left_hand
    - right_hand
    - left_forearm
    - right_forearm
  allowed_values:
    - none
    - light
    - supporting
    - weight_bearing
    - unclear
morphology_candidates:
  primary:
    - camera_angle_observation
  secondary:
    - none
artifact_checks:
  - none
  - angle_ambiguous
  - anatomy_artifact
  - composition_artifact
  - multiple
cross_domain_effects:
  enabled: false
  domains: []
  strength_values: []
  effect_type_values: []
rules:
  preserve_axis_labels_exactly: true
  preserve_axis_order: true
  output_all_active_axes_for_every_panel: true
  use_allowed_values_only: true
  visible_evidence_only: true
  enforce_visible_evidence_policy: true
  prompt_blind_freeze_required: true
  analyst_must_not_assign_target_alignment: true
  analyst_must_not_finalize_concept: true
  six_images_are_directional_evidence_only: true
run_id: CAM-006-B
