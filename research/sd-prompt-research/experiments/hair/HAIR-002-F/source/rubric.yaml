schema_version: "3.0"
run_id: HAIR-002-F
target_concept: ""
blind_condition_label: Condition F
blind_analysis: false
special_values:
  unclear: Visible evidence is insufficient or conflicting.
  not_visible: The relevant hair region is cropped or fully obscured.
axis_catalog:
  main_hairstyle_identity:
    label: Main Hairstyle Identity
    allowed_values:
      - distinct
      - partial
      - ambiguous
      - absent
      - not_visible
  visible_structure:
    label: Visible Hair Structure
    allowed_values:
      - bob_silhouette
      - single_tied_tail
      - twin_tied_tails
      - other
      - unclear
      - not_visible
  composition_integrity:
    label: Composition Integrity
    allowed_values:
      - coherent
      - ambiguous
      - artifact
      - not_visible
active_observation_axes:
  - main_hairstyle_identity
  - visible_structure
  - composition_integrity
contact_load:
  enabled: false
  fields:
    - left_hand
    - right_hand
    - left_forearm
    - right_forearm
  allowed_values:
    - none
    - light
    - supporting
    - weight_bearing
    - unclear
morphology_candidates:
  primary:
    - main_hairstyle_composition
  secondary:
    - none
artifact_checks:
  - none
  - hair_structure_artifact
  - other
cross_domain_effects:
  enabled: false
  domains: []
  strength_values: []
  effect_type_values: []
rules:
  preserve_axis_labels_exactly: true
  preserve_axis_order: true
  output_all_active_axes_for_every_panel: true
  use_allowed_values_only: true
  visible_evidence_only: true
  enforce_visible_evidence_policy: true
  analyst_must_not_assign_target_alignment: true
  analyst_must_not_finalize_concept: true
  six_images_are_directional_evidence_only: true
