schema_version: '3.0'
target_concept: ''
blind_analysis: true
special_values:
  unclear: Visible evidence is insufficient or conflicting.
  not_visible: The relevant evidence is cropped or fully obscured.
axis_catalog:
  subject_frame_height_band:
    label: Subject Frame Height Band
    allowed_values:
    - very_large
    - large
    - medium
    - small
    - very_small
    - unclear
  surrounding_margin:
    label: Surrounding Margin
    allowed_values:
    - minimal
    - moderate
    - ample
    - unclear
  environment_dominance:
    label: Environment Dominance
    allowed_values:
    - subject_dominant
    - balanced
    - environment_dominant
    - unclear
  face_head_scale:
    label: Face Head Scale
    allowed_values:
    - large
    - medium
    - small
    - very_small
    - unclear
  whole_subject_visibility:
    label: Whole Subject Visibility
    allowed_values:
    - cropped
    - visible
    - small_visible
    - unclear
  distance_assessability:
    label: Distance Assessability
    allowed_values:
    - assessable
    - unassessable
    - unclear
  ambiguity_or_artifact:
    label: Ambiguity Or Artifact
    allowed_values:
    - none
    - distance_ambiguous
    - anatomy_artifact
    - composition_artifact
    - multiple
active_observation_axes:
- subject_frame_height_band
- surrounding_margin
- environment_dominance
- face_head_scale
- whole_subject_visibility
- distance_assessability
- ambiguity_or_artifact
contact_load:
  enabled: false
  fields:
  - left_hand
  - right_hand
  - left_forearm
  - right_forearm
  allowed_values:
  - none
  - light
  - supporting
  - weight_bearing
  - unclear
morphology_candidates:
  primary:
  - subject_distance_observation
  secondary:
  - none
artifact_checks:
- none
- distance_ambiguous
- anatomy_artifact
- composition_artifact
- multiple
cross_domain_effects:
  enabled: false
  domains: []
  strength_values: []
  effect_type_values: []
rules:
  preserve_axis_labels_exactly: true
  preserve_axis_order: true
  output_all_active_axes_for_every_panel: true
  use_allowed_values_only: true
  visible_evidence_only: true
  enforce_visible_evidence_policy: false
  prompt_blind_freeze_required: true
  analyst_must_not_assign_target_alignment: true
  analyst_must_not_finalize_concept: true
  six_images_are_directional_evidence_only: true
blind_condition_label: COND-J7
run_id: CAM-011-A
