name: Research Claim Validation

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CLAIM_VALIDATION_BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Classify exact changed paths
        id: profile
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          selector="research/sd-prompt-research/scripts/select_validation_profile.py"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ ! "$EXACT_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || [[ ! "$EXACT_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "invalid_exact_revision" >&2
              exit 1
            fi
            [[ "$(git rev-parse HEAD)" == "$EXACT_HEAD_SHA" ]] || { echo "checked_out_head_mismatch" >&2; exit 1; }
            git cat-file -e "$EXACT_BASE_SHA^{commit}"
            git cat-file -e "$EXACT_HEAD_SHA^{commit}"
            changed_paths="$RUNNER_TEMP/validation-paths.zlist"
            git diff --name-only -z --no-renames "$EXACT_BASE_SHA" "$EXACT_HEAD_SHA" -- > "$changed_paths"
            python "$selector" --paths-file "$changed_paths" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            python "$selector" --force-full-reason default_branch_regression --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            python "$selector" --force-full-reason scheduled_periodic_regression --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python "$selector" --force-full-reason explicit_full_regression --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
          else
            echo "unsupported_validation_event" >&2
            exit 1
          fi

      - name: Verify classifier contract
        working-directory: research/sd-prompt-research
        run: python -m unittest tests.test_validation_profile -v

      - name: Restore immutable Python validation environment
        if: steps.profile.outputs.install_research_dependencies == 'true'
        uses: actions/cache@v4
        with:
          path: .git/codex-cache/python-validation-v1/environments
          key: >-
            python-validation-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{
            hashFiles('research/sd-prompt-research/requirements.txt', 'research/sd-prompt-research/requirements.lock.txt') }}

      - name: Acquire immutable Python validation environment
        id: python_validation
        if: steps.profile.outputs.install_research_dependencies == 'true'
        shell: pwsh
        run: |
          $result = & ./scripts/acquire-python-validation-environment-v1.ps1 `
            -RepositoryPath $env:GITHUB_WORKSPACE `
            -PythonExecutable (Get-Command python).Source | ConvertFrom-Json
          "python_executable=$($result.python_executable)" >> $env:GITHUB_OUTPUT
          "cache_state=$($result.cache_state)" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        if: steps.profile.outputs.install_node_dependencies == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        if: steps.profile.outputs.install_node_dependencies == 'true'
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run Full Research tests
        if: steps.profile.outputs.run_full_research == 'true'
        working-directory: research/sd-prompt-research
        env:
          VALIDATION_PYTHON: ${{ steps.python_validation.outputs.python_executable }}
        run: '"$VALIDATION_PYTHON" -B -E -s -m unittest discover -s tests -v'

      - name: Run research experiment tests
        if: steps.profile.outputs.run_research_experiment == 'true'
        working-directory: research/sd-prompt-research
        env:
          VALIDATION_PYTHON: ${{ steps.python_validation.outputs.python_executable }}
        run: >-
          "$VALIDATION_PYTHON" -B -E -s -m unittest
          tests.test_concept_graph tests.test_face_observation tests.test_hair_observation
          tests.test_observation_pipeline tests.test_research_claims
          tests.test_research_explorer_integration tests.test_research_run_registration -v

      - name: Run Concept Graph tests
        if: steps.profile.outputs.run_concept_graph == 'true'
        working-directory: research/sd-prompt-research
        env:
          VALIDATION_PYTHON: ${{ steps.python_validation.outputs.python_executable }}
        run: >-
          "$VALIDATION_PYTHON" -B -E -s -m unittest tests.test_concept_graph tests.test_research_claims
          tests.test_research_explorer_integration -v

      - name: Validate Concept Graph
        if: steps.profile.outputs.run_research_validators == 'true'
        working-directory: research/sd-prompt-research
        env:
          VALIDATION_PYTHON: ${{ steps.python_validation.outputs.python_executable }}
        run: '"$VALIDATION_PYTHON" -B -E -s scripts/build_concept_graph.py --check'

      - name: Validate Research Explorer
        if: steps.profile.outputs.run_research_validators == 'true'
        working-directory: research/sd-prompt-research
        env:
          VALIDATION_PYTHON: ${{ steps.python_validation.outputs.python_executable }}
        run: '"$VALIDATION_PYTHON" -B -E -s scripts/research_explorer.py index --check'

      - name: Validate Research Claims
        if: steps.profile.outputs.run_research_validators == 'true'
        working-directory: research/sd-prompt-research
        env:
          VALIDATION_PYTHON: ${{ steps.python_validation.outputs.python_executable }}
        run: >-
          "$VALIDATION_PYTHON" -B -E -s scripts/validate_research_claims.py --baseline-ref "$CLAIM_VALIDATION_BASELINE_SHA"
          --validation-context current_state --format json

      - name: Validate production advisory
        if: steps.profile.outputs.run_production_advisory == 'true'
        shell: bash
        run: |
          node scripts/test-visual-concept-production-advisory-v1.mjs
          node scripts/test-visual-concept-read-only-advisory-v1.mjs
          node scripts/test-visual-concept-read-only-entry-adapter-v1.mjs
          node scripts/test-visual-concept-read-only-inspection-v1.mjs
          node scripts/promote-visual-concept-production-advisory-v1.mjs --check

      - name: Validate PromptTag data
        if: steps.profile.outputs.run_prompt_data == 'true'
        shell: bash
        run: |
          node scripts/validate-dictionaries.mjs
          node scripts/test-reclassification.mjs
          node scripts/test-prompt-analyzer.mjs

      - name: Validate application
        if: steps.profile.outputs.run_application == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          pnpm test
          pnpm run build

      - name: Validate platform contracts
        if: steps.profile.outputs.run_platform == 'true'
        shell: bash
        run: |
          node scripts/test-protected-transition-admission-v1.mjs
          node scripts/test-task-execution-context-v1.mjs

      - name: Validate documentation contracts
        if: steps.profile.outputs.run_documentation == 'true'
        run: node scripts/test-role-execution-contracts.mjs

      - name: Validate immutable Python environment cache
        if: steps.profile.outputs.run_python_cache_matrix == 'true'
        shell: pwsh
        run: >-
          ./scripts/test-python-validation-environment-v1.ps1
          -PythonExecutable (Get-Command python).Source

      - name: Verify exact diff formatting
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$EXACT_BASE_SHA" "$EXACT_HEAD_SHA" --
