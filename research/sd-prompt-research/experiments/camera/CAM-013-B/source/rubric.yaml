schema_version: '3.0'
target_concept: ''
blind_analysis: true
special_values:
  unclear: Visible evidence is insufficient or conflicting.
  not_visible: The relevant evidence is cropped or fully obscured.
axis_catalog:
  subject_horizontal_band:
    label: Subject Horizontal Band
    allowed_values:
    - left
    - center
    - right
    - unclear
  left_edge_margin:
    label: Left Edge Margin
    allowed_values:
    - minimal
    - moderate
    - ample
    - unclear
  right_edge_margin:
    label: Right Edge Margin
    allowed_values:
    - minimal
    - moderate
    - ample
    - unclear
  whole_subject_visibility:
    label: Whole Subject Visibility
    allowed_values:
    - visible
    - cropped
    - unclear
  support_boundary_visibility:
    label: Support Boundary Visibility
    allowed_values:
    - visible
    - not_visible
    - unclear
  placement_assessability:
    label: Placement Assessability
    allowed_values:
    - assessable
    - unassessable
    - unclear
  unintended_pose_or_camera_change:
    label: Unintended Pose Or Camera Change
    allowed_values:
    - none
    - camera_shift
    - pose_change
    - multiple
  ambiguity_or_artifact:
    label: Ambiguity Or Artifact
    allowed_values:
    - none
    - placement_ambiguous
    - anatomy_artifact
    - composition_artifact
    - multiple
active_observation_axes:
- subject_horizontal_band
- left_edge_margin
- right_edge_margin
- whole_subject_visibility
- support_boundary_visibility
- placement_assessability
- unintended_pose_or_camera_change
- ambiguity_or_artifact
contact_load:
  enabled: false
  fields:
  - left_hand
  - right_hand
  - left_forearm
  - right_forearm
  allowed_values:
  - none
  - light
  - supporting
  - weight_bearing
  - unclear
morphology_candidates:
  primary:
  - subject_position_observation
  secondary:
  - none
artifact_checks:
- none
- placement_ambiguous
- anatomy_artifact
- composition_artifact
- multiple
cross_domain_effects:
  enabled: false
  domains: []
  strength_values: []
  effect_type_values: []
rules:
  preserve_axis_labels_exactly: true
  preserve_axis_order: true
  output_all_active_axes_for_every_panel: true
  use_allowed_values_only: true
  visible_evidence_only: true
  enforce_visible_evidence_policy: false
  prompt_blind_freeze_required: true
  analyst_must_not_assign_target_alignment: true
  analyst_must_not_finalize_concept: true
  six_images_are_directional_evidence_only: true
blind_condition_label: COND-V9
run_id: CAM-013-B
