schema_version: "3.0"
target_concept: standing-split pose viability under canonical full-body framing with matched production PromptTags
blind_analysis: true
special_values:
  unclear: Visible geometry does not support a reliable category.
  not_visible: The relevant body region is outside the visible frame.
axis_catalog:
  observed_framing:
    label: Observed Framing
    allowed_values:
      - full_body
      - cowboy_shot
      - upper_body
      - close_up
      - other
      - ambiguous
  upper_crop_boundary:
    label: Upper Crop Boundary
    allowed_values:
      - above_head
      - hairline
      - forehead
      - eyes
      - below_eyes
      - unknown
  lower_crop_boundary:
    label: Lower Crop Boundary
    allowed_values:
      - below_feet
      - feet
      - ankle
      - lower_leg
      - knee
      - distal_thigh
      - mid_thigh
      - proximal_thigh
      - pelvis
      - waist
      - chest
      - unknown
  head_visibility:
    label: Head Visibility
    allowed_values:
      - fully_visible
      - partially_cropped
      - not_visible
      - unclear
  torso_visibility:
    label: Torso Visibility
    allowed_values:
      - fully_visible
      - partially_visible
      - not_visible
      - unclear
  pelvis_visibility:
    label: Pelvis Visibility
    allowed_values:
      - fully_visible
      - partially_visible
      - not_visible
      - unclear
  left_knee_visibility:
    label: Left Knee Visibility
    allowed_values:
      - visible
      - not_visible
      - unclear
  right_knee_visibility:
    label: Right Knee Visibility
    allowed_values:
      - visible
      - not_visible
      - unclear
  support_foot_visibility:
    label: Support Foot Visibility
    allowed_values:
      - visible
      - not_visible
      - unclear
  raised_foot_visibility:
    label: Raised Foot Visibility
    allowed_values:
      - visible
      - not_visible
      - unclear
  standing_split_realization:
    label: Standing Split Realization
    allowed_values:
      - strict_standing_split
      - partial_leg_raise
      - other_visible_pose
      - not_realized
      - indeterminate_hidden_required_regions
  pose_assessability:
    label: Pose Assessability
    allowed_values:
      - assessable
      - unassessable
      - unclear
  framing_assessability:
    label: Framing Assessability
    allowed_values:
      - assessable
      - unassessable
      - unclear
  ambiguity_or_artifact:
    label: Ambiguity Or Artifact
    allowed_values:
      - none
      - framing_ambiguous
      - pose_ambiguous
      - anatomy_artifact
      - composition_artifact
