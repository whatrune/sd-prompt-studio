active_observation_axes:
  - observed_framing
  - upper_crop_boundary
  - lower_crop_boundary
  - head_visibility
  - torso_visibility
  - pelvis_visibility
  - left_knee_visibility
  - right_knee_visibility
  - support_foot_visibility
  - raised_foot_visibility
  - standing_split_realization
  - pose_assessability
  - framing_assessability
  - ambiguity_or_artifact
contact_load:
  enabled: true
  fields:
    - left_hand
    - right_hand
    - left_forearm
    - right_forearm
  allowed_values:
    - none
    - light
    - supporting
    - weight_bearing
    - unclear
morphology_candidates:
  primary:
    - upright_character_with_full_body_visible
    - strict_standing_split_with_full_body_visible
  secondary: []
artifact_checks:
  - none
  - anatomy_artifact
  - composition_artifact
  - multiple
cross_domain_effects:
  enabled: true
  domains:
    - camera
    - composition
    - pose
  strength_values:
    - weak
    - medium
    - strong
    - unclear
  effect_type_values:
    - natural_response
    - secondary_effect
    - interaction
    - artifact
    - unclear
framing_definitions:
  full_body: Entire head through both feet is visible.
  cowboy_shot: Full head and torso are visible and the lower crop boundary is at mid or distal thigh.
  upper_body: Lower crop boundary is proximal thigh, pelvis, waist, or chest.
  close_up: Composition is dominated by head and shoulders with lower boundary above the chest.
  ordinal_tight_to_wide:
    - close_up
    - upper_body
    - cowboy_shot
    - full_body
standing_split_definition: Strict realization requires directly visible pelvis, both knee trajectories, one supporting
  leg and foot, and the other extended leg and raised foot clearly above hip level. Hidden geometry is never inferred.
rules:
  preserve_axis_labels_exactly: true
  preserve_axis_order: true
  output_all_active_axes_for_every_panel: true
  use_allowed_values_only: true
  visible_evidence_only: true
  enforce_visible_evidence_policy: true
  prompt_blind_freeze_required: true
  analyst_must_not_assign_target_alignment: true
  analyst_must_not_finalize_concept: true
  twenty_four_images_per_condition_are_bounded_evidence_only: true
blind_condition_label: COND-8dbb070d9059
