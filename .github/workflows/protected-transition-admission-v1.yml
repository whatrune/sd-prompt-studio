name: Protected Transition Admission V1

"on":
  workflow_dispatch:
    inputs:
      transition:
        description: Protected transition admission surface
        required: true
        type: choice
        options:
          - terminal_review_admission
          - merge_decision_admission
      task_issue_number:
        description: Current implementation Task Issue number
        required: true
        type: number
      pr_number:
        description: Current pull request number
        required: true
        type: string
      exact_head:
        description: Full current pull request HEAD SHA
        required: true
        type: string
  issue_comment:
    types:
      - created
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: read
  checks: read
  issues: read
  pull-requests: write
  statuses: read

concurrency:
  group: protected-transition-admission-v1-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || inputs.task_issue_number }}
  cancel-in-progress: false

jobs:
  protected_transition_admission_v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PTA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    outputs:
      repair_dispatch_b64: ${{ steps.evaluate.outputs.repair_dispatch_b64 }}
      repair_exact_head: ${{ steps.evaluate.outputs.repair_exact_head }}
      repair_next_action: ${{ steps.evaluate.outputs.repair_next_action }}
    steps:
      - name: Admit exact default-branch host identity
        shell: bash
        env:
          PTA_EVENT_NAME: ${{ github.event_name }}
          PTA_EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          PTA_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          workflow_ref_prefix="${GITHUB_REPOSITORY}/.github/workflows/protected-transition-admission-v1.yml@"
          [[ "$PTA_DEFAULT_BRANCH" == "main" ]]
          if [[ "$PTA_EVENT_NAME" == "pull_request" ]]; then
            [[ "$PTA_BASE_REF" == "main" ]]
            [[ "$GITHUB_REF" == "refs/pull/${PTA_EVENT_PR_NUMBER}/merge" ]]
            [[ "$GITHUB_WORKFLOW_REF" == "${workflow_ref_prefix}refs/"?* ]]
          else
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
            [[ "$GITHUB_WORKFLOW_REF" == "${workflow_ref_prefix}refs/heads/main" ]]
          fi
          [[ "$GITHUB_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact workflow SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Evaluate protected transition admission
        id: evaluate
        shell: bash
        env:
          PTA_EVENT_NAME: ${{ github.event_name }}
          PTA_EVENT_PATH: ${{ github.event_path }}
          PTA_INPUT_TRANSITION: ${{ inputs.transition }}
          PTA_INPUT_TASK_ISSUE_NUMBER: ${{ inputs.task_issue_number }}
          PTA_INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          PTA_INPUT_EXACT_HEAD: ${{ inputs.exact_head }}
        run: |
          set -euo pipefail
          result_file="$(mktemp)"
          if [[ "$PTA_EVENT_NAME" == "issue_comment" ]]; then
            node scripts/run-protected-transition-admission-v1.mjs \
              --review-event-file "$PTA_EVENT_PATH" | tee "$result_file"
          elif [[ "$PTA_EVENT_NAME" == "pull_request" ]]; then
            node scripts/run-protected-transition-admission-v1.mjs \
              --ready-event-file "$PTA_EVENT_PATH" | tee "$result_file"
          else
            node scripts/run-protected-transition-admission-v1.mjs \
              --transition "$PTA_INPUT_TRANSITION" \
              --task-issue-number "$PTA_INPUT_TASK_ISSUE_NUMBER" \
              --pr-number "$PTA_INPUT_PR_NUMBER" \
              --exact-head "$PTA_INPUT_EXACT_HEAD" | tee "$result_file"
          fi
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const output = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(output, `repair_next_action=${result.next_action ?? "NONE"}\n`);
            if (result.next_action === "REPAIR_EXECUTOR") {
              fs.appendFileSync(output, `repair_exact_head=${result.repair_dispatch.exact_head}\n`);
              fs.appendFileSync(output, `repair_dispatch_b64=${Buffer.from(JSON.stringify(result.repair_dispatch)).toString("base64")}\n`);
            }
          ' "$result_file"

  protected_transition_repair_executor_v1:
    needs: protected_transition_admission_v1
    if: needs.protected_transition_admission_v1.outputs.repair_next_action == 'REPAIR_EXECUTOR'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    outputs:
      state: ${{ steps.repair_result.outputs.state }}
      reason: ${{ steps.repair_result.outputs.reason }}
      next_action: ${{ steps.repair_result.outputs.next_action }}
      task_issue_number: ${{ steps.repair_result.outputs.task_issue_number }}
      pr_number: ${{ steps.repair_result.outputs.pr_number }}
      new_head: ${{ steps.repair_result.outputs.new_head }}
    steps:
      - name: Checkout exact repair HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.protected_transition_admission_v1.outputs.repair_exact_head }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Verify pinned ChatGPT-authenticated Codex CLI
        id: repair_provider_probe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $null = Get-Command codex.cmd -ErrorAction Stop
          $priorErrorActionPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $LASTEXITCODE = $null
            $versionOutput = [string[]]@(& codex.cmd --version 2>&1)
            $versionExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $priorErrorActionPreference
          }
          $versionOutput | ForEach-Object { Write-Output $_ }
          $version = ($versionOutput -join "`n").Trim()
          if ($versionExit -ne 0 -or $version -cne 'codex-cli 0.147.0') { throw 'repair_provider_cli_version_invalid' }
          $priorErrorActionPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $LASTEXITCODE = $null
            $loginOutput = [string[]]@(& codex.cmd login status 2>&1)
            $loginExit = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $priorErrorActionPreference
          }
          $loginOutput | ForEach-Object { Write-Output $_ }
          $loginStatus = ($loginOutput -join "`n").Trim()
          if ($loginExit -ne 0 -or $loginStatus -cne 'Logged in using ChatGPT') { throw 'repair_provider_chatgpt_login_required' }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "cli_version=$version$([Environment]::NewLine)", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "login_status=$loginStatus$([Environment]::NewLine)", $utf8NoBom)

      - name: Install frozen dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm.cmd install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'dependency_install_failed' }

      - name: Prepare current repair tuple
        id: repair_preflight
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_DISPATCH_B64: ${{ needs.protected_transition_admission_v1.outputs.repair_dispatch_b64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $dispatchPath = Join-Path $env:RUNNER_TEMP 'repair-dispatch.json'
          $preflightPath = Join-Path $env:RUNNER_TEMP 'repair-preflight.json'
          [IO.File]::WriteAllBytes($dispatchPath, [Convert]::FromBase64String($env:REPAIR_DISPATCH_B64))
          $priorErrorActionPreference = $ErrorActionPreference
          $priorConsoleOutputEncoding = [Console]::OutputEncoding
          try {
            [Console]::OutputEncoding = $utf8NoBom
            $ErrorActionPreference = 'Continue'
            $LASTEXITCODE = $null
            $preflightOutput = [string[]]@(node scripts/run-protected-transition-admission-v1.mjs --repair-preflight-file $dispatchPath 2>&1)
            $preflightExit = $LASTEXITCODE
          } finally {
            [Console]::OutputEncoding = $priorConsoleOutputEncoding
            $ErrorActionPreference = $priorErrorActionPreference
          }
          $preflightOutput | ForEach-Object { Write-Output $_ }
          [IO.File]::WriteAllLines($preflightPath, [string[]]$preflightOutput, $utf8NoBom)
          if ($preflightExit -ne 0) { throw 'repair_preflight_failed' }
          $persistedBytes = [IO.File]::ReadAllBytes($preflightPath)
          if (($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xff -and $persistedBytes[1] -eq 0xfe) -or ($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xfe -and $persistedBytes[1] -eq 0xff) -or ($persistedBytes.Length -ge 3 -and $persistedBytes[0] -eq 0xef -and $persistedBytes[1] -eq 0xbb -and $persistedBytes[2] -eq 0xbf)) { throw 'repair_preflight_encoding_invalid' }
          $result = Get-Content -LiteralPath $preflightPath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($result.next_action -cne 'REPAIR_AGENT') { throw 'repair_preflight_not_ready' }

      - name: Bind reviewed HEAD immediately before local execution
        id: repair_provider_binding
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_PROVIDER_CLI_VERSION: ${{ steps.repair_provider_probe.outputs.cli_version }}
          REPAIR_PROVIDER_LOGIN_STATUS: ${{ steps.repair_provider_probe.outputs.login_status }}
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $dispatchPath = Join-Path $env:RUNNER_TEMP 'repair-dispatch.json'
          $bindingPath = Join-Path $env:RUNNER_TEMP 'repair-provider-binding.json'
          $promptPath = Join-Path $env:RUNNER_TEMP 'repair-provider-prompt.txt'
          $priorErrorActionPreference = $ErrorActionPreference
          $priorConsoleOutputEncoding = [Console]::OutputEncoding
          try {
            [Console]::OutputEncoding = $utf8NoBom
            $ErrorActionPreference = 'Continue'
            $LASTEXITCODE = $null
            $bindingOutput = [string[]]@(node scripts/run-protected-transition-admission-v1.mjs --repair-provider-exec-bind-file $dispatchPath 2>&1)
            $bindingExit = $LASTEXITCODE
          } finally {
            [Console]::OutputEncoding = $priorConsoleOutputEncoding
            $ErrorActionPreference = $priorErrorActionPreference
          }
          $bindingOutput | ForEach-Object { Write-Output $_ }
          [IO.File]::WriteAllLines($bindingPath, [string[]]$bindingOutput, $utf8NoBom)
          if ($bindingExit -ne 0) { throw 'repair_provider_binding_failed' }
          $persistedBytes = [IO.File]::ReadAllBytes($bindingPath)
          if (($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xff -and $persistedBytes[1] -eq 0xfe) -or ($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xfe -and $persistedBytes[1] -eq 0xff) -or ($persistedBytes.Length -ge 3 -and $persistedBytes[0] -eq 0xef -and $persistedBytes[1] -eq 0xbb -and $persistedBytes[2] -eq 0xbf)) { throw 'repair_provider_binding_encoding_invalid' }
          $result = Get-Content -LiteralPath $bindingPath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($result.next_action -cne 'EXECUTE_REPAIR_AGENT') { throw 'repair_provider_not_ready' }
          [IO.File]::WriteAllText($promptPath, [string]$result.prompt, $utf8NoBom)
          if ((Get-Item -LiteralPath $promptPath).Length -ne [int64]$result.provider_projection.prompt_bytes) { throw 'repair_provider_prompt_bytes_changed' }

      - name: Execute one local blocking repair
        shell: powershell
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $promptPath = Join-Path $env:RUNNER_TEMP 'repair-provider-prompt.txt'
          $outputPath = Join-Path $env:RUNNER_TEMP 'repair-provider-output.jsonl'
          $prompt = [IO.File]::ReadAllText($promptPath, $utf8NoBom)
          $priorOutputEncoding = $OutputEncoding
          $priorConsoleOutputEncoding = [Console]::OutputEncoding
          $priorErrorActionPreference = $ErrorActionPreference
          try {
            $OutputEncoding = $utf8NoBom
            [Console]::OutputEncoding = $utf8NoBom
            $ErrorActionPreference = 'Continue'
            $LASTEXITCODE = $null
            $providerOutput = [string[]]@($prompt | & codex.cmd exec --ignore-user-config --sandbox workspace-write --approve-for-me --ephemeral --json --cd $env:GITHUB_WORKSPACE - 2>&1)
            $providerExit = $LASTEXITCODE
          } finally {
            $OutputEncoding = $priorOutputEncoding
            [Console]::OutputEncoding = $priorConsoleOutputEncoding
            $ErrorActionPreference = $priorErrorActionPreference
          }
          $providerOutput | ForEach-Object { Write-Output $_ }
          [IO.File]::WriteAllLines($outputPath, [string[]]$providerOutput, $utf8NoBom)
          if ($providerExit -ne 0) { throw "repair_provider_exec_failed_$providerExit" }
          $persistedBytes = [IO.File]::ReadAllBytes($outputPath)
          if (($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xff -and $persistedBytes[1] -eq 0xfe) -or ($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xfe -and $persistedBytes[1] -eq 0xff) -or ($persistedBytes.Length -ge 3 -and $persistedBytes[0] -eq 0xef -and $persistedBytes[1] -eq 0xbb -and $persistedBytes[2] -eq 0xbf)) { throw 'repair_provider_output_encoding_invalid' }

      - name: Rebind reviewed HEAD and project local provider completion
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $dispatchPath = Join-Path $env:RUNNER_TEMP 'repair-dispatch.json'
          $bindingPath = Join-Path $env:RUNNER_TEMP 'repair-provider-binding.json'
          $postExecPath = Join-Path $env:RUNNER_TEMP 'repair-provider-post-exec.json'
          $priorErrorActionPreference = $ErrorActionPreference
          $priorConsoleOutputEncoding = [Console]::OutputEncoding
          try {
            [Console]::OutputEncoding = $utf8NoBom
            $ErrorActionPreference = 'Continue'
            $LASTEXITCODE = $null
            $postExecOutput = [string[]]@(node scripts/run-protected-transition-admission-v1.mjs --repair-provider-post-exec-bind-file $dispatchPath --provider-binding-file $bindingPath 2>&1)
            $postExecExit = $LASTEXITCODE
          } finally {
            [Console]::OutputEncoding = $priorConsoleOutputEncoding
            $ErrorActionPreference = $priorErrorActionPreference
          }
          $postExecOutput | ForEach-Object { Write-Output $_ }
          [IO.File]::WriteAllLines($postExecPath, [string[]]$postExecOutput, $utf8NoBom)
          if ($postExecExit -ne 0) { throw 'repair_provider_post_exec_binding_failed' }
          $persistedBytes = [IO.File]::ReadAllBytes($postExecPath)
          if (($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xff -and $persistedBytes[1] -eq 0xfe) -or ($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xfe -and $persistedBytes[1] -eq 0xff) -or ($persistedBytes.Length -ge 3 -and $persistedBytes[0] -eq 0xef -and $persistedBytes[1] -eq 0xbb -and $persistedBytes[2] -eq 0xbf)) { throw 'repair_provider_post_exec_encoding_invalid' }
          $result = Get-Content -LiteralPath $postExecPath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($result.next_action -cne 'PROJECT_PROVIDER_COMPLETION') { throw 'repair_provider_diff_not_ready' }
          $providerResultPath = Join-Path $env:RUNNER_TEMP 'repair-provider-result.json'
          [IO.File]::WriteAllText($providerResultPath, '{"status":"completed","summary":"Local ChatGPT-authenticated Codex repair completed."}', $utf8NoBom)

      - name: Rebind repair paths and validation profile
        id: repair_post_agent
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $dispatchPath = Join-Path $env:RUNNER_TEMP 'repair-dispatch.json'
          $providerResultPath = Join-Path $env:RUNNER_TEMP 'repair-provider-result.json'
          $postAgentPath = Join-Path $env:RUNNER_TEMP 'repair-post-agent.json'
          $priorErrorActionPreference = $ErrorActionPreference
          $priorConsoleOutputEncoding = [Console]::OutputEncoding
          try {
            [Console]::OutputEncoding = $utf8NoBom
            $ErrorActionPreference = 'Continue'
            $LASTEXITCODE = $null
            $postAgentOutput = [string[]]@(node scripts/run-protected-transition-admission-v1.mjs --repair-post-agent-file $dispatchPath --provider-result-file $providerResultPath 2>&1)
            $postAgentExit = $LASTEXITCODE
          } finally {
            [Console]::OutputEncoding = $priorConsoleOutputEncoding
            $ErrorActionPreference = $priorErrorActionPreference
          }
          $postAgentOutput | ForEach-Object { Write-Output $_ }
          [IO.File]::WriteAllLines($postAgentPath, [string[]]$postAgentOutput, $utf8NoBom)
          if ($postAgentExit -ne 0) { throw 'repair_post_agent_failed' }
          $persistedBytes = [IO.File]::ReadAllBytes($postAgentPath)
          if (($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xff -and $persistedBytes[1] -eq 0xfe) -or ($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xfe -and $persistedBytes[1] -eq 0xff) -or ($persistedBytes.Length -ge 3 -and $persistedBytes[0] -eq 0xef -and $persistedBytes[1] -eq 0xbb -and $persistedBytes[2] -eq 0xbf)) { throw 'repair_post_agent_encoding_invalid' }
          $result = Get-Content -LiteralPath $postAgentPath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($result.next_action -cne 'VALIDATE_REPAIR') { throw 'repair_validation_not_ready' }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "profile=$($result.validation_profile)$([Environment]::NewLine)", $utf8NoBom)

      - name: Run exact repair validation profile
        shell: powershell
        env:
          REPAIR_VALIDATION_PROFILE: ${{ steps.repair_post_agent.outputs.profile }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REPAIR_VALIDATION_PROFILE -ceq 'docs_only') {
            node scripts/test-role-execution-contracts.mjs
            if ($LASTEXITCODE -ne 0) { throw 'role_contract_validation_failed' }
            git diff --check
            if ($LASTEXITCODE -ne 0) { throw 'repair_diff_check_failed' }
          } elseif ($env:REPAIR_VALIDATION_PROFILE -ceq 'protected_transition') {
            $focusedOutput = @(node scripts/test-protected-transition-admission-v1.mjs)
            if ($LASTEXITCODE -ne 0) { throw 'focused_validation_failed' }
            $focusedOutput | ForEach-Object { Write-Output $_ }
            if ($focusedOutput[-1] -cne 'protected-transition-admission-v1: 420 assertions passed') { throw 'focused_assertion_total_invalid' }
            node scripts/test-role-execution-contracts.mjs
            if ($LASTEXITCODE -ne 0) { throw 'role_contract_validation_failed' }
            pnpm.cmd run validate:dictionary
            if ($LASTEXITCODE -ne 0) { throw 'dictionary_validation_failed' }
            pnpm.cmd test
            if ($LASTEXITCODE -ne 0) { throw 'full_test_failed' }
            pnpm.cmd run build
            if ($LASTEXITCODE -ne 0) { throw 'build_failed' }
            git diff --check
            if ($LASTEXITCODE -ne 0) { throw 'repair_diff_check_failed' }
          } else {
            throw 'repair_validation_profile_invalid'
          }

      - name: Recheck current HEAD and prepare one commit
        id: repair_commit
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_VALIDATION_SUCCEEDED: "true"
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $dispatchPath = Join-Path $env:RUNNER_TEMP 'repair-dispatch.json'
          $planPath = Join-Path $env:RUNNER_TEMP 'repair-commit-plan.json'
          $priorErrorActionPreference = $ErrorActionPreference
          $priorConsoleOutputEncoding = [Console]::OutputEncoding
          try {
            [Console]::OutputEncoding = $utf8NoBom
            $ErrorActionPreference = 'Continue'
            $LASTEXITCODE = $null
            $planOutput = [string[]]@(node scripts/run-protected-transition-admission-v1.mjs --repair-commit-plan-file $dispatchPath 2>&1)
            $planExit = $LASTEXITCODE
          } finally {
            [Console]::OutputEncoding = $priorConsoleOutputEncoding
            $ErrorActionPreference = $priorErrorActionPreference
          }
          $planOutput | ForEach-Object { Write-Output $_ }
          [IO.File]::WriteAllLines($planPath, [string[]]$planOutput, $utf8NoBom)
          if ($planExit -ne 0) { throw 'repair_commit_plan_failed' }
          $persistedBytes = [IO.File]::ReadAllBytes($planPath)
          if (($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xff -and $persistedBytes[1] -eq 0xfe) -or ($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xfe -and $persistedBytes[1] -eq 0xff) -or ($persistedBytes.Length -ge 3 -and $persistedBytes[0] -eq 0xef -and $persistedBytes[1] -eq 0xbb -and $persistedBytes[2] -eq 0xbf)) { throw 'repair_commit_plan_encoding_invalid' }
          $plan = Get-Content -LiteralPath $planPath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($plan.next_action -cne 'COMMIT_AND_PUSH' -or $plan.force -or $plan.commit_count -ne 1) { throw 'repair_commit_plan_invalid' }
          $repairPaths = @($plan.paths)
          git add -- $repairPaths
          if ($LASTEXITCODE -ne 0) { throw 'repair_stage_failed' }
          $stagedPaths = @(git diff --cached --name-only)
          if ($stagedPaths.Count -eq 0 -or (Compare-Object ($repairPaths | Sort-Object) ($stagedPaths | Sort-Object))) { throw 'repair_staged_scope_invalid' }
          git -c user.name='protected-transition-repair-v1' -c user.email='protected-transition-repair-v1@users.noreply.github.com' commit -m 'fix current protected transition blockers'
          if ($LASTEXITCODE -ne 0) { throw 'repair_commit_failed' }
          if ((git rev-list --count HEAD^..HEAD) -ne '1') { throw 'repair_commit_count_invalid' }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "head_ref=$($plan.head_ref)$([Environment]::NewLine)", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "new_head=$(git rev-parse HEAD)$([Environment]::NewLine)", $utf8NoBom)

      - name: Push one normal non-force repair commit
        shell: powershell
        env:
          REPAIR_EXECUTOR_PUSH_TOKEN: ${{ secrets.REPAIR_EXECUTOR_PUSH_TOKEN }}
          REPAIR_HEAD_REF: ${{ steps.repair_commit.outputs.head_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          git push --porcelain "https://x-access-token:$($env:REPAIR_EXECUTOR_PUSH_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git" "HEAD:refs/heads/$($env:REPAIR_HEAD_REF)"
          if ($LASTEXITCODE -ne 0) { throw 'repair_push_failed' }

      - name: Rebind existing state and hand off fresh review
        id: repair_result
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_NEW_HEAD: ${{ steps.repair_commit.outputs.new_head }}
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $dispatchPath = Join-Path $env:RUNNER_TEMP 'repair-dispatch.json'
          $evidencePath = Join-Path $env:RUNNER_TEMP 'repair-post-agent.json'
          $resultPath = Join-Path $env:RUNNER_TEMP 'repair-result.json'
          $priorErrorActionPreference = $ErrorActionPreference
          $priorConsoleOutputEncoding = [Console]::OutputEncoding
          try {
            [Console]::OutputEncoding = $utf8NoBom
            $ErrorActionPreference = 'Continue'
            $LASTEXITCODE = $null
            $resultOutput = [string[]]@(node scripts/run-protected-transition-admission-v1.mjs --repair-result-file $dispatchPath --repair-evidence-file $evidencePath --new-head $env:REPAIR_NEW_HEAD 2>&1)
            $resultExit = $LASTEXITCODE
          } finally {
            [Console]::OutputEncoding = $priorConsoleOutputEncoding
            $ErrorActionPreference = $priorErrorActionPreference
          }
          $resultOutput | ForEach-Object { Write-Output $_ }
          [IO.File]::WriteAllLines($resultPath, [string[]]$resultOutput, $utf8NoBom)
          if ($resultExit -ne 0) { throw 'repair_result_failed' }
          $persistedBytes = [IO.File]::ReadAllBytes($resultPath)
          if (($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xff -and $persistedBytes[1] -eq 0xfe) -or ($persistedBytes.Length -ge 2 -and $persistedBytes[0] -eq 0xfe -and $persistedBytes[1] -eq 0xff) -or ($persistedBytes.Length -ge 3 -and $persistedBytes[0] -eq 0xef -and $persistedBytes[1] -eq 0xbb -and $persistedBytes[2] -eq 0xbf)) { throw 'repair_result_encoding_invalid' }
          $result = Get-Content -LiteralPath $resultPath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($result.state -cne 'REVIEW_PENDING' -or $result.reason -cne 'fresh_review_required' -or $result.next_action -cne 'REVIEW' -or $result.current_head -cne $env:REPAIR_NEW_HEAD) { throw 'repair_result_invalid' }
          @{
            state = $result.state
            reason = $result.reason
            next_action = $result.next_action
            task_issue_number = $result.task_issue_number
            pr_number = $result.pr_number
            new_head = $result.current_head
          }.GetEnumerator() | ForEach-Object {
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$($_.Key)=$($_.Value)$([Environment]::NewLine)", $utf8NoBom)
          }
