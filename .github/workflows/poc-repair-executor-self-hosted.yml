name: PoC Repair Executor Self Hosted

on:
  push:
    branches:
      - poc/repair-executor-architecture-compare

permissions:
  contents: read

jobs:
  poc_self_hosted:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Probe runner, Codex, local Git credentials and Codex exec
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'POC_PWSH_MAJOR_INVALID' }
          $git = (Get-Command git.exe -ErrorAction Stop).Source
          $codex = (Get-Command codex.cmd -ErrorAction Stop).Source
          $repoUrl = "https://github.com/$env:GITHUB_REPOSITORY.git"
          $remoteBranch = "poc/self-hosted-roundtrip-$env:GITHUB_RUN_ID"
          $remoteCreated = $false

          Write-Host "POC user=$([Environment]::UserDomainName)\$([Environment]::UserName)"
          & $codex --version
          if ($LASTEXITCODE -ne 0) { throw 'POC_CODEX_VERSION_FAILED' }
          & $codex login status
          if ($LASTEXITCODE -ne 0) { throw 'POC_CODEX_LOGIN_FAILED' }

          & $git ls-remote --heads $repoUrl "refs/heads/$env:GITHUB_REF_NAME" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'POC_GIT_PUBLIC_READ_FAILED' }

          $before = (& $git status --porcelain=v1 --untracked-files=all) -join "`n"
          if ($LASTEXITCODE -ne 0 -or -not [string]::IsNullOrWhiteSpace($before)) { throw 'POC_WORKTREE_NOT_CLEAN_BEFORE' }

          $prompt = 'Do not modify files. Inspect the repository and respond with exactly SELF_HOSTED_POC_OK.'
          & $codex exec $prompt
          if ($LASTEXITCODE -ne 0) { throw 'POC_CODEX_EXEC_FAILED' }

          $after = (& $git status --porcelain=v1 --untracked-files=all) -join "`n"
          if ($LASTEXITCODE -ne 0 -or -not [string]::IsNullOrWhiteSpace($after)) { throw 'POC_WORKTREE_NOT_CLEAN_AFTER' }

          try {
            & $git push $repoUrl "HEAD:refs/heads/$remoteBranch"
            if ($LASTEXITCODE -ne 0) { throw 'POC_LOCAL_CREDENTIAL_PUSH_FAILED' }
            $remoteCreated = $true
            & $git ls-remote --exit-code --heads $repoUrl "refs/heads/$remoteBranch" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'POC_LOCAL_CREDENTIAL_VERIFY_FAILED' }
            & $git push $repoUrl --delete $remoteBranch
            if ($LASTEXITCODE -ne 0) { throw 'POC_LOCAL_CREDENTIAL_DELETE_FAILED' }
            $remoteCreated = $false
          } finally {
            if ($remoteCreated) { & $git push $repoUrl --delete $remoteBranch 2>$null | Out-Null }
          }

          Write-Host 'SELF_HOSTED_POC_PASS'
