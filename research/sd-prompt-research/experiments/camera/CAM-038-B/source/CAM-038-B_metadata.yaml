factorial_decision_contract:
  factorial_family: S, B, K, SxB, SxK, BxK, and SxBxK effect-coded contrasts across complete matched-seed blocks
  factorial_estimand: mean effect-coded contrast on binary requested upper-body realization; positive means greater upper-body realization at the positive factor/interaction level
  factorial_test: two-sided exact within-seed sign-flip randomization test for each of seven predeclared factorial contrasts
  factorial_multiplicity: Holm step-down family-wise alpha 0.05 across the seven factorial hypotheses
  control_family: B through H independently compared with A
  control_test: one-sided exact McNemar/sign test conditional on discordant pairs under null degradation probability 0.5
  control_multiplicity: Holm step-down family-wise alpha 0.05 across seven control comparisons
  sidedness: factorial effects two-sided; treatment-versus-control degradation comparisons one-sided
  supported: all prerequisites pass and at least one predeclared factorial effect rejects after Holm correction; report only the exact supported effects and directions
  otherwise: INCONCLUSIVE; non-rejection is not evidence of equivalence or no meaningful effect
  prerequisites:
    - exact endpoint, checkpoint SHA-256, and CAM-036/CAM-037/CAM-024 settings pass before generation
    - 24 seeds are unique, collision-free against tracked Research, and shared exactly across A through H
    - 192 independent one-image responses are bound exactly to request seed and parameters
    - all 192 panels have valid PNG/hash provenance
    - all 192 panels are framing-boundary assessable
    - ambiguity/artifact is at most 1/24 in each arm
