schema_version: '1.0'
module: hair_observation
optional: true
enabled_by_default: false
panel_count: 6
visible_evidence_only: true
active_hair_axes:
  - hair_length_extent
  - neck_hair_overlap
  - shoulder_hair_overlap
  - hair_identity_clarity
axis_catalog:
  hair_length_extent:
    definition: Visible lower extent of identifiable hair relative to the neck, shoulders, and waist.
    allowed_values: [above_neck, neck_to_shoulder, below_shoulder, waist_or_longer, unclear, not_visible]
  neck_hair_overlap:
    definition: Whether identifiable hair visibly overlaps the neck region.
    allowed_values: [present, absent, unclear, not_visible]
  shoulder_hair_overlap:
    definition: Whether identifiable hair visibly overlaps either shoulder region.
    allowed_values: [present, absent, unclear, not_visible]
  hair_identity_clarity:
    definition: Whether visible pixels can be identified as hair rather than clothing, background, or artifact.
    allowed_values: [distinct, ambiguous_with_clothing, ambiguous_with_background, artifact, not_visible]
rules:
  image_analyst_must_not_use_prompt_as_evidence: true
  image_analyst_must_not_assign_source_concept: true
  image_analyst_must_not_assign_hair_length_meaning: true
  preserve_axis_order: true
  require_all_axes_for_every_panel: true
  require_evidence_notes: true
  no_additional_observation_axes: true
  identity_ambiguity_must_not_be_resolved_by_prompt_text: true
