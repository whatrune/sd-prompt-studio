schema_version: "3.0"
target_concept: ""
blind_analysis: true
special_values:
  unclear: Visible evidence is insufficient or conflicting.
  not_visible: The relevant evidence is cropped or fully obscured.
axis_catalog:
  frame_roll_orientation:
    label: Frame Roll Orientation
    allowed_values:
      - level
      - clockwise
      - counterclockwise
      - unclear
  roll_magnitude:
    label: Roll Magnitude
    allowed_values:
      - none_or_minimal
      - mild
      - strong
      - unclear
  environmental_level_reference:
    label: Environmental Level Reference
    allowed_values:
      - clear
      - partial
      - absent
      - unclear
  subject_vertical_axis:
    label: Subject Vertical Axis
    allowed_values:
      - upright_in_frame
      - tilted_clockwise
      - tilted_counterclockwise
      - unclear
  roll_assessability:
    label: Roll Assessability
    allowed_values:
      - assessable
      - unassessable
      - unclear
  full_body_visibility:
    label: Full Body Visibility
    allowed_values:
      - visible
      - partial
      - not_visible
      - unclear
  ambiguity_or_artifact:
    label: Ambiguity Or Artifact
    allowed_values:
      - none
      - roll_ambiguous
      - anatomy_artifact
      - composition_artifact
      - multiple
active_observation_axes:
  - frame_roll_orientation
  - roll_magnitude
  - environmental_level_reference
  - subject_vertical_axis
  - roll_assessability
  - full_body_visibility
  - ambiguity_or_artifact
contact_load:
  enabled: false
  fields:
    - left_hand
    - right_hand
    - left_forearm
    - right_forearm
  allowed_values:
    - none
    - light
    - supporting
    - weight_bearing
    - unclear
morphology_candidates:
  primary:
    - camera_roll_observation
  secondary:
    - none
artifact_checks:
  - none
  - roll_ambiguous
  - anatomy_artifact
  - composition_artifact
  - multiple
cross_domain_effects:
  enabled: false
  domains: []
  strength_values: []
  effect_type_values: []
rules:
  preserve_axis_labels_exactly: true
  preserve_axis_order: true
  output_all_active_axes_for_every_panel: true
  use_allowed_values_only: true
  visible_evidence_only: true
  enforce_visible_evidence_policy: true
  prompt_blind_freeze_required: true
  analyst_must_not_assign_target_alignment: true
  analyst_must_not_finalize_concept: true
  six_images_are_camera_roll_evidence_only: true
blind_condition_label: COND-M9
run_id: CAM-009-A
